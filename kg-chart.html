      ctx.strokeStyle = C.muted; ctx.lineWidth = 1; ctx.setLineDash([4, 3]); ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.moveTo(tomoX, PAD.t); ctx.lineTo(tomoX, PAD.t + ch); ctx.stroke();
      ctx.restore();
    }
  }

  let lineColors = [cfg.color, C.purple, C.orange, C.cyan];
  // 주선=노랑 / 시그널선=빨강 으로 통일하는 지표들
  if (key === 'MACD' || key === 'SLOWSTOCH' || key === 'STOCH') lineColors = ['#ffd54f', '#ef5350', C.orange, C.cyan];

  // ── PVT: 전고점·전저점 돌파 + 주가 다이버전스 (책 매매법) ──
  if (key === 'PVT') {
    const arr = vals[0], sig = vals[1];
    const base = state.data.slice(...state.range);   // 같은 구간 주가

    // 직전 고점/저점 (현재 구간에서 마지막 값 제외한 이전 최고·최저)
    let pHi = -Infinity, pLo = Infinity;
    for (let i = 0; i < n - 1; i++) {
      if (arr[i] == null) continue;
      if (arr[i] > pHi) pHi = arr[i];
      if (arr[i] < pLo) pLo = arr[i];
    }
    if (isFinite(pHi)) {
      ctx.strokeStyle = '#ef535066'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(PAD.l, yOf(pHi)); ctx.lineTo(W - PAD.r, yOf(pHi)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '9px monospace'; ctx.textAlign = 'left';
      ctx.fillStyle = '#ef535099'; ctx.fillText('전고점', PAD.l + 3, yOf(pHi) - 3);
    }
    if (isFinite(pLo)) {
      ctx.strokeStyle = '#2979ff66'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(PAD.l, yOf(pLo)); ctx.lineTo(W - PAD.r, yOf(pLo)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '9px monospace'; ctx.textAlign = 'left';
      ctx.fillStyle = '#2979ff99'; ctx.fillText('전저점', PAD.l + 3, yOf(pLo) + 10);
    }

    // 시그널선 (9일 지수이동평균)
    if (sig) {
      ctx.strokeStyle = '#8b949e'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
      ctx.beginPath(); let s0 = false;
      sig.forEach((v, i) => { if (v == null) return; s0 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s0 = true); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    // PVT 본선
    ctx.strokeStyle = '#4ecdc4'; ctx.lineWidth = 1.8;
    ctx.beginPath(); let s1 = false;
    arr.forEach((v, i) => { if (v == null) return; s1 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s1 = true); });
    ctx.stroke();

    // 다이버전스: 주가와 PVT의 방향이 엇갈리면 추세전환 신호
    const LB = Math.max(10, Math.floor(n / 6));
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    for (let i = LB; i < n; i += Math.max(3, Math.floor(LB / 2))) {
      if (arr[i] == null || arr[i - LB] == null || !base[i] || !base[i - LB]) continue;
      const dP = base[i].close - base[i - LB].close;
      const dV = arr[i] - arr[i - LB];
      const pPct = Math.abs(dP / (base[i - LB].close || 1));
      if (pPct < 0.04) continue;                    // 주가 변동이 미미하면 건너뜀
      if (dP > 0 && dV <= 0) {                      // 주가↑ PVT↓ → 매도
        const x = xOf(i), y = yOf(arr[i]);
        ctx.fillStyle = '#ef5350';
        ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x - 5, y - 17); ctx.lineTo(x + 5, y - 17); ctx.closePath(); ctx.fill();
        ctx.fillText('매도', x, y - 21);
      } else if (dP < 0 && dV >= 0) {               // 주가↓ PVT↑ → 매입
        const x = xOf(i), y = yOf(arr[i]);
        ctx.fillStyle = '#2979ff';
        ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.lineTo(x - 5, y + 17); ctx.lineTo(x + 5, y + 17); ctx.closePath(); ctx.fill();
        ctx.fillText('매입', x, y + 28);
      }
    }

    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
    }

    // 레이블
    const lastP = arr.filter(v => v != null).slice(-1)[0];
    const fmtN = v => Math.abs(v) >= 1e8 ? (v / 1e8).toFixed(1) + '억' : Math.abs(v) >= 1e4 ? (v / 1e4).toFixed(1) + '만' : v.toFixed(0);
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = C.muted; ctx.fillText('PVT 거래량추세지수', PAD.l + 22, PAD.t + 11);
    if (lastP != null) { ctx.fillStyle = '#4ecdc4'; ctx.fillText(fmtN(lastP), PAD.l + 150, PAD.t + 11); }
    ctx.fillStyle = C.muted; ctx.font = '10px monospace';
    ctx.fillText(fmtN(maxV), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(fmtN(minV), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  // ── Inertia 관성지수: 40/60 기준선 + 시그널곡선 교차 매매 ──
  if (key === 'INERTIA') {
    const inrRaw = vals[0], sigRaw = vals[1];
    // 표시 범위(30~80)를 벗어난 값은 그리지 않음 — 범위 안에 들어온 값만 표시
    const clip = a => a ? a.map(v => (v == null || v < 30 || v > 80) ? null : v) : a;
    const inr = clip(inrRaw), sig = clip(sigRaw);
    const y60 = yOf(60), y40 = yOf(40);

    // 기준선 60 / 40 (가로 점선)
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.strokeStyle = '#ef535088';
    ctx.beginPath(); ctx.moveTo(PAD.l, y60); ctx.lineTo(W - PAD.r, y60); ctx.stroke();
    ctx.strokeStyle = '#2979ff88';
    ctx.beginPath(); ctx.moveTo(PAD.l, y40); ctx.lineTo(W - PAD.r, y40); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '9px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ef535088'; ctx.fillText('60', PAD.l + 3, y60 - 3);
    ctx.fillStyle = '#2979ff88'; ctx.fillText('40', PAD.l + 3, y40 + 10);

    // Inertia와 시그널 사이 간격을 색으로 채움 — 위=파랑(강세) / 아래=빨강(약세)
    if (sig) {
      for (let i = 0; i < n - 1; i++) {
        const a0 = inr[i], a1 = inr[i + 1], b0 = sig[i], b1 = sig[i + 1];
        if (a0 == null || a1 == null || b0 == null || b1 == null) continue;
        ctx.fillStyle = (a0 >= b0) ? 'rgba(41,121,255,0.22)' : 'rgba(239,83,80,0.22)';
        ctx.beginPath();
        ctx.moveTo(xOf(i), yOf(a0)); ctx.lineTo(xOf(i + 1), yOf(a1));
        ctx.lineTo(xOf(i + 1), yOf(b1)); ctx.lineTo(xOf(i), yOf(b0));
        ctx.closePath(); ctx.fill();
      }
    }

    // 시그널곡선 (회색 파선)
    if (sig) {
      ctx.strokeStyle = '#ef5350'; ctx.lineWidth = 1.2; ctx.setLineDash([5, 3]);
      ctx.beginPath(); let s0 = false;
      sig.forEach((v, i) => { if (v == null) return; s0 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s0 = true); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    // Inertia 본선 (노랑 굵은 선)
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1.8;
    ctx.beginPath(); let s1 = false;
    inr.forEach((v, i) => { if (v == null) return; s1 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s1 = true); });
    ctx.stroke();

    // 매매: Inertia가 시그널곡선을 상향돌파=매입 / 하향돌파=매도
    if (sig) {
      ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
      // 교차 후 방향이 유지되고 충분히 벌어질 때만 표시 (미세 교차 노이즈 제거)
      const isReal = (i, up) => {
        let mx = 0, hold = 0;
        for (let k = i; k < Math.min(n, i + 6); k++) {
          if (inrRaw[k] == null || sigRaw[k] == null) break;
          const gap = up ? (inrRaw[k] - sigRaw[k]) : (sigRaw[k] - inrRaw[k]);
          if (gap <= 0) break;          // 방향이 바로 뒤집히면 노이즈
          hold++;
          if (gap > mx) mx = gap;
        }
        return hold >= 3 && mx >= 0.4;  // 3봉 이상 유지 + 최소 간격 확보
      };
      for (let i = 1; i < n; i++) {
        const a0 = inrRaw[i - 1], a1 = inrRaw[i], b0 = sigRaw[i - 1], b1 = sigRaw[i];
        if (a0 == null || a1 == null || b0 == null || b1 == null) continue;
        const ay = Math.max(30, Math.min(80, a1));   // 표시 위치만 범위 안으로
        if (a0 <= b0 && a1 > b1 && isReal(i, true)) {          // 매입
          const x = xOf(i), y = yOf(ay);
          ctx.strokeStyle = '#2979ff66'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, PAD.t + ch); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = '#2979ff';
          ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x, y + 9); ctx.lineTo(x - 5, y + 18); ctx.lineTo(x + 5, y + 18); ctx.closePath(); ctx.fill();
          ctx.fillText('매입', x, y + 29);
        }
        if (a0 >= b0 && a1 < b1 && isReal(i, false)) {          // 매도
          const x = xOf(i), y = yOf(ay);
          ctx.strokeStyle = '#ef535066'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, PAD.t + ch); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = '#ef5350';
          ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x, y - 9); ctx.lineTo(x - 5, y - 18); ctx.lineTo(x + 5, y - 18); ctx.closePath(); ctx.fill();
          ctx.fillText('매도', x, y - 22);
        }
      }
    }

    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
      const hv = inrRaw[state.hoverIdx];
      if (hv != null) {
        const hy = yOf(Math.max(30, Math.min(80, hv)));
        ctx.fillStyle = '#331a1a'; ctx.fillRect(W - PAD.r + 1, hy - 7, PAD.r - 2, 14);
        ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1; ctx.strokeRect(W - PAD.r + 1, hy - 7, PAD.r - 2, 14);
        ctx.fillStyle = '#ffd54f'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
        ctx.fillText(hv.toFixed(1), W - PAD.r + 3, hy + 3);
      }
    }

    // 레이블
    const lastI = inrRaw.filter(v => v != null).slice(-1)[0];
    const lastS = sigRaw ? sigRaw.filter(v => v != null).slice(-1)[0] : null;
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = C.muted; ctx.fillText('Inertia 관성지수', PAD.l + 22, PAD.t + 11);
    if (lastI != null) { ctx.fillStyle = '#ffd54f'; ctx.fillText('Inertia ' + lastI.toFixed(1), PAD.l + 128, PAD.t + 11); }
    if (lastS != null) { ctx.fillStyle = '#ef5350'; ctx.fillText('Signal ' + lastS.toFixed(1), PAD.l + 218, PAD.t + 11); }
    if (lastI != null && lastS != null) {
      const df = lastI - lastS;
      ctx.fillStyle = df >= 0 ? '#ef5350' : '#1976d2';
      ctx.fillText((df >= 0 ? '▲' : '▼') + Math.abs(df).toFixed(2) + (df >= 0 ? ' 강세' : ' 약세'), PAD.l + 300, PAD.t + 11);
    }
    ctx.fillStyle = C.muted; ctx.font = '10px monospace';
    ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  // ── RVI: 60/40 기준선 + 과열·과매도 색칠 + 매매지점 ──
  if (key === 'RVI') {
    const raw = vals[0];
    // 표시 범위(20~80)를 벗어난 값은 그리지 않음 — 범위 안에 들어온 값만 표시
    const arr = raw.map(v => (v == null || v < 20 || v > 80) ? null : v);
    const y60 = yOf(60), y40 = yOf(40);

    // 과열(60↑) 영역 채움 — 빨강
    ctx.fillStyle = 'rgba(239,83,80,0.13)';
    ctx.beginPath(); let open1 = false;
    for (let i = 0; i < n; i++) {
      const v = arr[i];
      if (v == null || v <= 60) { if (open1) { ctx.lineTo(xOf(i - 1), y60); ctx.closePath(); ctx.fill(); open1 = false; } continue; }
      if (!open1) { ctx.beginPath(); ctx.moveTo(xOf(i), y60); open1 = true; }
      ctx.lineTo(xOf(i), yOf(v));
    }
    if (open1) { ctx.lineTo(xOf(n - 1), y60); ctx.closePath(); ctx.fill(); }

    // 과매도(40↓) 영역 채움 — 파랑
    ctx.fillStyle = 'rgba(41,121,255,0.13)';
    let open2 = false;
    for (let i = 0; i < n; i++) {
      const v = arr[i];
      if (v == null || v >= 40) { if (open2) { ctx.lineTo(xOf(i - 1), y40); ctx.closePath(); ctx.fill(); open2 = false; } continue; }
      if (!open2) { ctx.beginPath(); ctx.moveTo(xOf(i), y40); open2 = true; }
      ctx.lineTo(xOf(i), yOf(v));
    }
    if (open2) { ctx.lineTo(xOf(n - 1), y40); ctx.closePath(); ctx.fill(); }

    // 기준선 60 (빨강 점선) / 40 (파랑 점선)
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.strokeStyle = '#ef5350aa';
    ctx.beginPath(); ctx.moveTo(PAD.l, y60); ctx.lineTo(W - PAD.r, y60); ctx.stroke();
    ctx.strokeStyle = '#2979ffaa';
    ctx.beginPath(); ctx.moveTo(PAD.l, y40); ctx.lineTo(W - PAD.r, y40); ctx.stroke();
    ctx.setLineDash([]);
    // 기준선 라벨
    ctx.font = '9px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ef5350aa'; ctx.fillText('60 과열 · 이탈 시 매도', PAD.l + 3, y60 - 3);
    ctx.fillStyle = '#2979ffaa'; ctx.fillText('40 과매도 · 돌파 시 매입', PAD.l + 3, y40 + 10);

    // RVI 본선
    ctx.strokeStyle = '#bc8cff'; ctx.lineWidth = 1.8;
    ctx.beginPath(); let st = false;
    arr.forEach((v, i) => { if (v == null) return; st ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), st = true); });
    ctx.stroke();

    // 매매 지점: 40 상향돌파=매입 / 60 하향돌파=매도
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    for (let i = 1; i < n; i++) {
      const p = raw[i - 1], v0 = raw[i];
      if (p == null || v0 == null) continue;
      const v = Math.max(20, Math.min(80, v0));   // 표시 위치만 범위 안으로
      if (p < 40 && v0 >= 40) {         // 매입 — 40 이하에서 40선 상승 돌파
        const x = xOf(i), y = yOf(v);
        ctx.fillStyle = '#2979ff';
        ctx.beginPath(); ctx.moveTo(x, y + 8); ctx.lineTo(x - 5, y + 17); ctx.lineTo(x + 5, y + 17); ctx.closePath(); ctx.fill();
        ctx.fillText('매입', x, y + 28);
      }
      if (p > 60 && v0 <= 60) {         // 매도 — 60 이상에서 60선 하향 돌파
        const x = xOf(i), y = yOf(v);
        ctx.fillStyle = '#ef5350';
        ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x - 5, y - 17); ctx.lineTo(x + 5, y - 17); ctx.closePath(); ctx.fill();
        ctx.fillText('매도', x, y - 21);
      }
    }

    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
      const hv = raw[state.hoverIdx];
      if (hv != null) {
        const hy = yOf(Math.max(20, Math.min(80, hv)));
        ctx.fillStyle = '#2a1a3a'; ctx.fillRect(W - PAD.r + 1, hy - 7, PAD.r - 2, 14);
        ctx.strokeStyle = '#bc8cff'; ctx.lineWidth = 1; ctx.strokeRect(W - PAD.r + 1, hy - 7, PAD.r - 2, 14);
        ctx.fillStyle = '#bc8cff'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
        ctx.fillText(hv.toFixed(1), W - PAD.r + 3, hy + 3);
      }
    }

    // 레이블
    const lastR = raw.filter(v => v != null).slice(-1)[0];
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = C.muted; ctx.fillText('RVI 상대변동성지수', PAD.l + 22, PAD.t + 11);
    if (lastR != null) {
      ctx.fillStyle = lastR >= 60 ? '#ef5350' : lastR <= 40 ? '#2979ff' : '#bc8cff';
      ctx.fillText(lastR.toFixed(1) + (lastR >= 60 ? ' 과열' : lastR <= 40 ? ' 과매도' : ''), PAD.l + 150, PAD.t + 11);
    }
    ctx.fillStyle = C.muted; ctx.font = '10px monospace';
    ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  // ── ADXR: 20 기준으로 추세장/횡보장 구분 (책 스타일) ──
  if (key === 'ADXR') {
    const adxr = vals[0], adxLine = vals[1], pdi = vals[2], ndi = vals[3];
    // 배경 색칠: 추세장(ADXR≥20)이면 DMI 방향에 따라 상승=빨강 / 하락=파랑 (횡보는 색 없음)
    if (pdi && ndi) {
      const colW = cw / n;
      for (let i = 0; i < n; i++) {
        if (adxr[i] == null || pdi[i] == null || ndi[i] == null) continue;
        if (adxr[i] < 20) continue;                    // 횡보장은 색칠 안 함
        ctx.fillStyle = (pdi[i] >= ndi[i]) ? 'rgba(239,83,80,0.10)' : 'rgba(41,121,255,0.10)';
        ctx.fillRect(PAD.l + i * colW, PAD.t, colW + 0.5, ch);
      }
    }
    // 기준선 20 — X축 방향 가로 점선
    const y20 = yOf(20);
    ctx.strokeStyle = '#e0b341aa'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y20); ctx.lineTo(W - PAD.r, y20); ctx.stroke();
    ctx.setLineDash([]);
    // 기준선 라벨
    ctx.font = '9px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#e0b341aa'; ctx.fillText('20', PAD.l + 3, y20 - 3);
    // 참고선: ADX(옅은 초록)
    if (adxLine) {
      ctx.strokeStyle = 'rgba(63,185,80,0.45)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); let s0 = false;
      adxLine.forEach((v, i) => { if (v == null) return; s0 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s0 = true); });
      ctx.stroke(); ctx.setLineDash([]);
    }
    // ADXR 본선 (굵게)
    ctx.strokeStyle = '#e0b341'; ctx.lineWidth = 2; ctx.setLineDash([]);
    ctx.beginPath(); let s1 = false;
    adxr.forEach((v, i) => { if (v == null) return; s1 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s1 = true); });
    ctx.stroke();
    // 20선 돌파/이탈 표시
    for (let i = 1; i < n; i++) {
      if (adxr[i] == null || adxr[i - 1] == null) continue;
      if (adxr[i - 1] < 20 && adxr[i] >= 20) {        // 추세장 진입
        ctx.fillStyle = '#e0b341';
        ctx.beginPath();
        ctx.moveTo(xOf(i), yOf(adxr[i]) - 12); ctx.lineTo(xOf(i) - 4, yOf(adxr[i]) - 19); ctx.lineTo(xOf(i) + 4, yOf(adxr[i]) - 19);
        ctx.closePath(); ctx.fill();
      }
      if (adxr[i - 1] >= 20 && adxr[i] < 20) {        // 횡보장 진입
        ctx.fillStyle = '#8b949e';
        ctx.beginPath();
        ctx.moveTo(xOf(i), yOf(adxr[i]) + 12); ctx.lineTo(xOf(i) - 4, yOf(adxr[i]) + 19); ctx.lineTo(xOf(i) + 4, yOf(adxr[i]) + 19);
        ctx.closePath(); ctx.fill();
      }
    }
    // 현재 상태 라벨
    const lastV = adxr.filter(v => v != null).slice(-1)[0];
    if (lastV != null) {
      ctx.font = 'bold 9px monospace'; ctx.textAlign = 'left';
      // 마지막 유효 인덱스의 DMI 방향
      let dir = '';
      if (pdi && ndi) {
        for (let i = n - 1; i >= 0; i--) { if (pdi[i] != null && ndi[i] != null) { dir = pdi[i] >= ndi[i] ? '상승' : '하락'; break; } }
      }
      if (lastV >= 20) {
        ctx.fillStyle = dir === '상승' ? '#ef5350' : dir === '하락' ? '#2979ff' : '#e0b341';
        ctx.fillText((dir ? dir + ' ' : '') + '추세장', PAD.l + 5, PAD.t + 22);
      } else {
        ctx.fillStyle = '#8b949e';
        ctx.fillText('횡보장', PAD.l + 5, PAD.t + 22);
      }
    }
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
      const hv = adxr[state.hoverIdx];
      if (hv != null) {
        const hy = yOf(hv);
        ctx.fillStyle = '#332800'; ctx.fillRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1; ctx.strokeRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.fillStyle = '#ffd54f'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
        ctx.fillText(hv.toFixed(1), W-PAD.r+3, hy+3);
      }
    }
    // 레이블
    const lastA = adxLine ? adxLine.filter(v=>v!=null).slice(-1)[0] : null;
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = C.muted; ctx.fillText('ADXR 평균방향성지표순위', PAD.l + 22, PAD.t + 11);
    ctx.fillStyle = '#e0b341'; ctx.fillText('ADXR ' + (lastV!=null?lastV.toFixed(1):''), PAD.l + 178, PAD.t + 11);
    if (lastA != null) { ctx.fillStyle = '#3fb950'; ctx.fillText('ADX ' + lastA.toFixed(1), PAD.l + 248, PAD.t + 11); }
    ctx.fillStyle = C.muted; ctx.font = '10px monospace';
    ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  // ── ADX/DMI: 책 스타일 (+DI 빨강 / -DI 파랑 + 교차 매수매도) ──
  if (key === 'ADX') {
    // vals: [adx, pdi, ndi]
    const pdi = vals[1], ndi = vals[2];
    const drawLine = (arr, color, width) => {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash([]);
      ctx.beginPath(); let s = false;
      arr.forEach((v,i) => { if (v==null) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); });
      ctx.stroke();
    };
    // +DI 빨강, -DI 파랑
    drawLine(pdi, '#ffd54f', 1.6);
    drawLine(ndi, '#ef5350', 1.6);
    // 교차 신호: +DI가 -DI 상향돌파=매수(▲), 하향돌파=매도(▼)
    for (let i = 1; i < n; i++) {
      if (pdi[i]==null||ndi[i]==null||pdi[i-1]==null||ndi[i-1]==null) continue;
      const prevDiff = pdi[i-1]-ndi[i-1], curDiff = pdi[i]-ndi[i];
      if (prevDiff<=0 && curDiff>0) {
        // 매수 ▲ (빨강, 교차점 아래)
        const y = yOf(pdi[i]);
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath();
        ctx.moveTo(xOf(i), y+13); ctx.lineTo(xOf(i)-4, y+20); ctx.lineTo(xOf(i)+4, y+20); ctx.closePath(); ctx.fill();
      }
      if (prevDiff>=0 && curDiff<0) {
        // 매도 ▼ (파랑, 교차점 위)
        const y = yOf(pdi[i]);
        ctx.fillStyle = '#1976d2';
        ctx.beginPath();
        ctx.moveTo(xOf(i), y-13); ctx.lineTo(xOf(i)-4, y-20); ctx.lineTo(xOf(i)+4, y-20); ctx.closePath(); ctx.fill();
      }
    }
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
      // 호버 위치의 값을 y축에 표시
      const hv = vals[0] ? vals[0][state.hoverIdx] : null;
      if (hv != null) {
        const hy = yOf(hv);
        const hvFmt = Math.abs(hv) >= 1e8 ? (hv/1e8).toFixed(1)+'억' : Math.abs(hv) >= 1e4 ? (hv/1e4).toFixed(1)+'만' : hv >= 100 ? Math.round(hv).toLocaleString() : hv.toFixed(2);
        ctx.fillStyle = '#332800'; ctx.fillRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1; ctx.strokeRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.fillStyle = '#ffd54f'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
        ctx.fillText(hvFmt, W-PAD.r+3, hy+3);
      }
    }
    // 레이블
    const lastP = pdi.filter(v=>v!=null).slice(-1)[0];
    const lastN = ndi.filter(v=>v!=null).slice(-1)[0];
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = C.muted; ctx.fillText('DMI 방향성지수', PAD.l + 22, PAD.t + 11);
    ctx.fillStyle = '#ffd54f'; ctx.fillText('+DI ' + (lastP!=null?lastP.toFixed(0):''), PAD.l + 118, PAD.t + 11);
    ctx.fillStyle = '#ef5350'; ctx.fillText('-DI ' + (lastN!=null?lastN.toFixed(0):''), PAD.l + 174, PAD.t + 11);
    ctx.fillStyle = C.muted; ctx.font = '10px monospace';
    ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  // ── 이격도: 책 스타일 (빨간선 + 95↓매수/105↑매도 영역 채움) ──
  if (key === 'MFI') {
    const arr = vals[0];
    const y80 = yOf(80), y60 = yOf(60), y50 = yOf(50), y40 = yOf(40), y20 = yOf(20);
    // ── 기준선 20/40/60/80 (책 스타일: 균등 4단 점선) ──
    // 80 (과매수) - 주황 실선
    ctx.strokeStyle = '#f0a836aa'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y80); ctx.lineTo(W - PAD.r, y80); ctx.stroke();
    // 60 - 회색 점선
    ctx.strokeStyle = '#6e768188'; ctx.lineWidth = 0.8; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y60); ctx.lineTo(W - PAD.r, y60); ctx.stroke();
    // 50 (중심) - 회색 점선
    ctx.strokeStyle = '#6e7681aa'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(PAD.l, y50); ctx.lineTo(W - PAD.r, y50); ctx.stroke();
    // 40 - 회색 점선
    ctx.strokeStyle = '#6e768188';
    ctx.beginPath(); ctx.moveTo(PAD.l, y40); ctx.lineTo(W - PAD.r, y40); ctx.stroke();
    ctx.setLineDash([]);
    // 20 (과매도) - 청록 실선
    ctx.strokeStyle = '#3fb950aa'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, y20); ctx.lineTo(W - PAD.r, y20); ctx.stroke();
    // 기준선 숫자 라벨 (우측)
    ctx.font = '9px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#f0a836'; ctx.fillText('80', W - PAD.r + 3, y80 + 3);
    ctx.fillStyle = '#8b949e'; ctx.fillText('60', W - PAD.r + 3, y60 + 3);
    ctx.fillStyle = '#6e7681'; ctx.fillText('50', W - PAD.r + 3, y50 + 3);
    ctx.fillStyle = '#8b949e'; ctx.fillText('40', W - PAD.r + 3, y40 + 3);
    ctx.fillStyle = '#3fb950'; ctx.fillText('20', W - PAD.r + 3, y20 + 3);
    // 80 위(과매수) 영역 채움 - 주황
    ctx.fillStyle = '#f0a83633';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] > 80 || arr[i+1] > 80) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y80);
        ctx.lineTo(xOf(i), yOf(Math.max(arr[i],80)));
        ctx.lineTo(xOf(i+1), yOf(Math.max(arr[i+1],80)));
        ctx.lineTo(xOf(i+1), y80);
        ctx.closePath(); ctx.fill();
      }
    }
    // 20 아래(과매도) 영역 채움 - 청록
    ctx.fillStyle = '#3fb95033';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] < 20 || arr[i+1] < 20) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y20);
        ctx.lineTo(xOf(i), yOf(Math.min(arr[i],20)));
        ctx.lineTo(xOf(i+1), yOf(Math.min(arr[i+1],20)));
        ctx.lineTo(xOf(i+1), y20);
        ctx.closePath(); ctx.fill();
      }
    }
    // MFI 연두색 선
    ctx.strokeStyle = C.lime; ctx.lineWidth = 1.4;
    ctx.beginPath(); let sm = false;
    arr.forEach((v,i) => { if (v==null) return; sm ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), sm=true); });
    ctx.stroke();
    // 고점 삼각형 마커 (다이버전스 확인용, 책 스타일) — 좌우 5봉보다 높은 국소 고점
    const LBpk = 5;
    ctx.fillStyle = '#9098a4';
    for (let i = LBpk; i < arr.length - LBpk; i++) {
      if (arr[i] == null || arr[i] < 55) continue;
      let isPeak = true;
      for (let k = i-LBpk; k <= i+LBpk; k++) { if (k===i) continue; if (arr[k] != null && arr[k] > arr[i]) { isPeak = false; break; } }
      if (isPeak) {
        const x = xOf(i), y = yOf(arr[i]);
        ctx.beginPath(); ctx.moveTo(x, y-6); ctx.lineTo(x-5, y-1); ctx.lineTo(x+5, y-1); ctx.closePath(); ctx.fill();
      }
    }
    // 매수/매도 신호 (20 상향돌파=매수, 80 하향돌파=매도)
    ctx.textAlign = 'center'; ctx.font = 'bold 10px monospace';
    for (let i = 1; i < arr.length; i++) {
      if (arr[i]==null || arr[i-1]==null) continue;
      if (arr[i-1] < 20 && arr[i] >= 20) {
        ctx.fillStyle = '#ef5350';
        ctx.beginPath();
        ctx.moveTo(xOf(i), yOf(arr[i])+13); ctx.lineTo(xOf(i)-4, yOf(arr[i])+20); ctx.lineTo(xOf(i)+4, yOf(arr[i])+20); ctx.closePath(); ctx.fill();
      }
      if (arr[i-1] > 80 && arr[i] <= 80) {
        ctx.fillStyle = '#1976d2';
        ctx.beginPath();
        ctx.moveTo(xOf(i), yOf(arr[i])-13); ctx.lineTo(xOf(i)-4, yOf(arr[i])-20); ctx.lineTo(xOf(i)+4, yOf(arr[i])-20); ctx.closePath(); ctx.fill();
      }
    }
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
    }
    // 레이블
    const lastVM = arr.filter(v => v != null).slice(-1)[0];
    ctx.fillStyle = C.lime; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillText('MFI 자금수급지수(14)  ' + (lastVM != null ? lastVM.toFixed(1) : ''), PAD.l + 22, PAD.t + 11);
    ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.font = '10px monospace';
    ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  if (key === 'RSI') {
    const arr = vals[0];
    const y70 = yOf(70), y30 = yOf(30), y50 = yOf(50);
    // ── 기준선 70/50/30 ──
    // 70 (과매수) - 주황 실선
    ctx.strokeStyle = '#f0a836aa'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y70); ctx.lineTo(W - PAD.r, y70); ctx.stroke();
    // 30 (과매도) - 청록 실선
    ctx.strokeStyle = '#3fb950aa'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, y30); ctx.lineTo(W - PAD.r, y30); ctx.stroke();
    // 50 (중심) - 회색 점선
    ctx.strokeStyle = '#6e7681aa'; ctx.lineWidth = 0.8; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y50); ctx.lineTo(W - PAD.r, y50); ctx.stroke();
    ctx.setLineDash([]);
    // 기준선 숫자 라벨 (우측)
    ctx.fillStyle = '#f0a836'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
    ctx.fillText('70', W - PAD.r + 3, y70 + 3);
    ctx.fillStyle = '#3fb950';
    ctx.fillText('30', W - PAD.r + 3, y30 + 3);
    ctx.fillStyle = '#6e7681';
    ctx.fillText('50', W - PAD.r + 3, y50 + 3);
    // 70 위(과매수) 영역 채움 - 주황
    ctx.fillStyle = '#f0a83633';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] > 70 || arr[i+1] > 70) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y70);
        ctx.lineTo(xOf(i), yOf(Math.max(arr[i],70)));
        ctx.lineTo(xOf(i+1), yOf(Math.max(arr[i+1],70)));
        ctx.lineTo(xOf(i+1), y70);
        ctx.closePath(); ctx.fill();
      }
    }
    // 30 아래(과매도) 영역 채움 - 청록
    ctx.fillStyle = '#3fb95033';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] < 30 || arr[i+1] < 30) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y30);
        ctx.lineTo(xOf(i), yOf(Math.min(arr[i],30)));
        ctx.lineTo(xOf(i+1), yOf(Math.min(arr[i+1],30)));
        ctx.lineTo(xOf(i+1), y30);
        ctx.closePath(); ctx.fill();
      }
    }
    // RSI 빨간 선
    ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 1.4;
    ctx.beginPath(); let s = false;
    arr.forEach((v,i) => { if (v==null) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); });
    ctx.stroke();
    // 매수/매도 신호 (30 상향돌파=매수, 70 하향돌파=매도)
    ctx.textAlign = 'center'; ctx.font = 'bold 10px monospace';
    for (let i = 1; i < arr.length; i++) {
      if (arr[i]==null || arr[i-1]==null) continue;
      if (arr[i-1] < 30 && arr[i] >= 30) {
        ctx.fillStyle = '#ef5350';
        ctx.beginPath();
        ctx.moveTo(xOf(i), yOf(arr[i])+13); ctx.lineTo(xOf(i)-4, yOf(arr[i])+20); ctx.lineTo(xOf(i)+4, yOf(arr[i])+20); ctx.closePath(); ctx.fill();
      }
      if (arr[i-1] > 70 && arr[i] <= 70) {
        ctx.fillStyle = '#1976d2';
        ctx.beginPath();
        ctx.moveTo(xOf(i), yOf(arr[i])-13); ctx.lineTo(xOf(i)-4, yOf(arr[i])-20); ctx.lineTo(xOf(i)+4, yOf(arr[i])-20); ctx.closePath(); ctx.fill();
      }
    }
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
    }
    // 레이블
    const lastV = arr.filter(v => v != null).slice(-1)[0];
    ctx.fillStyle = '#d32f2f'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillText('RSI 상대강도지수(' + P('RSI',0,14) + ')  ' + (lastV != null ? lastV.toFixed(1) : ''), PAD.l + 22, PAD.t + 11);
    ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.font = '10px monospace';
    ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  // ── 외국인 순매수: 막대(수량) + 선(금액, 노랑) ──
  if (key === 'FRGN_NET') {
    const netArr = vals[0] || [];
    const ratioArr = vals[2] || []; // 보유비율
    const fmt = v => { const a=Math.abs(v); return a>=1e8?(v/1e8).toFixed(1)+'억':a>=1e4?(v/1e4).toFixed(1)+'만':v.toFixed(0); };

    // 순매수 막대 (빨강=매수, 파랑=매도)
    const maxN = Math.max(1, ...netArr.filter(v=>v!=null).map(v=>Math.abs(v)));
    const bw = Math.max(1, (xOf(1) - xOf(0)) * 0.5);
    for (let i = 0; i < netArr.length; i++) {
      if (netArr[i] == null || netArr[i] === 0) continue;
      const v = netArr[i];
      const bh = Math.max(1, Math.abs(v) / maxN * (ch/2 - 2));
      ctx.fillStyle = v > 0 ? '#ef535088' : '#1976d288';
      if (v > 0) ctx.fillRect(xOf(i) - bw/2, ch/2 + PAD.t - bh, bw, bh);
      else ctx.fillRect(xOf(i) - bw/2, ch/2 + PAD.t, bw, bh);
    }
    // 0선
    ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(PAD.l, ch/2+PAD.t); ctx.lineTo(W-PAD.r, ch/2+PAD.t); ctx.stroke();

    // 보유비율 곡선 (녹색)
    const validRatio = ratioArr.map((v,i) => v != null && v > 0 ? {x:xOf(i), v, i} : null).filter(Boolean);
    if (validRatio.length >= 2) {
      const maxR = Math.max(...validRatio.map(p=>p.v));
      const minR = Math.min(...validRatio.map(p=>p.v));
      const rangeR = Math.max(0.1, maxR - minR);
      ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 1.2; ctx.setLineDash([3,2]);
      ctx.beginPath();
      validRatio.forEach((p, i) => {
        const y = PAD.t + ch - 4 - ((p.v - minR) / rangeR) * (ch - 8);
        i === 0 ? ctx.moveTo(p.x, y) : ctx.lineTo(p.x, y);
      });
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t+ch); ctx.stroke();
      // 호버 위치 순매수값 y축 표시
      const hv = netArr[state.hoverIdx];
      if (hv != null) {
        const hy = hv > 0 ? ch/2+PAD.t - Math.abs(hv)/maxN*(ch/2-2) : ch/2+PAD.t + Math.abs(hv)/maxN*(ch/2-2);
        const hvFmt = fmt(hv);
        ctx.fillStyle = '#332800'; ctx.fillRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1; ctx.strokeRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.fillStyle = '#ffd54f'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
        ctx.fillText(hvFmt, W-PAD.r+3, hy+3);
      }
    }

    // 레이블
    const lastVN = netArr.filter(v=>v!=null).slice(-1)[0];
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = C.cyan;
    ctx.fillText('외국인 순매수  ' + (lastVN != null ? (lastVN>=0?'+':'') + fmt(lastVN) + '주' : ''), PAD.l + 22, PAD.t + 11);

    // 보유율 레이블 (녹색)

    return;
  }


  // ── 기관 순매수: 막대 + 누적곡선 ──
  if (key === 'INST_NET') {
    const instArr = vals[0] || [];
    const fmt = v => { const a=Math.abs(v); return a>=1e8?(v/1e8).toFixed(1)+'억':a>=1e4?(v/1e4).toFixed(1)+'만':v.toFixed(0); };

    // 순매수 막대
    const maxN = Math.max(1, ...instArr.filter(v=>v!=null).map(v=>Math.abs(v)));
    const bw = Math.max(1, (xOf(1) - xOf(0)) * 0.5);
    for (let i = 0; i < instArr.length; i++) {
      if (instArr[i] == null || instArr[i] === 0) continue;
      const v = instArr[i];
      const bh = Math.max(1, Math.abs(v) / maxN * (ch/2 - 2));
      ctx.fillStyle = v > 0 ? '#ef535088' : '#1976d288';
      if (v > 0) ctx.fillRect(xOf(i) - bw/2, ch/2 + PAD.t - bh, bw, bh);
      else ctx.fillRect(xOf(i) - bw/2, ch/2 + PAD.t, bw, bh);
    }
    // 0선
    ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(PAD.l, ch/2+PAD.t); ctx.lineTo(W-PAD.r, ch/2+PAD.t); ctx.stroke();

    // 누적 곡선 (주황)
    const cumArr = vals[1] || [];
    const validCum = cumArr.map((v,i) => v != null ? {x:xOf(i), v} : null).filter(Boolean);
    if (validCum.length >= 2) {
      const maxC = Math.max(...validCum.map(p=>p.v));
      const minC = Math.min(...validCum.map(p=>p.v));
      const rangeC = Math.max(1, maxC - minC);
      ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
      ctx.beginPath();
      validCum.forEach((p, i) => {
        const y = PAD.t + ch - 4 - ((p.v - minC) / rangeC) * (ch - 8);
        i === 0 ? ctx.moveTo(p.x, y) : ctx.lineTo(p.x, y);
      });
      ctx.stroke();
    }

    // 호버
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t+ch); ctx.stroke();
      const hv = instArr[state.hoverIdx];
      if (hv != null) {
        const hy = hv > 0 ? ch/2+PAD.t - Math.abs(hv)/maxN*(ch/2-2) : ch/2+PAD.t + Math.abs(hv)/maxN*(ch/2-2);
        ctx.fillStyle = '#332200'; ctx.fillRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 1; ctx.strokeRect(W-PAD.r+1, hy-7, PAD.r-2, 14);
        ctx.fillStyle = '#ff9800'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
        ctx.fillText(fmt(hv), W-PAD.r+3, hy+3);
      }
    }

    // 레이블
    const lastI = instArr.filter(v=>v!=null).slice(-1)[0];
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ff9800';
    ctx.fillText('기관 순매수  ' + (lastI != null ? (lastI>=0?'+':'') + fmt(lastI) + '주' : ''), PAD.l + 22, PAD.t + 11);

    return;
  }

  // ── 공매도: 거래량 막대(빨강) + 잔고 선(녹색) ──
  if (key === 'SHORT_SELL') {
    const volArr = vals[0] || [];  // 거래량
    const balArr = vals[1] || [];  // 잔고
    const fmt = v => { const a=Math.abs(v); return a>=1e8?(v/1e8).toFixed(1)+'억':a>=1e4?(v/1e4).toFixed(1)+'만':v.toFixed(0); };

    if (!state.shortData) {
      ctx.fillStyle = C.muted; ctx.font = '11px monospace'; ctx.textAlign = 'center';
      ctx.fillText('공매도 데이터 로딩중…', (PAD.l + W - PAD.r) / 2, PAD.t + ch / 2);
      return;
    }
    // 거래량 막대 (빨강, 바닥에서 위로)
    const maxVol = Math.max(1, ...volArr.filter(v=>v!=null&&v>0));
    const bw = Math.max(1, (xOf(1) - xOf(0)) * 0.6);
    for (let i = 0; i < volArr.length; i++) {
      if (!volArr[i]) continue;
      const bh = Math.max(1, volArr[i] / maxVol * (ch - 4));
      ctx.fillStyle = '#ef535088';
      ctx.fillRect(xOf(i) - bw/2, PAD.t + ch - bh, bw, bh);
    }
    // 잔고 선 (노랑, 별도 스케일)
    const validBal = [];
    balArr.forEach((v, i) => { if (v > 0) validBal.push({ x: xOf(i), v, i }); });
    if (validBal.length >= 2) {
      const maxB = Math.max(...validBal.map(p=>p.v));
      const minB = Math.min(...validBal.map(p=>p.v));
      const rangeB = Math.max(1, maxB - minB);
      ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
      ctx.beginPath();
      validBal.forEach((p, i) => {
        const y = PAD.t + ch - 4 - ((p.v - minB) / rangeB) * (ch - 8);
        i === 0 ? ctx.moveTo(p.x, y) : ctx.lineTo(p.x, y);
      });
      ctx.stroke();
      // 점 + 꼭지점 마커
      const peakIdx = validBal.reduce((mi, p, i) => p.v > validBal[mi].v ? i : mi, 0);
      validBal.forEach((p, i) => {
        const y = PAD.t + ch - 4 - ((p.v - minB) / rangeB) * (ch - 8);
        ctx.fillStyle = i === peakIdx ? '#ff6b6b' : '#3fb950';
        ctx.beginPath(); ctx.arc(p.x, y, i === peakIdx ? 3 : 1.5, 0, Math.PI * 2); ctx.fill();
        if (i === peakIdx) {
          ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
          ctx.fillText('★ ' + fmt(p.v), p.x, y - 6);
        }
      });
    }
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
    }
    // 레이블
    ctx.fillStyle = '#ef5350'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    const lastVol = volArr.filter(v=>v!=null&&v>0).slice(-1)[0];
    ctx.fillText('공매도  ' + (lastVol ? fmt(lastVol) + '주' : ''), PAD.l + 22, PAD.t + 11);
    if (validBal.length) {
      ctx.fillStyle = '#3fb950';
      ctx.fillText('잔고 ' + fmt(validBal[validBal.length-1].v), PAD.l + 22, PAD.t + 23);
    }
    return;
  }

  if (key === 'FORCE') {
    const arr = vals[0];
    const y0 = yOf(0);
    // 0선 위(양수) 영역 - 연한 초록
    ctx.fillStyle = '#3fb95018';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] > 0 || arr[i+1] > 0) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y0);
        ctx.lineTo(xOf(i), yOf(Math.max(arr[i], 0)));
        ctx.lineTo(xOf(i+1), yOf(Math.max(arr[i+1], 0)));
        ctx.lineTo(xOf(i+1), y0);
        ctx.closePath(); ctx.fill();
      }
    }
    // 0선 아래(음수) 영역 - 연한 빨강
    ctx.fillStyle = '#ef535018';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] < 0 || arr[i+1] < 0) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y0);
        ctx.lineTo(xOf(i), yOf(Math.min(arr[i], 0)));
        ctx.lineTo(xOf(i+1), yOf(Math.min(arr[i+1], 0)));
        ctx.lineTo(xOf(i+1), y0);
        ctx.closePath(); ctx.fill();
      }
    }
    // 0선 (흰색 실선)
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(PAD.l, y0); ctx.lineTo(W - PAD.r, y0); ctx.stroke();
    // Force 선 (핑크)
    ctx.strokeStyle = C.pink; ctx.lineWidth = 1.4;
    ctx.beginPath(); let sf = false;
    arr.forEach((v, i) => { if (v == null) return; sf ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), sf = true); });
    ctx.stroke();
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
    }
    // y축 레이블: max / 0 / min
    const fmt = v => {
      const a = Math.abs(v);
      if (a >= 1e9) return (v/1e9).toFixed(1)+'B';
      if (a >= 1e6) return (v/1e6).toFixed(1)+'M';
      if (a >= 1e3) return (v/1e3).toFixed(1)+'K';
      return v.toFixed(0);
    };
    ctx.fillStyle = C.muted; ctx.font = '10px monospace'; ctx.textAlign = 'left';
    ctx.fillText(fmt(maxV), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText('0', W - PAD.r + 3, y0 + 3);
    ctx.fillText(fmt(minV), W - PAD.r + 3, PAD.t + ch);
    // 레이블
    const lastVF = arr.filter(v => v != null).slice(-1)[0];
    ctx.fillStyle = C.pink; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillText('Force 포스인덱스  ' + (lastVF != null ? fmt(lastVF) : ''), PAD.l + 22, PAD.t + 11);
    return;
  }

  // ── OBV: y축 값 + 0선 + 전고점/전저점 참고선 + 매수매도 신호 ──
  if (key === 'OBV') {
    const arr = vals[0];
    const y0 = yOf(0);
    // 0선 위(양수) 영역 - 연한 초록
    ctx.fillStyle = '#3fb95015';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] > 0 || arr[i+1] > 0) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y0);
        ctx.lineTo(xOf(i), yOf(Math.max(arr[i], 0)));
        ctx.lineTo(xOf(i+1), yOf(Math.max(arr[i+1], 0)));
        ctx.lineTo(xOf(i+1), y0);
        ctx.closePath(); ctx.fill();
      }
    }
    // 0선 아래(음수) 영역 - 연한 빨강
    ctx.fillStyle = '#ef535015';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] < 0 || arr[i+1] < 0) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y0);
        ctx.lineTo(xOf(i), yOf(Math.min(arr[i], 0)));
        ctx.lineTo(xOf(i+1), yOf(Math.min(arr[i+1], 0)));
        ctx.lineTo(xOf(i+1), y0);
        ctx.closePath(); ctx.fill();
      }
    }
    // 0선 (흰색 실선)
    if (minV < 0 && maxV > 0) {
      ctx.strokeStyle = '#ffffff44'; ctx.lineWidth = 1; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(PAD.l, y0); ctx.lineTo(W - PAD.r, y0); ctx.stroke();
    }
    // 최근 20봉 전고점 참고선 (점선, 노랑)
    const LB = 20;
    if (n >= 5) {
      const s = Math.max(0, n - LB);
      const win = arr.slice(s, n).filter(v => v != null);
      if (win.length) {
        const hi = Math.max(...win);
        ctx.strokeStyle = '#3fb95088'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(PAD.l, yOf(hi)); ctx.lineTo(W - PAD.r, yOf(hi)); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    // OBV 선 (청록)
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.4;
    ctx.beginPath(); let so = false;
    arr.forEach((v, i) => { if (v == null) return; so ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), so = true); });
    ctx.stroke();
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
    }
    // y축 레이블: max / 0(있으면) / min
    const fmt = v => {
      const a = Math.abs(v);
      if (a >= 1e9) return (v/1e9).toFixed(1)+'B';
      if (a >= 1e6) return (v/1e6).toFixed(1)+'M';
      if (a >= 1e3) return (v/1e3).toFixed(1)+'K';
      return v.toFixed(0);
    };
    ctx.fillStyle = C.muted; ctx.font = '10px monospace'; ctx.textAlign = 'left';
    ctx.fillText(fmt(maxV), W - PAD.r + 3, PAD.t + 10);
    if (minV < 0 && maxV > 0) ctx.fillText('0', W - PAD.r + 3, y0 + 3);
    ctx.fillText(fmt(minV), W - PAD.r + 3, PAD.t + ch);
    // 레이블
    const lastVO = arr.filter(v => v != null).slice(-1)[0];
    ctx.fillStyle = C.cyan; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillText('OBV 누적거래량  ' + (lastVO != null ? fmt(lastVO) : ''), PAD.l + 22, PAD.t + 11);
    // 매수/매도 화살표 (전고점/전저점 돌파)
    drawSubSignals(ctx, key, vals, n, xOf, yOf, minV, maxV, PAD, ch);
    return;
  }

  if (key === 'DISPARITY') {
    const arr = vals[0];
    const y100 = yOf(100), y95 = yOf(95), y105 = yOf(105);
    // 95 아래(과매도=매수영역) 채움
    ctx.fillStyle = '#3b3b3b';
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] == null || arr[i+1] == null) continue;
      if (arr[i] < 95 || arr[i+1] < 95) {
        ctx.beginPath();
        ctx.moveTo(xOf(i), y95);
        ctx.lineTo(xOf(i), yOf(Math.min(arr[i],95)));
        ctx.lineTo(xOf(i+1), yOf(Math.min(arr[i+1],95)));
        ctx.lineTo(xOf(i+1), y95);
        ctx.closePath(); ctx.fill();
      }
    }
    // 빨간 이격도 선
    ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 1.4;
    ctx.beginPath(); let s = false;
    arr.forEach((v,i) => { if (v==null) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); });
    ctx.stroke();
    // 매수/매도 신호 (95 상향돌파=매수, 105 하향돌파=매도)
    ctx.textAlign = 'center'; ctx.font = 'bold 10px monospace';
    for (let i = 1; i < arr.length; i++) {
      if (arr[i]==null || arr[i-1]==null) continue;
      if (arr[i-1] < 95 && arr[i] >= 95) {
        ctx.fillStyle = '#ef5350';
        ctx.fillText('매입', xOf(i), yOf(arr[i]) + 16);
      }
      if (arr[i-1] > 105 && arr[i] <= 105) {
        ctx.fillStyle = '#1976d2';
        ctx.fillText('매도', xOf(i), yOf(arr[i]) - 10);
      }
    }
    // 호버선
    if (state.hoverIdx >= 0 && state.hoverIdx < n) {
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
    }
    // 레이블
    const lastV = arr.filter(v => v != null).slice(-1)[0];
    ctx.fillStyle = '#d32f2f'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
    ctx.fillText('Disparity 이격도  ' + (lastV != null ? lastV.toFixed(1) : ''), PAD.l + 22, PAD.t + 11);
    ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.font = '10px monospace';
    ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
    ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
    return;
  }

  vals.forEach((arr, vi) => {
    if (key === 'VOLUME') {
      const maxV2 = Math.max(...arr.filter(Boolean));
      arr.forEach((v, i) => {
        if (!v) return;
        const barH = (v / maxV2) * ch, bw = Math.max(1, cw / n * 0.55);
        const d = state.data[state.range[0] + i];
        ctx.fillStyle = d && d.close >= d.open ? C.up + '88' : C.down + '88';
        ctx.fillRect(xOf(i) - bw/2, PAD.t + ch - barH, bw, barH);
      });
      return;
    }
    if (key === 'MACD' && vi === 2) {
      arr.forEach((v, i) => {
        if (v == null) return;
        const x = xOf(i), bw = Math.max(1, cw / n * 0.5), y0 = yOf(0), yv = yOf(v);
        ctx.fillStyle = v >= 0 ? C.up + 'bb' : C.down + 'bb';
        ctx.fillRect(x - bw/2, Math.min(y0, yv), bw, Math.abs(yv - y0));
      });
      return;
    }
    ctx.strokeStyle = lineColors[vi] || cfg.color; ctx.lineWidth = vi === 0 ? 1.4 : 1;
    ctx.beginPath(); let s = false;
    arr.forEach((v, i) => { if (v == null) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); });
    ctx.stroke();
  });

  // ── 매매 시점 화살표 (오버레이 제외 보조지표) ──
  drawSubSignals(ctx, key, vals, n, xOf, yOf, minV, maxV, PAD, ch);

  // 호버 수직선
  if (state.hoverIdx >= 0 && state.hoverIdx < n) {
    ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xOf(state.hoverIdx), PAD.t); ctx.lineTo(xOf(state.hoverIdx), PAD.t + ch); ctx.stroke();
  }

  // 레이블
  const lastName = {MACD:'MACD 이동평균수렴발산', ADX:'DMI 방향성지수', ADXR:'ADXR 평균방향성지표순위', CCI:'CCI 추세채널지수', AROON:'Aroon 아룬', FORCE:'Force 포스인덱스', FRGN_NET:'외국인순매수', INST_NET:'기관순매수', SHORT_SELL:'공매도 거래량/잔고',
    RSI:'RSI 상대강도지수', SMI:'SMI 스토캐스틱모멘텀지수', STOCHRSI:'StochRSI 상대강도스토캐스틱', STOCH:'Stoch 스토캐스틱', SLOWSTOCH:'SlowStoch 완만한스토캐스틱',
    CMO:'CMO 샨드모멘텀오실레이터', DMI_DYN:'Dyn.MI 다이나믹모멘텀지수', MASS:'Mass 대중심리지수', DISPARITY:'Disparity 이격도', CHAIKIN_OSC:'Chaikin Osc 차이킨오실레이터',
    MOM:'MOM 모멘텀', WILLR:'%R 윌리엄스퍼센트R', ATR:'ATR 평균진정가격범위', RVI:'RVI 상대변동성지수', INERTIA:'Inertia 관성지수',
    CHAIKIN_VOL:'Chaikin Vol 차이킨변동성', VOLUME:'거래량', OBV:'OBV 누적거래량', CMF:'CMF 차이킨자금흐름', MFI:'MFI 자금수급지수', PVT:'PVT 거래량추세지수', WILLIAMS_AD:'Williams AD 윌리엄스누적확산지수'};
  const lastVal = vals[0].filter(v => v != null).slice(-1)[0];
  ctx.fillStyle = cfg.color; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`${lastName[key] || key}  ${lastVal != null ? lastVal.toFixed(1) : ''}`, PAD.l + 22, PAD.t + 11);
  // max/min 우측 축
  ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.font = '10px monospace';
  ctx.fillText(maxV.toFixed(0), W - PAD.r + 3, PAD.t + 10);
  ctx.fillText(minV.toFixed(0), W - PAD.r + 3, PAD.t + ch);
}

// ══════════════════════════════════════
// 전체 렌더
// ══════════════════════════════════════
// 선택된 보조지표를 선택 순서대로 반환
function getActiveKeys() {
  // selectedOrder에 있는 것 우선(순서 유지), 빠진 것 뒤에 추가
  const active = Object.keys(state.selected).filter(k => state.selected[k]);
  const ordered = state.selectedOrder.filter(k => active.includes(k));
  active.forEach(k => { if (!ordered.includes(k)) ordered.push(k); });
  return ordered;
}

function updateIframeStockName() {
  const el = document.getElementById('iframe-stock-name');
  if (!el || !state.stock) return;
  const s = state.stock;
  const nm = s.name || s.code || '';
  // 현재가·등락률 (마지막 종가 vs 전일 종가)
  let priceStr = '0 (0)';  // 미개장/데이터 없음 기본값
  let chgColor = '#8b949e';
  const d = state.data;
  if (d && d.length >= 2) {
    const last = d[d.length - 1], prev = d[d.length - 2];
    if (last && prev && last.close > 0 && prev.close > 0) {
      const price = last.close;
      const chg = ((price - prev.close) / prev.close) * 100;
      const sign = chg > 0 ? '+' : '';  // 음수는 자체 부호
      chgColor = chg > 0 ? '#f01d1d' : chg < 0 ? '#1976d2' : '#8b949e';  // 상승 진빨강, 하락 청색 (캔들과 통일)
      const priceFmt = price >= 100 ? Math.round(price).toLocaleString() : price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
      priceStr = `${priceFmt} (${sign}${chg.toFixed(2)}%)`;
    }
  }
  el.innerHTML = `${escapeHtml(nm)} <span style="color:#8b949e;font-weight:400">/</span> <span style="color:${chgColor}">${priceStr}</span>`;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// ══════════════════════════════════════
// 캔들 1개씩 넘기기 버튼 (‹ 앞으로 / › 뒤로)
//  화살표 방향으로 캔들이 움직인다. chartStep 은 renderAll 안에서 채워진다
//  (state·redrawAll 에 접근해야 하므로)
// ══════════════════════════════════════
let chartStep = null;
const STEP_HOLD_DELAY = 450;   // 길게 누름을 인식하기까지(ms)
const STEP_HOLD_GAP   = 300;   // 연속 진행 간격(ms)

function syncStepBtn(){
  const bk = document.getElementById('step-back');
  const fw = document.getElementById('step-fwd');
  const d = state.data;
  if (!d || !d.length) { if (bk) bk.disabled = true; if (fw) fw.disabled = true; return; }
  const fpad = state.overlays.ICHIMOKU ? 26 : 1;
  if (bk) bk.disabled = (state.range[1] >= d.length + fpad);   // 더 앞으로 갈 곳 없음
  if (fw) fw.disabled = (state.range[0] <= 0);                 // 더 뒤로 갈 곳 없음
}

function bindStepBtn(){
  const setup = (id, dir, endMsg) => {
    const b = document.getElementById(id);
    if (!b || b._bound) return;
    b._bound = true;
    let timer = null, hold = null;
    const stop = () => {
      if (hold) { clearTimeout(hold); hold = null; }
      if (timer) { clearInterval(timer); timer = null; }
    };
    const step = () => {
      if (!chartStep) return;
      if (!chartStep(dir)) {
        stop();                                   // 끝에 닿으면 연속 진행도 멈춘다
        if (typeof showMsg === 'function') showMsg(endMsg, 1000);
      }
    };
    const start = ev => {
      ev.preventDefault();
      step();
      hold = setTimeout(() => { timer = setInterval(step, STEP_HOLD_GAP); }, STEP_HOLD_DELAY);
    };
    b.addEventListener('pointerdown', start);
    ['pointerup','pointerleave','pointercancel'].forEach(t => b.addEventListener(t, stop));
  };
  setup('step-back',  1, '마지막 봉입니다');
  setup('step-fwd',  -1, '첫 봉입니다');
}

function renderAll() {
  updateIframeStockName();
  const activeKeys = getActiveKeys();
  const chartArea = document.getElementById('chart-area');

  // 기존 보조지표 패널 제거
  chartArea.querySelectorAll('.sub-wrap').forEach(el => el.remove());

  // 보조지표 패널 생성 (스크롤로 모두 표시)
  activeKeys.forEach(key => {
    const wrap = document.createElement('div');
    wrap.className = 'sub-wrap';
    wrap.style.position = 'relative';
    // 거래량은 높이 40% 축소 (140 → 84px)
    if (key === 'VOLUME') {
      wrap.style.flex = '0 0 84px';
      wrap.style.height = '84px';
    }
    const canvas = document.createElement('canvas');
    canvas.className = 'sub-canvas';
    canvas.style.width = '100%'; canvas.style.height = '100%';
    wrap.appendChild(canvas);

    // X 삭제 버튼 (우측 상단)
    const closeBtn = document.createElement('div');
    closeBtn.className = 'sub-close';
    closeBtn.textContent = '✕';
    closeBtn.title = '이 보조차트 지우기';
    closeBtn.onclick = (e) => {
      e.stopPropagation();
      // 상태에서 제거
      state.selected[key] = false;
      state.selectedOrder = state.selectedOrder.filter(k => k !== key);
      // 사이드바 체크박스도 해제
      const label = document.querySelector(`.ind-label[data-key="${key}"]`);
      if (label) {
        const cbShow = label.querySelector('.cb-show');
        if (cbShow) cbShow.checked = false;
        label.classList.remove('active');
        const span = label.querySelector('span.nm');
        if (span) span.style.color = '';
      }
      renderAll();
    };
    wrap.appendChild(closeBtn);

    chartArea.appendChild(wrap);
    setTimeout(() => { drawSub(canvas, key); if(window._bindSubPan) window._bindSubPan(canvas); }, 0);
  });

  // OHLC 정보 업데이트
  updateOHLC();

  // 캔들 그리기
  drawCandle();

  // 마우스 이벤트
  setupMouseEvent();
}

function updateOHLC(d) {
  const slice = state.data.slice(...state.range);
  const last = d || slice[slice.length - 1];
  if (!last) return;
  const el = document.getElementById.bind(document);
  el('info-close').textContent = last.close.toLocaleString();
  el('info-close').style.color = last.close >= last.open ? '#f01d1d' : '#1976d2';
  el('info-open').textContent = last.open.toLocaleString();
  el('info-high').textContent = last.high.toLocaleString();
  el('info-low').textContent = last.low.toLocaleString();
  // 날짜는 1줄 헤더에 표시
  const dateEl = el('header-date');
  if (dateEl) dateEl.textContent = last.date;
}

function setupMouseEvent() {
  const canvas = document.getElementById('candle-canvas');
  let dragStartX = null, dragStartRange = null, isDragging = false;
  const n = () => state.range[1] - state.range[0];
  const PAD_L = 8, PAD_R = 62;  // 세로축 우측

  function getIdx(clientX) {
    const rect = canvas.getBoundingClientRect();
    const cw = rect.width - PAD_L - PAD_R;
    return Math.round((clientX - rect.left - PAD_L) / (cw / n()) - 0.5);
  }

  function shiftRange(deltaIdx) {
    const total = state.data.length;
    const fpad = state.overlays.ICHIMOKU ? 26 : 1;  // 미래 여백(구름 26칸, 없어도 내일 자리 1칸)
    const maxRight = total + fpad;  // 최신에서 미래 여백만큼 더 오른쪽까지 허용 (점프 방지)
    const len = n();
    let s = dragStartRange[0] - deltaIdx;
    let e = dragStartRange[1] - deltaIdx;
    if (s < 0) { e -= s; s = 0; }
    if (e > maxRight) { s -= (e - maxRight); e = maxRight; }
    s = Math.max(0, s); e = Math.min(maxRight, e);
    state.range = [s, e];
    rememberView();
  }

  // 현재 보고 있는 구간을 날짜로 기억 (종목 변경 시 같은 기간 복원용)
  function rememberView() {
    const d = state.data;
    if (!d || !d.length) return;
    const [s, e] = state.range;
    state.keepZoom = e - s;
    const first = d[Math.max(0, Math.min(d.length - 1, s))];
    const last  = d[Math.max(0, Math.min(d.length - 1, e - 1))];
    state.keepFrom = first && first.date ? first.date : null;
    state.keepTo   = last  && last.date  ? last.date  : null;
    // 오른쪽 끝(최신)에 붙어 있으면 '최신 추종' 모드로 표시
    state.keepAtEnd = (e >= d.length);
    saveView();  // 차트는 종목마다 새로 로드되므로 저장해 둬야 유지됨
  }

  function redrawAll() {
    drawCandle();
    document.querySelectorAll('.sub-canvas').forEach((cv, i) => {
      const key = getActiveKeys()[i];
      if (key) drawSub(cv, key);
    });
  }

  // ── 캔들 1개씩 넘기기 (‹ 버튼) ──
  // 확대·위치는 손으로 잡아두고, 버튼으로 하루씩 진행시켜 방향예측을 연습하는 용도
  chartStep = (bars) => {
    const d = state.data;
    if (!d || !d.length) return false;
    const fpad = state.overlays.ICHIMOKU ? 26 : 1;   // 미래 여백 (구름 26칸)
    const maxRight = d.length + fpad;
    const len = state.range[1] - state.range[0];
    let s = state.range[0] + bars;
    let e = state.range[1] + bars;
    if (e > maxRight) { s -= (e - maxRight); e = maxRight; }
    if (s < 0) { e -= s; s = 0; }
    const moved = (s !== state.range[0] || e !== state.range[1]);
    state.range = [s, e];
    state.hoverIdx = -1;
    rememberView();
    redrawAll();
    syncStepBtn();
    return moved;
  };
  bindStepBtn();
  syncStepBtn();

  // ── 마우스 ──
  canvas.onmousedown = (e) => {
    dragStartX = e.clientX;
    dragStartRange = [...state.range];
    isDragging = false;
    canvas.style.cursor = 'grabbing';
  };

  canvas.onmousemove = (e) => {
    if (dragStartX !== null) {
      const rect = canvas.getBoundingClientRect();
      const cw = rect.width - PAD_L - PAD_R;
      const pxPerBar = cw / n();
      const deltaPx = e.clientX - dragStartX;
      const deltaIdx = Math.round(deltaPx / pxPerBar);
      if (Math.abs(deltaPx) > 4) {
        isDragging = true;
        state.hoverIdx = -1;
        shiftRange(deltaIdx);
        redrawAll();
        return;
      }
    }
    if (!isDragging) {
      const idx = getIdx(e.clientX);
      if (idx >= 0 && idx < n()) {
        state.hoverIdx = idx;
        updateOHLC(state.data[state.range[0] + idx]);
        drawCandle();
        document.querySelectorAll('.sub-canvas').forEach((cv, i) => {
          const key = getActiveKeys()[i];
          if (key) drawSub(cv, key);
        });
      }
    }
  };

  canvas.onmouseup = () => {
    // 드래그가 아닌 클릭이면 → 해당 캔들 종가를 y축에 표시
    if (!isDragging && state.hoverIdx >= 0) {
      const slice = state.data.slice(...state.range);
      if (slice[state.hoverIdx]) {
        state.clickPrice = slice[state.hoverIdx].close;
        drawCandle();
      }
    }
    dragStartX = null; dragStartRange = null;
    isDragging = false;
    canvas.style.cursor = 'crosshair';
  };

  canvas.onmouseleave = () => {
    if (!isDragging) {
      state.hoverIdx = -1;
      updateOHLC();
      drawCandle();
    }
    dragStartX = null; dragStartRange = null;
    isDragging = false;
    canvas.style.cursor = 'crosshair';
  };

  // ── 터치 (모바일): 1손가락=이동, 2손가락=확대/축소 ──
  let touchStartX = null, touchStartRange = null;
  let pinchStartDist = null, pinchStartLen = null, pinchStartRange = null, pinchCenterRatio = 0.5;

  function touchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  canvas.ontouchstart = (e) => {
    if (e.touches.length === 2) {
      // 핀치 시작
      pinchStartDist = touchDist(e);
      pinchStartLen = n();
      pinchStartRange = [...state.range];
      const rect = canvas.getBoundingClientRect();
      const cw = rect.width - PAD_L - PAD_R;
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left - PAD_L;
      pinchCenterRatio = Math.max(0, Math.min(1, cx / cw));
      touchStartX = null;
    } else {
      touchStartX = e.touches[0].clientX;
      touchStartRange = [...state.range];
      pinchStartDist = null;
      // 터치 위치에 호버선(날짜) 표시
      const idx = getIdx(e.touches[0].clientX);
      if (idx >= 0 && idx < n()) {
        state.hoverIdx = idx;
        updateOHLC(state.data[state.range[0] + idx]);
        redrawAll();
      }
    }
  };

  canvas.ontouchmove = (e) => {
    e.preventDefault();
    if (e.touches.length === 2 && pinchStartDist) {
      // 두 손가락 확대/축소
      const dist = touchDist(e);
      const ratio = pinchStartDist / dist; // 벌리면 축소값<1 → 봉수 감소(확대)
      let newLen = Math.round(pinchStartLen * ratio);
      newLen = Math.max(8, Math.min(state.data.length, newLen));
      const anchor = Math.round(pinchStartRange[0] + pinchStartLen * pinchCenterRatio);
      let s = Math.round(anchor - newLen * pinchCenterRatio);
      let e2 = s + newLen;
      if (s < 0) { e2 -= s; s = 0; }
      if (e2 > state.data.length) { s -= (e2 - state.data.length); e2 = state.data.length; }
      state.range = [Math.max(0, s), Math.min(state.data.length, e2)];
      rememberView();
      redrawAll();
      return;
    }
    if (touchStartX === null) return;
    const rect = canvas.getBoundingClientRect();
    const cw = rect.width - PAD_L - PAD_R;
    const pxPerBar = cw / n();
    const deltaPx = e.touches[0].clientX - touchStartX;
    // 손가락 이동이 작으면(20px 미만) 호버선(날짜 확인), 크면 패닝
    if (Math.abs(deltaPx) < 20) {
      const idx = getIdx(e.touches[0].clientX);
      if (idx >= 0 && idx < n()) {
        state.hoverIdx = idx;
        updateOHLC(state.data[state.range[0] + idx]);
        redrawAll();
      }
      return;
    }
    // 패닝 시작 → 호버 해제
    state.hoverIdx = -1;
    const deltaIdx = Math.round(deltaPx / pxPerBar);
    dragStartRange = touchStartRange;
    shiftRange(deltaIdx);
    redrawAll();
  };
  canvas.ontouchend = (e) => {
    if (e.touches.length < 2) { pinchStartDist = null; }
    if (e.touches.length === 0) { touchStartX = null; touchStartRange = null; }
  };

  // ── 휠 줌 ──
  canvas.onwheel = (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const cw = rect.width - PAD_L - PAD_R;
    const mouseRatio = Math.max(0, Math.min(1, (e.clientX - rect.left - PAD_L) / cw));
    const len = n();
    const delta = e.deltaY > 0 ? Math.ceil(len * 0.1) : -Math.ceil(len * 0.1);
    const newLen = Math.max(10, Math.min(state.data.length, len + delta));
    const anchor = Math.round(state.range[0] + len * mouseRatio);
    let s = Math.round(anchor - newLen * mouseRatio);
    let e2 = s + newLen;
    if (s < 0) { e2 -= s; s = 0; }
    if (e2 > state.data.length) { s -= (e2 - state.data.length); e2 = state.data.length; }
    state.range = [Math.max(0, s), Math.min(state.data.length, e2)];
    rememberView();
    redrawAll();
  };

  // ── 더블클릭/더블탭: 기본 배율로 되돌리기 ──
  const resetZoom = () => {
    clearView();
    const showLen = Math.min(calcShowCount(state.period, state.interval), state.data.length);
    state.range = [Math.max(0, state.data.length - showLen), state.data.length + (state.overlays.ICHIMOKU ? 0 : 1)];
    state.hoverIdx = -1;
    redrawAll();
    if (typeof showMsg === 'function') showMsg('기본 배율로 되돌렸습니다', 1200);
  };
  canvas.ondblclick = (e) => { e.preventDefault(); resetZoom(); };
  let lastTapTime = 0;
  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length > 0) return;
    const now = Date.now();
    if (now - lastTapTime < 300) { resetZoom(); lastTapTime = 0; }
    else lastTapTime = now;
  });

  // ── 보조차트에도 좌우 드래그(패닝) 적용 → 메인+보조 함께 이동 ──
  window._bindSubPan = function(subCv){
    let sX=null, sRange=null, sDrag=false;
    subCv.style.cursor='grab';
    subCv.onmousedown=(e)=>{ sX=e.clientX; sRange=[...state.range]; sDrag=false; subCv.style.cursor='grabbing'; };
    subCv.onmousemove=(e)=>{
      if(sX===null) return;
      const rect=subCv.getBoundingClientRect();
      const cw=rect.width - PAD_L - PAD_R;
      const pxPerBar=cw/n();
      const deltaPx=e.clientX - sX;
      if(Math.abs(deltaPx)>4){
        sDrag=true; state.hoverIdx=-1;
        const deltaIdx=Math.round(deltaPx/pxPerBar);
        dragStartRange=sRange;
        shiftRange(deltaIdx);
        redrawAll();
      }
    };
    const endMs=()=>{ sX=null; sRange=null; sDrag=false; subCv.style.cursor='grab'; };
    subCv.onmouseup=endMs; subCv.onmouseleave=endMs;
    // 터치
    let tX=null, tRange=null;
    subCv.ontouchstart=(e)=>{ if(e.touches.length===1){ tX=e.touches[0].clientX; tRange=[...state.range]; } };
    subCv.ontouchmove=(e)=>{
      if(tX===null||e.touches.length!==1) return;
      e.preventDefault();
      const rect=subCv.getBoundingClientRect();
      const cw=rect.width - PAD_L - PAD_R;
      const pxPerBar=cw/n();
      const deltaPx=e.touches[0].clientX - tX;
      if(Math.abs(deltaPx)>10){
        state.hoverIdx=-1;
        const deltaIdx=Math.round(deltaPx/pxPerBar);
        dragStartRange=tRange;
        shiftRange(deltaIdx);
        redrawAll();
      }
    };
    subCv.ontouchend=()=>{ tX=null; tRange=null; };
  };
}

// 리사이즈
window.addEventListener('resize', () => renderAll());

// 시작!
window.addEventListener('pageshow', () => { if (state.data && state.data.length) renderAll(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.data && state.data.length) renderAll(); });
init();
</script>
</body>
