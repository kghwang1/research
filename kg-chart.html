<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG 챠트분석</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* iframe 모드 (메인 앱에서 호출 시) */
body.iframe-mode #header-row1 { display: none !important; }
body.iframe-mode #header-row2 { display: none !important; }
body.iframe-mode #header-row3 #ohlc-info { display: none !important; }
body.iframe-mode #header-row3 { padding: 4px 8px; gap: 6px; }
body.iframe-mode #header { padding: 0; }
body.iframe-mode .main-wrapper { flex: 0 0 224px !important; height: 224px !important; }
body.iframe-mode .sub-wrapper { flex: 0 0 98px !important; height: 98px !important; }
/* iframe 모드: 사이드바는 collapsed 클래스로 제어 */
body.iframe-mode #sidebar-toggle { display: none; }
body.iframe-mode #toggle-btn { display: none; }
body.iframe-mode #iframe-sidebar-btn { display: inline-block; }
#iframe-sidebar-btn { display: none; }
#iframe-stock-name { display: none; }
body.iframe-mode #iframe-sidebar-btn { display: inline-block !important; }
body.iframe-mode #iframe-stock-name { display: inline !important; }
body { background: #0d1117; color: #e6edf3; font-family: 'Noto Sans KR', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 12px; }

/* 헤더 - 3줄 구조 */
#header {
  display: flex; flex-direction: column;
  border-bottom: 1px solid #21262d;
  flex-shrink: 0; background: #161b22;
}
/* 1줄: 타이틀 + 날짜 */
#header-row1 {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 10px 3px;
  border-bottom: 1px solid #21262d;
}
.title { color: #58a6ff; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
#header-date { color: #8b949e; font-size: 11px; }

/* 2줄: 검색창 + 기간버튼 */
#header-row2 {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 10px;
  border-bottom: 1px solid #21262d;
}
#market-toggle { display: flex; gap: 2px; flex-shrink: 0; }
.mkt-btn { background: #161b22; border: 1px solid #21262d; color: #8b949e; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; line-height: 1; }
.mkt-btn.active { background: #1f6feb; border-color: #1f6feb; }
#search-wrap { position: relative; flex: 1; max-width: 280px; }
#search-input {
  background: #0d1117; border: 1px solid #21262d;
  color: #e6edf3; padding: 4px 8px; border-radius: 4px;
  font-size: 12px; width: 100%;
}
#stock-dropdown {
  position: absolute; top: 100%; left: 0;
  background: #1c2128; border: 1px solid #21262d;
  border-radius: 4px; z-index: 100;
  min-width: 200px; max-height: 220px; overflow-y: auto; display: none;
}
.stock-item { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; }
.stock-item:hover { background: #21262d; }
.stock-code { color: #8b949e; }
#stock-name { display: none; }
#stock-code-display { display: none; }
.period-btn { background: #161b22; color: #8b949e; border: 1px solid #21262d; padding: 3px 7px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; }
.period-btn.active { background: #58a6ff; color: #000; }
#period-group { display: flex; gap: 3px; margin-left: auto; }

/* 3줄: 주가 정보 */
#selected-stock { font-weight:700; font-size:13px; color:#58a6ff; margin-right:4px; }
#header-row3 {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px;
}
#ohlc-info { display: flex; gap: 10px; color: #8b949e; flex-wrap: wrap; }
#ohlc-info .price { font-weight: 700; font-size: 14px; }
#ohlc-info .label { color: #8b949e; font-size: 10px; margin-right: 1px; }

/* 본체 */
#body { display: flex; flex: 1; overflow: hidden; position: relative; }

/* 사이드 패널 */
#sidebar {
  position: absolute; top: 0; left: 0; bottom: 0;
  width: 156px; background: #161b22ee;
  border-right: 1px solid #30363d;
  overflow-y: auto;
  z-index: 40;
  transition: transform 0.22s ease, opacity 0.22s ease;
  box-shadow: 2px 0 12px rgba(0,0,0,0.4);
}
#sidebar.collapsed { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.group-title { padding: 6px 8px 2px; font-size: 10px; color: #58a6ff; font-weight: 700; white-space: nowrap; }
.ind-label { display: flex; align-items: center; gap: 4px; padding: 4px 6px; cursor: pointer; font-size: 11px; white-space: nowrap; }
.ind-label:hover { background: #21262d; }
.ind-label input { cursor: pointer; flex-shrink: 0; }
.ind-label span.nm { color: #8b949e; flex: 1; }
.ind-label.active span.nm { color: inherit; }
/* 추천 지표 표시: 첫번째 체크박스 위에 붉은 5 */
.ind-label[data-mark5] { position: relative; }
.ind-label[data-mark5]::before {
  content: '5'; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  width: 13px; text-align: center; font-size: 10px; font-weight: 900; color: #ff3b30;
  pointer-events: none; z-index: 2; text-shadow: 0 0 2px #0d1117, 0 0 2px #0d1117;
}
.ind-info { color: #6e7681; font-size: 11px; cursor: pointer; padding: 0 3px; flex-shrink: 0; }
.ind-info:hover { color: #58a6ff; }

/* 하단 설명 팝업 */
#ind-desc-popup {
  position: absolute; left: 165px; right: 8px; bottom: 8px;
  background: #1c2128f5; border: 1px solid #388bfd; border-radius: 10px;
  padding: 12px 14px; z-index: 60; display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  max-height: 45%; overflow-y: auto;
}
#ind-desc-popup .dp-title { font-weight: 700; font-size: 14px; color: #58a6ff; margin-bottom: 6px; display: flex; justify-content: space-between; }
#ind-desc-popup .dp-close { cursor: pointer; color: #8b949e; font-size: 16px; }
#ind-desc-popup .dp-opt { font-family: monospace; font-size: 11.5px; color: #a8ff78; background: #0d1117; padding: 5px 8px; border-radius: 5px; margin-bottom: 6px; }
#ind-desc-popup .dp-desc { font-size: 12.5px; color: #c9d1d9; margin-bottom: 8px; line-height: 1.5; }
#ind-desc-popup .dp-sig { font-size: 11.5px; padding: 4px 8px; border-radius: 4px; margin: 3px 0; }
#ind-desc-popup .dp-sig.b { background: #ef535022; color: #ef5350; }
#ind-desc-popup .dp-sig.s { background: #1976d222; color: #58a6ff; }
#ind-desc-popup .dp-sig.n { background: #37415122; color: #8b949e; }
#ind-desc-popup .dp-more { display: inline-block; margin-top: 8px; color: #58a6ff; font-size: 12px; text-decoration: none; }
.def-star { flex-shrink: 0; width: 13px; height: 13px; cursor: pointer; accent-color: #f0a836; }
.sidebar-help { padding: 6px 8px; font-size: 9px; color: #6e7681; line-height: 1.5; border-bottom: 1px solid #21262d; }
.sidebar-help b { color: #f0a836; }
.sidebar-help .c2 { color: #58a6ff; }

/* 토글 버튼 */
#toggle-btn {
  position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  z-index: 50; width: 18px; height: 48px;
  background: #21262d; border: 1px solid #30363d;
  border-left: none; border-radius: 0 6px 6px 0;
  cursor: pointer; color: #8b949e; font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  transition: left 0.22s ease;
  user-select: none;
}
#toggle-btn:hover { background: #30363d; color: #e6edf3; }
#toggle-btn.collapsed { left: 0; }

/* 챠트 영역 */
#chart-area {
  flex: 1; display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  padding: 2px 4px 80px; gap: 3px;
  -webkit-overflow-scrolling: touch;
}
#chart-area::-webkit-scrollbar { width: 4px; }
#chart-area::-webkit-scrollbar-track { background: #0d1117; }
#chart-area::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

/* 메인 캔들 - 고정 높이 */
#candle-wrap {
  flex: 0 0 320px; height: 320px;
  border: 1px solid #21262d; border-radius: 4px;
  overflow: hidden; position: sticky; top: 0; z-index: 10;
}
#candle-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

/* 한 봉씩 넘기기 버튼 — 화면 우측 하단 고정. 화살표 방향으로 캔들이 움직인다 */
#step-pad { position: fixed; right: 14px; bottom: 18px; z-index: 60; display: flex; gap: 8px; }
#step-pad button {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(33,38,45,.92); border: 1px solid #58a6ff; color: #58a6ff;
  font-size: 30px; font-weight: 700; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
  padding: 0 4px 4px 0;
}
#step-pad button.rev { border-color: #6e7681; color: #8b949e; padding: 0 0 4px 4px; }
#step-pad button:active { background: #58a6ff; color: #0d1117; }
#step-pad button.rev:active { background: #8b949e; color: #0d1117; }
#step-pad button:disabled { opacity: .3; border-color: #30363d; color: #6e7681; background: rgba(33,38,45,.6); }

/* 보조지표 패널 - 각각 고정 높이 */
.sub-wrap {
  flex: 0 0 98px; height: 98px;
  border: 1px solid #30363d;
  border-top: 2px solid #388bfd44;
  border-radius: 4px;
  overflow: hidden;
  background: #161b22;
}
.sub-canvas { width: 100%; height: 100%; display: block; }
.sub-close {
  position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  background: #21262dcc; color: #8b949e;
  border: 1px solid #30363d; border-radius: 4px;
  font-size: 10px; cursor: pointer; z-index: 5;
  line-height: 1; user-select: none;
}
.sub-close:hover { background: #da3633; color: #fff; border-color: #da3633; }

/* 스크롤바 */
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-track { background: #0d1117; }
#sidebar::-webkit-scrollbar-thumb { background: #21262d; border-radius: 2px; }
</style>
</head>
<body>

<!-- 헤더 -->
<div id="header">
  <!-- 1줄: 타이틀 + 오늘 날짜 -->
  <div id="header-row1">
    <span class="title">
      <button id="sidebar-toggle-btn" onclick="toggleSidebar()" title="지표 패널" style="background:#21262d;border:1px solid #30363d;color:#8b949e;padding:2px 7px;border-radius:4px;cursor:pointer;font-size:12px;">☰</button>
      📈 KG 챠트분석
    </span>
    <span id="today-date" style="color:#8b949e;font-size:12px">-</span>
  </div>

  <!-- 2줄: KR/US + 검색창 + 종목명 -->
  <div id="header-row2">
    <div id="market-toggle">
      <button class="mkt-btn active" data-market="kr">🇰🇷</button>
      <button class="mkt-btn" data-market="us">🌐</button>
    </div>
    <div id="search-wrap">
      <input id="search-input" placeholder="종목명/코드 검색" autocomplete="off">
      <div id="stock-dropdown"></div>
    </div>
    <span id="selected-stock"></span>
    <span id="stock-name" style="display:none"></span>
    <span id="stock-code-display" style="display:none"></span>
  </div>

  <!-- 3줄: 주가 정보 + 기간 드롭다운 -->
  <div id="header-row3">
    <div id="ohlc-info">
      <span class="price" id="info-close">-</span>
      <span><span class="label">시</span><span id="info-open">-</span></span>
      <span><span class="label">고</span><span id="info-high" style="color:#ef5350">-</span></span>
      <span><span class="label">저</span><span id="info-low" style="color:#1976d2">-</span></span>
    </div>
    <button id="iframe-sidebar-btn" onclick="toggleSidebar()" style="background:#21262d;border:1px solid #30363d;color:#8b949e;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:700">☰ 지표</button>
    <span id="iframe-stock-name" style="font-weight:700;font-size:13px;color:#e6edf3;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <select id="interval-select" style="margin-left:auto;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:4px 8px;border-radius:5px;font-size:13px;font-weight:700;cursor:pointer">
      <option value="5m">5분</option>
      <option value="60m">1시간</option>
      <option value="1d" selected>일봉</option>
      <option value="1wk">주봉</option>
      <option value="1mo">월봉</option>
    </select>
    <span id="header-date" style="display:none"></span>
  </div>
</div>

<!-- 본체 -->
<div id="body">
  <!-- 사이드바 -->
  <div id="sidebar">
    <div class="sidebar-help">
      <span class="c2">☑</span> 지표를 클릭해 차트에 표시/숨김<br>
      아래 <b>기본 조합</b> 버튼으로 추천 지표를 한 번에 표시
    </div>
    <button id="defaultComboBtn" style="width:calc(100% - 12px);margin:6px;padding:7px;border-radius:6px;border:1px solid #30363d;background:#1f6feb;color:#fff;font-weight:700;font-size:12px;cursor:pointer">📊 기본 조합 표시</button>
    <div class="group-title">▶ 오버레이</div>
    <label class="ind-label" data-key="MA" style="--col:#f0a836"><input type="checkbox" class="cb-show"> <span class="nm">MA 이동평균</span></label>
    <label class="ind-label" data-key="BB" style="--col:#39d353"><input type="checkbox" class="cb-show"> <span class="nm">BB 볼린저밴드</span></label>
    <label class="ind-label" data-mark5 data-key="ICHIMOKU" style="--col:#ff7eb6"><input type="checkbox" class="cb-show"> <span class="nm">Ichimoku 일목균형표</span></label>
    <label class="ind-label" data-key="DEMA" style="--col:#a8ff78"><input type="checkbox" class="cb-show"> <span class="nm">DEMA 이중지수이동평균</span></label>
    <label class="ind-label" data-mark5 data-key="VAMA" style="--col:#ffd54f"><input type="checkbox" class="cb-show"> <span class="nm">VAMA 거래량조정이동평균</span></label>
    <label class="ind-label" data-key="VIDYA" style="--col:#4ecdc4"><input type="checkbox" class="cb-show"> <span class="nm">VIDYA 가변동적이동평균</span></label>
    <label class="ind-label" data-key="VPROFILE" style="--col:#d2a8ff"><input type="checkbox" class="cb-show"> <span class="nm">VP 매물대(거래량프로파일)</span></label>

    <div class="group-title">▶ 추세지표</div>
    <label class="ind-label" data-mark5 data-key="MACD" style="--col:#58a6ff"><input type="checkbox" class="cb-show"> <span class="nm">MACD 이동평균수렴발산</span></label>
    <label class="ind-label" data-key="ADX" style="--col:#3fb950"><input type="checkbox" class="cb-show"> <span class="nm">DMI 방향성지수</span></label>
    <label class="ind-label" data-key="ADXR" style="--col:#e0b341"><input type="checkbox" class="cb-show"> <span class="nm">ADXR 평균방향성지표순위</span></label>
    <label class="ind-label" data-key="CCI" style="--col:#f78166"><input type="checkbox" class="cb-show"> <span class="nm">CCI 추세채널지수</span></label>
    <label class="ind-label" data-key="AROON" style="--col:#bc8cff"><input type="checkbox" class="cb-show"> <span class="nm">Aroon 아룬</span></label>
    <label class="ind-label" data-key="FORCE" style="--col:#ff7eb6"><input type="checkbox" class="cb-show"> <span class="nm">Force 포스인덱스</span></label>
    <label class="ind-label" data-key="FRGN_NET" style="--col:#4ecdc4"><input type="checkbox" class="cb-show"> <span class="nm">외국인 순매수</span></label>
    <label class="ind-label" data-key="INST_NET" style="--col:#ff9800"><input type="checkbox" class="cb-show"> <span class="nm">기관 순매수</span></label>
    <label class="ind-label" data-key="SHORT_SELL" style="--col:#ef5350"><input type="checkbox" class="cb-show"> <span class="nm">SHORT 공매도</span></label>

    <div class="group-title">▶ 모멘텀지표</div>
    <label class="ind-label" data-mark5 data-key="RSI" style="--col:#3fb950"><input type="checkbox" class="cb-show"> <span class="nm">RSI 상대강도지수</span></label>
    <label class="ind-label" data-key="SMI" style="--col:#f0a836"><input type="checkbox" class="cb-show"> <span class="nm">SMI 스토캐스틱모멘텀지수</span></label>
    <label class="ind-label" data-key="STOCHRSI" style="--col:#bc8cff"><input type="checkbox" class="cb-show"> <span class="nm">StochRSI 상대강도스토캐스틱</span></label>
    <label class="ind-label" data-key="STOCH" style="--col:#39d353"><input type="checkbox" class="cb-show"> <span class="nm">Stoch 스토캐스틱</span></label>
    <label class="ind-label" data-mark5 data-key="SLOWSTOCH" style="--col:#ff7eb6"><input type="checkbox" class="cb-show"> <span class="nm">SlowStoch 완만한스토캐스틱</span></label>
    <label class="ind-label" data-key="CMO" style="--col:#f78166"><input type="checkbox" class="cb-show"> <span class="nm">CMO 샨드모멘텀오실레이터</span></label>
    <label class="ind-label" data-key="DMI_DYN" style="--col:#a8ff78"><input type="checkbox" class="cb-show"> <span class="nm">Dyn.MI 다이나믹모멘텀지수</span></label>
    <label class="ind-label" data-key="MASS" style="--col:#4ecdc4"><input type="checkbox" class="cb-show"> <span class="nm">Mass 대중심리지수</span></label>
    <label class="ind-label" data-key="DISPARITY" style="--col:#58a6ff"><input type="checkbox" class="cb-show"> <span class="nm">Disparity 이격도</span></label>
    <label class="ind-label" data-key="CHAIKIN_OSC" style="--col:#ff7eb6"><input type="checkbox" class="cb-show"> <span class="nm">Chaikin Osc 차이킨오실레이터</span></label>
    <label class="ind-label" data-key="MOM" style="--col:#3fb950"><input type="checkbox" class="cb-show"> <span class="nm">MOM 모멘텀</span></label>
    <label class="ind-label" data-key="WILLR" style="--col:#f78166"><input type="checkbox" class="cb-show"> <span class="nm">%R 윌리엄스퍼센트R</span></label>

    <div class="group-title">▶ 변동성지표</div>
    <label class="ind-label" data-key="ATR" style="--col:#f78166"><input type="checkbox" class="cb-show"> <span class="nm">ATR 평균진정가격범위</span></label>
    <label class="ind-label" data-mark5 data-key="RVI" style="--col:#bc8cff"><input type="checkbox" class="cb-show"> <span class="nm">RVI 상대변동성지수</span></label>
    <label class="ind-label" data-mark5 data-key="INERTIA" style="--col:#a8ff78"><input type="checkbox" class="cb-show"> <span class="nm">Inertia 관성지수</span></label>
    <label class="ind-label" data-key="CHAIKIN_VOL" style="--col:#4ecdc4"><input type="checkbox" class="cb-show"> <span class="nm">Chaikin Vol 차이킨변동성</span></label>

    <div class="group-title">▶ 거래량지표</div>
    <label class="ind-label" data-key="VOLUME" style="--col:#8b949e"><input type="checkbox" class="cb-show"> <span class="nm">거래량</span></label>
    <label class="ind-label" data-key="OBV" style="--col:#39d353"><input type="checkbox" class="cb-show"> <span class="nm">OBV 누적거래량</span></label>
    <label class="ind-label" data-key="CMF" style="--col:#ff7eb6"><input type="checkbox" class="cb-show"> <span class="nm">CMF 차이킨자금흐름</span></label>
    <label class="ind-label" data-key="MFI" style="--col:#a8ff78"><input type="checkbox" class="cb-show"> <span class="nm">MFI 자금수급지수</span></label>
    <label class="ind-label" data-key="PVT" style="--col:#4ecdc4"><input type="checkbox" class="cb-show"> <span class="nm">PVT 거래량추세지수</span></label>
    <label class="ind-label" data-key="WILLIAMS_AD" style="--col:#58a6ff"><input type="checkbox" class="cb-show"> <span class="nm">Williams AD 윌리엄스누적확산지수</span></label>
  </div>

  <div id="toggle-btn" onclick="toggleSidebar()" title="지표 패널 열기/닫기">›</div>

<!-- 챠트 영역 -->

function genDummy(n=200, startPrice=50000) {
  const data=[]; let price=startPrice;
  let date=new Date('2024-05-01');
  for(let i=0;i<n;i++){
    while([0,6].includes(date.getDay())) date.setDate(date.getDate()+1);
    const chg=(Math.random()-0.48)*price*0.018;
    const open=price; price=Math.max(price+chg,100);
    const hi=Math.max(open,price)*(1+Math.random()*0.01);
    const lo=Math.min(open,price)*(1-Math.random()*0.01);
    data.push({date:date.toISOString().slice(0,10), open:Math.round(open), high:Math.round(hi), low:Math.round(lo), close:Math.round(price), volume:Math.round(Math.random()*8e6+5e5)});
    date=new Date(date); date.setDate(date.getDate()+1);
  }
  return data;
}

// ══════════════════════════════════════
// 수학 유틸
// ══════════════════════════════════════
function ema(arr, len) {
  const k=2/(len+1), r=new Array(arr.length).fill(null);
  let sum=0, cnt=0;
  for(let i=0;i<arr.length;i++){
    if(arr[i]==null) continue;
    if(cnt<len){sum+=arr[i];cnt++;if(cnt===len)r[i]=sum/len;}
    else r[i]=arr[i]*k+r[i-1]*(1-k);
  }
  return r;
}
function sma(arr,len){
  return arr.map((_,i)=>{
    if(i<len-1)return null;
    return arr.slice(i-len+1,i+1).reduce((a,b)=>a+(b||0),0)/len;
  });
}
function stdev(arr,len){
  return arr.map((_,i)=>{
    if(i<len-1)return null;
    const s=arr.slice(i-len+1,i+1);
    const m=s.reduce((a,b)=>a+b,0)/len;
    return Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/len);
  });
}
function highest(arr,len,i){return Math.max(...arr.slice(Math.max(0,i-len+1),i+1).filter(v=>v!=null));}
function lowest(arr,len,i){return Math.min(...arr.slice(Math.max(0,i-len+1),i+1).filter(v=>v!=null));}

// ══════════════════════════════════════
// 지표 계산
// ══════════════════════════════════════
const CALC = {
  MA:(d)=>{const c=d.map(x=>x.close);return{ma5:sma(c,P('MA',0,5)),ma20:sma(c,P('MA',1,20)),ma60:sma(c,P('MA',2,60)),ma120:sma(c,P('MA',3,120))};},
  BB:(d)=>{const bp=P('BB',0,20),bs=P('BB',1,2),c=d.map(x=>x.close),mid=sma(c,bp),sd=stdev(c,bp);return{upper:mid.map((v,i)=>v&&sd[i]?v+bs*sd[i]:null),mid,lower:mid.map((v,i)=>v&&sd[i]?v-bs*sd[i]:null)};},
  ICHIMOKU:(d)=>{
    const h=d.map(x=>x.high),l=d.map(x=>x.low),c=d.map(x=>x.close);
    const S=26; // 이동 기간(기준기간)
    const N=d.length;
    const tenkan=d.map((_,i)=>i<8?null:(highest(h,9,i)+lowest(l,9,i))/2);
    const kijun=d.map((_,i)=>i<25?null:(highest(h,26,i)+lowest(l,26,i))/2);
    const rawA=tenkan.map((v,i)=>v&&kijun[i]?(v+kijun[i])/2:null);
    const rawB=d.map((_,i)=>i<51?null:(highest(h,52,i)+lowest(l,52,i))/2);
    // 선행스팬 A·B: 26칸 앞(미래)으로 이동. 데이터 끝 너머 26칸까지 확장 배열
    const senkouA=new Array(N+S).fill(null);
    const senkouB=new Array(N+S).fill(null);
    for(let i=0;i<N;i++){
      if(rawA[i]!=null) senkouA[i+S]=rawA[i];
      if(rawB[i]!=null) senkouB[i+S]=rawB[i];
    }
    // 후행스팬: 종가를 26칸 뒤(과거)로 이동
    const chikou=new Array(N).fill(null);
    for(let i=0;i<N;i++){ if(i-S>=0) chikou[i-S]=c[i]; }
    return{tenkan,kijun,senkouA,senkouB,chikou};
  },
  VAMA:(d)=>{
    // 거래량조정 이동평균 = Σ(거래량×종가) / Σ(거래량)  — 거래량 많은 날의 가격에 가중
    const vama=(len)=>d.map((_,i)=>{
      if(i<len-1) return null;
      let sp=0, sv=0;
      for(let k=i-len+1;k<=i;k++){ const v=d[k].volume||0; sp+=v*d[k].close; sv+=v; }
      return sv>0 ? sp/sv : null;
    });
    return{short:vama(P('VAMA',0,5)), long:vama(P('VAMA',1,20))};
  },
  DEMA:(d)=>{const c=d.map(x=>x.close),e1=ema(c,20),e2=ema(e1,20);const dema=e1.map((v,i)=>v&&e2[i]?2*v-e2[i]:null);return{dema,signal:ema(dema,9)};},
  VIDYA:(d)=>{
    const c=d.map(x=>x.close),period=P('VIDYA',0,14);
    // CMO(변동성) 계산
    const cmo=c.map((_,i)=>{
      if(i<period)return null;
      let up=0,dn=0;
      for(let j=i-period+1;j<=i;j++){const diff=c[j]-c[j-1];if(diff>0)up+=diff;else dn-=diff;}
      return Math.abs((up-dn)/((up+dn)||1));
    });
    const k=2/(period+1),vidya=new Array(c.length).fill(null);
    // 초기값을 SMA(period)로 시드 → 주가와 붙어서 시작
    let seed=0; for(let j=0;j<period;j++) seed+=c[j]; seed/=period;
    vidya[period-1]=seed;
    for(let i=period;i<c.length;i++){
      if(cmo[i]==null){vidya[i]=vidya[i-1];continue;}
      const prev=(vidya[i-1]!=null)?vidya[i-1]:c[i];
      const alpha=k*cmo[i];
      vidya[i]=alpha*c[i]+(1-alpha)*prev;
    }
    return{vidya,signal:ema(vidya,P('VIDYA',1,9))};
  },
  MACD:(d)=>{
    const mf=P('MACD',0,12),ms=P('MACD',1,26),msig=P('MACD',2,9);
    const c=d.map(x=>x.close),e12=ema(c,mf),e26=ema(c,ms);
    const macd=e12.map((v,i)=>v&&e26[i]?v-e26[i]:null);
    const signal=ema(macd,msig);
    return{macd,signal,hist:macd.map((v,i)=>v&&signal[i]?v-signal[i]:null)};
  },
  ADX:(d)=>{
    const period=14,pdm=[],ndm=[],tr=[];
    for(let i=1;i<d.length;i++){
      const up=d[i].high-d[i-1].high,dn=d[i-1].low-d[i].low;
      pdm.push(up>dn&&up>0?up:0); ndm.push(dn>up&&dn>0?dn:0);
      tr.push(Math.max(d[i].high-d[i].low,Math.abs(d[i].high-d[i-1].close),Math.abs(d[i].low-d[i-1].close)));
    }
    const smooth=(arr)=>{const r=new Array(d.length).fill(null);let s=arr.slice(0,period).reduce((a,b)=>a+b,0);r[period]=s;for(let i=period;i<arr.length;i++){s=s-s/period+arr[i];r[i+1]=s;}return r;};
    const str=smooth(tr),sp=smooth(pdm),sn=smooth(ndm);
    const pdi=str.map((v,i)=>v?(sp[i]/v)*100:null),ndi=str.map((v,i)=>v?(sn[i]/v)*100:null);
    const dx=pdi.map((v,i)=>v&&ndi[i]?(Math.abs(v-ndi[i])/((v+ndi[i])||1))*100:null);
    return{adx:ema(dx,period),pdi,ndi};
  },
  ADXR:(d)=>{
    // ADXR = (오늘의 ADX + n일 전의 ADX) / 2  (n=14, 웰리스 와일더)
    const period=14;
    const a=CALC.ADX(d);
    const adx=a.adx;
    const adxr=adx.map((v,i)=>{
      const prev=i-period>=0?adx[i-period]:null;
      return (v!=null&&prev!=null)?(v+prev)/2:null;
    });
    return{adxr,adx,pdi:a.pdi,ndi:a.ndi};
  },
  CCI:(d)=>{const cp=P('CCI',0,20),tp=d.map(x=>(x.high+x.low+x.close)/3);return{cci:tp.map((_,i)=>{if(i<cp-1)return null;const sl=tp.slice(i-cp+1,i+1),m=sl.reduce((a,b)=>a+b)/cp,md=sl.reduce((a,b)=>a+Math.abs(b-m),0)/cp;return(tp[i]-m)/(0.015*(md||1e-10));})};},
  AROON:(d)=>{
    const period=25;
    const up=d.map((_,i)=>{if(i<period)return null;const sl=d.slice(i-period,i+1),mi=sl.reduce((mi,x,j)=>x.high>sl[mi].high?j:mi,0);return(mi/period)*100;});
    const dn=d.map((_,i)=>{if(i<period)return null;const sl=d.slice(i-period,i+1),mi=sl.reduce((mi,x,j)=>x.low<sl[mi].low?j:mi,0);return(mi/period)*100;});
    return{up,dn,osc:up.map((v,i)=>v!=null&&dn[i]!=null?v-dn[i]:null)};
  },
  FORCE:(d)=>{const fi=d.map((x,i)=>i===0?null:(x.close-d[i-1].close)*x.volume);return{force:ema(fi,13)};},
  FRGN_NET:(d)=>{
    const fd = state.frgnData;
    const net = d.map(x => (fd && fd[x.date] && fd[x.date].net != null) ? fd[x.date].net : null);
    const amt = d.map(x => (fd && fd[x.date] && fd[x.date].amt != null) ? fd[x.date].amt : null);
    // 외국인 보유비율
    const ratio = d.map(x => (fd && fd[x.date] && fd[x.date].ratio > 0) ? fd[x.date].ratio : null);
    return { net, amt, ratio };
  },
  INST_NET:(d)=>{
    const fd = state.frgnData;
    const inst = d.map(x => (fd && fd[x.date] && fd[x.date].inst != null) ? fd[x.date].inst : null);
    let cumSum = 0;
    const cum = inst.map(v => { if (v != null) cumSum += v; return v != null ? cumSum : null; });
    return { inst, cum };
  },
  SHORT_SELL:(d)=>{
    // 공매도 거래량 + 순보유잔고 (한국 종목 전용, state.shortData에서 날짜 매칭)
    const sd = state.shortData;
    const vol = d.map(x => (sd && sd[x.date]) ? sd[x.date].vol : null);
    const bal = d.map(x => (sd && sd[x.date]) ? sd[x.date].bal : null);
    return { vol, bal };
  },
  RSI:(d)=>{
    const rp=P('RSI',0,14);
    const c=d.map(x=>x.close),gains=[],losses=[];
    for(let i=1;i<c.length;i++){const diff=c[i]-c[i-1];gains.push(diff>0?diff:0);losses.push(diff<0?-diff:0);}
    const rsi=[null];let ag=gains.slice(0,rp).reduce((a,b)=>a+b,0)/rp,al=losses.slice(0,rp).reduce((a,b)=>a+b,0)/rp;
    rsi.push(...new Array(rp-1).fill(null));rsi.push(100-100/(1+ag/(al||1e-10)));
    for(let i=rp;i<gains.length;i++){ag=(ag*(rp-1)+gains[i])/rp;al=(al*(rp-1)+losses[i])/rp;rsi.push(100-100/(1+ag/(al||1e-10)));}
    return{rsi};
  },
  SMI:(d)=>{
    const n=d.length,period=13,sk=25,sd=3,D=[],Ds=[];
    for(let i=0;i<n;i++){if(i<period-1){D.push(null);Ds.push(null);continue;}const hh=Math.max(...d.slice(i-period+1,i+1).map(x=>x.high)),ll=Math.min(...d.slice(i-period+1,i+1).map(x=>x.low));D.push(d[i].close-(hh+ll)/2);Ds.push(hh-ll);}
    const d2=ema(ema(D,sk),sk),ds2=ema(ema(Ds,sk),sk);
    const smi=d2.map((v,i)=>v!=null&&ds2[i]?(v/(ds2[i]/2))*100:null);
    return{smi,signal:ema(smi,sd)};
  },
  STOCHRSI:(d)=>{
    const rsi=CALC.RSI(d).rsi;
    const srsi=rsi.map((_,i)=>{if(i<27)return null;const sl=rsi.slice(i-13,i+1).filter(v=>v!=null),mn=Math.min(...sl),mx=Math.max(...sl);return mx===mn?50:((rsi[i]-mn)/(mx-mn))*100;});
    return{k:srsi,d:sma(srsi,3)};
  },
  STOCH:(d)=>{
    const K=d.map((_,i)=>{if(i<13)return null;const sl=d.slice(i-13,i+1),hh=Math.max(...sl.map(x=>x.high)),ll=Math.min(...sl.map(x=>x.low));return hh===ll?50:((d[i].close-ll)/(hh-ll))*100;});
    return{k:K,d:sma(K,3)};
  },
  SLOWSTOCH:(d)=>{
    const K=d.map((_,i)=>{if(i<13)return null;const sl=d.slice(i-13,i+1),hh=Math.max(...sl.map(x=>x.high)),ll=Math.min(...sl.map(x=>x.low));return hh===ll?50:((d[i].close-ll)/(hh-ll))*100;});
    const slowK=sma(K,3);return{k:slowK,d:sma(slowK,3)};
  },
  CMO:(d)=>{const c=d.map(x=>x.close);return{cmo:c.map((_,i)=>{if(i<14)return null;let up=0,dn=0;for(let j=i-13;j<=i;j++){const diff=c[j]-c[j-1];if(diff>0)up+=diff;else dn-=diff;}return((up-dn)/((up+dn)||1e-10))*100;})};},
  DMI_DYN:(d)=>{
    const c=d.map(x=>x.close),sd=stdev(c,10);
    const dmi=c.map((_,i)=>{
      if(i<15)return null;const vol=sd[i]||1,rsiLen=Math.max(3,Math.min(30,Math.round(14/vol)));
      if(i<rsiLen)return null;let ag=0,al=0;
      for(let j=i-rsiLen+1;j<=i;j++){const diff=c[j]-c[j-1];if(diff>0)ag+=diff;else al-=diff;}
      ag/=rsiLen;al/=rsiLen;return 100-100/(1+ag/(al||1e-10));
    });
    return{dmi};
  },
  MASS:(d)=>{
    const hl=d.map(x=>x.high-x.low),e1=ema(hl,9),e2=ema(e1,9);
    const ratio=e1.map((v,i)=>v&&e2[i]?v/e2[i]:null);
    return{mass:ratio.map((_,i)=>{if(i<24)return null;return ratio.slice(i-24,i+1).reduce((a,b)=>a+(b||0),0);})};
  },
  DISPARITY:(d)=>{const dp=P('DISPARITY',0,20),c=d.map(x=>x.close),ma=sma(c,dp);return{disp:c.map((v,i)=>ma[i]?(v/ma[i])*100:null)};},
  CHAIKIN_OSC:(d)=>{
    let cum=0;const adlCum=d.map(x=>{const mfm=x.high===x.low?0:((x.close-x.low)-(x.high-x.close))/(x.high-x.low);cum+=mfm*x.volume;return cum;});
    const e3=ema(adlCum,3),e10=ema(adlCum,10);
    return{osc:e3.map((v,i)=>v&&e10[i]?v-e10[i]:null)};
  },
  MOM:(d)=>{const mp=P('MOM',0,12),c=d.map(x=>x.close);return{mom:c.map((v,i)=>i>=mp?v-c[i-mp]:null)};},
  WILLR:(d)=>{return{wr:d.map((_,i)=>{if(i<13)return null;const sl=d.slice(i-13,i+1),hh=Math.max(...sl.map(x=>x.high)),ll=Math.min(...sl.map(x=>x.low));return hh===ll?-50:((hh-d[i].close)/(hh-ll))*-100;})};},
  ATR:(d)=>{const tr=d.map((x,i)=>i===0?x.high-x.low:Math.max(x.high-x.low,Math.abs(x.high-d[i-1].close),Math.abs(x.low-d[i-1].close)));return{atr:sma(tr,14)};},
  RVI:(d)=>{
    // 책 공식: 9일 표준편차를 상승일/하락일로 나눠 와일더 평활(n=14)
    //  당일종가 ≥ 전일종가 → up=9일 표준편차, dn=0
    //  당일종가 <  전일종가 → up=0, dn=9일 표준편차
    //  upavg = (upavg×(n-1)+up)/n , dnavg 동일
    //  RVI = upavg / (upavg+dnavg) × 100
    const n=P('RVI',0,14);
    const c=d.map(x=>x.close), sd=stdev(c,9);
    const up=[], dn=[];
    for(let i=0;i<c.length;i++){
      if(sd[i]==null || i===0){ up.push(null); dn.push(null); continue; }
      if(c[i]>=c[i-1]){ up.push(sd[i]); dn.push(0); }
      else { up.push(0); dn.push(sd[i]); }
    }
    // 와일더 평활
    const rvi=new Array(c.length).fill(null);
    let ua=null, da=null;
    for(let i=0;i<c.length;i++){
      if(up[i]==null||dn[i]==null) continue;
      ua = (ua==null) ? up[i] : (ua*(n-1)+up[i])/n;
      da = (da==null) ? dn[i] : (da*(n-1)+dn[i])/n;
      const s=ua+da;
      rvi[i] = s>0 ? (ua/s)*100 : null;
    }
    return{rvi};
  },
  INERTIA:(d)=>{
    // 책 공식: Inertia = Least Square Moving Average of RVI
    //  - RVI(0~100)를 최소자승 이동평균(기본 20일)한 것이 Inertia
    //  - 시그널곡선 = Inertia를 다시 최소자승 이동평균(9일)한 것
    const per=P('INERTIA',0,20), sigPer=9;
    const rvi=CALC.RVI(d).rvi;
    // 최소자승(선형회귀) 이동평균 — 구간 회귀선의 끝점 값
    const lsma=(arr,len)=>arr.map((_,i)=>{
      if(i<len-1) return null;
      const sl=arr.slice(i-len+1,i+1);
      if(sl.some(v=>v==null)) return null;
      const n=sl.length;
      const sx=n*(n-1)/2, sy=sl.reduce((a,b)=>a+b,0);
      const sx2=sl.reduce((a,_,j)=>a+j*j,0), sxy=sl.reduce((a,b,j)=>a+j*b,0);
      const den=n*sx2-sx*sx;
      const slope=den?(n*sxy-sx*sy)/den:0;
      const intercept=(sy-slope*sx)/n;
      return intercept+slope*(n-1);
    });
    const inertia=lsma(rvi,per);
    const signal=lsma(inertia,sigPer);
    return{inertia,signal};
  },
  CHAIKIN_VOL:(d)=>{const hl=d.map(x=>x.high-x.low),e=ema(hl,10);return{cv:e.map((v,i)=>i>=10&&e[i-10]?((v-e[i-10])/e[i-10])*100:null)};},
  VOLUME:(d)=>{return{vol:d.map(x=>x.volume)};},
  OBV:(d)=>{let obv=0;return{obv:d.map((x,i)=>{if(i>0)obv+=x.close>d[i-1].close?x.volume:x.close<d[i-1].close?-x.volume:0;return obv;})};},
  CMF:(d)=>{
    const mfv=d.map(x=>{const mfm=x.high===x.low?0:((x.close-x.low)-(x.high-x.close))/(x.high-x.low);return mfm*x.volume;});
    return{cmf:mfv.map((_,i)=>{if(i<19)return null;const sm=mfv.slice(i-19,i+1).reduce((a,b)=>a+b,0),sv=d.slice(i-19,i+1).reduce((a,b)=>a+b.volume,0);return sm/(sv||1);})};
  },
  MFI:(d)=>{
    const tp=d.map(x=>(x.high+x.low+x.close)/3);
    return{mfi:tp.map((_,i)=>{if(i<14)return null;let pos=0,neg=0;for(let j=i-13;j<=i;j++){const mf=tp[j]*d[j].volume;if(j>0&&tp[j]>tp[j-1])pos+=mf;else neg+=mf;}return 100-100/(1+pos/(neg||1e-10));})};
  },
  PVT:(d)=>{
    // 책 공식: PVT = PVT₋₁ + 거래량 × (당일종가 - 전일종가) / 전일종가
    let pvt=0;
    const arr=d.map((x,i)=>{ if(i>0) pvt += ((x.close-d[i-1].close)/(d[i-1].close||1))*x.volume; return pvt; });
    return{pvt:arr, sig:ema(arr,9)};
  },
  WILLIAMS_AD:(d)=>{let ad=0;return{wad:d.map((x,i)=>{if(i>0){const pc=d[i-1].close,th=Math.max(x.high,pc),tl=Math.min(x.low,pc);if(x.close>pc)ad+=x.close-tl;else if(x.close<pc)ad+=x.close-th;}return ad;})};},
};

let sidebarOpen = false; // 기본값: 닫힘

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  applySidebarState();
}

function closeSidebar() {
  if (!sidebarOpen) return;
  sidebarOpen = false;
  applySidebarState();
}

function applySidebarState() {
  const sb = document.getElementById('sidebar');
  const tb = document.getElementById('toggle-btn');
  const stb = document.getElementById('sidebar-toggle-btn');
  if (sidebarOpen) {
    sb.classList.remove('collapsed');
    tb.textContent = '‹';
    tb.style.left = '156px';
    if (stb) stb.style.color = '#58a6ff';
  } else {
    sb.classList.add('collapsed');
    tb.textContent = '›';
    tb.style.left = '0';
    if (stb) stb.style.color = '#8b949e';
  }
  // 사이드바가 차트를 덮으므로 차트 크기 변화 없음 → 재렌더 불필요
}

function init() {
  // 초기 사이드바 닫힘
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('toggle-btn').style.left = '0';

  // 오늘 날짜 표시 (YYYY-MM-DD)
  const td = document.getElementById('today-date');
  if (td) {
    const now = new Date();
    td.textContent = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  }

  // 사이드바 먼저 설정 (기본 표시 지표 반영)
  setupSidebar();
  setupHeader();
  setupSearch();

  // 차트 영역(캔들+보조차트) 터치/클릭 시 사이드바 닫기
  const chartArea = document.getElementById('chart-area');
  if (chartArea) {
    chartArea.addEventListener('mousedown', () => { if (sidebarOpen) closeSidebar(); });
    chartArea.addEventListener('touchstart', () => { if (sidebarOpen) closeSidebar(); }, { passive: true });
  }
  // 사이드바 자체를 터치하면 닫히지 않도록 (이벤트 전파 차단)
  const sidebarEl = document.getElementById('sidebar');
  if (sidebarEl) {
    sidebarEl.addEventListener('mousedown', e => e.stopPropagation());
    sidebarEl.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
  }

  // URL 파라미터로 종목 자동 로드
  const params = new URLSearchParams(location.search);
  const urlCode = params.get('code');
  const urlName = params.get('name');
  if (urlCode) {
    const stock = { code: urlCode, name: urlName || urlCode, price: 50000 };
    const isKr = /^\d{6}$/.test(urlCode) || urlCode === 'KOSPI' || urlCode === 'KOSDAQ';
    if (!isKr) {
      stock.yahooSym = urlCode;
    }
    // 국가 선택 버튼도 종목에 맞게 자동 전환
    state.market = isKr ? 'kr' : 'us';
    document.querySelectorAll('.mkt-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.market === state.market);
    });
    loadStock(stock);
  } else {
    loadStock(state.stock);
  }
}

const WORKER = 'https://quote.kghwang1.workers.dev';

// 종목코드 → 야후 심볼 변환
function toYahooSymbol(stock) {
  if (stock.yahooSym) return stock.yahooSym; // 미국주식 직접 지정
  const code = stock.code;
  if (code === 'KOSPI')  return '^KS11';
  if (code === 'KOSDAQ') return '^KQ11';
  if (/^\d{6}$/.test(code)) return code + '.KS';
  return code; // 그 외 그대로 (미국 티커 등)
}

// 기간 → 야후 range 문자열
// 봉 종류별 데이터 요청 범위 (야후 range)
function toYahooRange(period, interval) {
  interval = interval || '1d';
  if (interval === '5m')  return '5d';    // 5분봉: 5일 (야후 제한)
  if (interval === '60m') return '1mo';   // 1시간봉: 1개월
  if (interval === '1mo') return '10y';   // 월봉
  if (interval === '1wk') return '3y';    // 주봉
  return '3y';                            // 일봉 (약 750거래일)
}

// 초기 표시할 캔들 개수 (이후 손가락 확대/축소로 조절)
function calcShowCount(period, interval) {
  interval = interval || '1d';
  if (interval === '5m')  return 60;   // 5분봉 60개
  if (interval === '60m') return 50;   // 1시간봉 50개
  if (interval === '1mo') return 24;   // 월봉 24개(2년)
  if (interval === '1wk') return 52;   // 주봉 52개(1년)
  return 90;                           // 일봉 90개
}

// Worker에서 OHLCV 데이터 + 종목정보 가져오기
// 한국 6자리 코드 → KIS API, 미국/지수 → 야후
async function fetchReal(stock) {
  const code = stock.code;
  const isKrStock = /^\d{6}$/.test(code); // 순수 한국 주식 (지수 제외)
  const range = toYahooRange(state.period, state.interval);

  // ── 한국 종목 일/주/월봉: 네이버 차트 우선 (KRX 공식 데이터, HTS와 일치) ──
  const naverTF = {'1d':'day','1wk':'week','1mo':'month'}[state.interval];
  if (isKrStock && naverTF) {
    try {
      const nUrl = `${WORKER}/?naverChart=${code}&timeframe=${naverTF}&days=1000&_t=${Date.now()}`;
      const nRes = await fetch(nUrl, { cache: 'no-store' });
      const nJson = await nRes.json();
      if (nJson.ok && nJson.data && nJson.data.length >= 5) {
        return {
          ohlcv: nJson.data,
          name: stock.name || code,
          validSymbol: true,
          realSymbol: code,
          currency: 'KRW',
          exchange: 'KRX',
          source: 'naver',
        };
      }
    } catch(e) {
      console.warn('Naver chart fail, try KIS:', e);
    }
    // 네이버 실패 시 KIS 시도
    if (state.interval === '1d') {
      try {
        const url = `${WORKER}/?kisChart=${encodeURIComponent(code)}&range=3y&_t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        const json = await res.json();
        if (json.ok && json.ohlcv && json.ohlcv.length >= 5) {
          return {
            ohlcv: json.ohlcv,
            name: stock.name || code,
            validSymbol: true,
            realSymbol: code,
            currency: 'KRW',
            exchange: 'KRX',
            source: 'kis',
          };
        }
      } catch(e) {
        console.warn('KIS fetch fail, fallback to yahoo:', e);
      }
    }
  }

  // ── 미국(해외) 종목 일/주/월봉: 네이버 해외주식 차트 우선 (HTS와 근접) ──
  const isForeignStock = !isKrStock && /^[A-Za-z]/.test(String(code)) && !/^\^/.test(String(code));
  if (isForeignStock && naverTF) {
    try {
      const nwUrl = `${WORKER}/?naverWorldChart=${encodeURIComponent(code)}&timeframe=${naverTF}&days=1000&_t=${Date.now()}`;
      const nwRes = await fetch(nwUrl, { cache: 'no-store' });
      const nwJson = await nwRes.json();
      if (nwJson.ok && nwJson.data && nwJson.data.length >= 5) {
        return {
          ohlcv: nwJson.data,
          name: stock.name || code,
          validSymbol: true,
          realSymbol: code,
          currency: 'USD',
          exchange: 'US',
          source: 'naver_world',
        };
      }
    } catch(e) {
      console.warn('Naver world chart fail, try yahoo:', e);
    }
  }

  // ── 미국주식/지수/분봉: 야후 (국내 종목도 위 실패 시 최후 수단) ──
  const sym = toYahooSymbol(stock);
  const url = `${WORKER}/?yahooChart=${encodeURIComponent(sym)}&range=${range}&interval=${state.interval}&_t=${Date.now()}`;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    const json = await res.json();
    if (json.ok && json.ohlcv && json.ohlcv.length) {
      return {
        ohlcv: json.ohlcv,
        name: json.name || sym,
        validSymbol: json.validSymbol !== false,
        realSymbol: json.realSymbol || sym,
        currency: json.currency || '',
        exchange: json.exchange || '',
      };
    }
  } catch(e) {
    console.error('fetchReal error:', e);
  }
  return null;
}

// 로딩 표시
function showLoading(msg) {
  const canvas = document.getElementById('candle-canvas');
  const wrap = document.getElementById('candle-wrap');
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#161b22'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#58a6ff'; ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(msg, W/2, H/2);
}

// ── 보기 상태(배율·기간) 저장/복원: 차트는 종목마다 새로 로드되므로 localStorage 사용 ──
const VIEW_KEY = 'kg_chart_view';
function saveView() {
  try {
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      zoom: state.keepZoom, from: state.keepFrom, to: state.keepTo,
      atEnd: state.keepAtEnd, interval: state.interval
    }));
  } catch (e) {}
}
function loadView() {
  try {
    const raw = localStorage.getItem(VIEW_KEY);
    if (!raw) return;
    const v = JSON.parse(raw);
    if (!v) return;
    // 봉 단위가 다르면 구간 의미가 달라지므로 무시
    if (v.interval && v.interval !== state.interval) return;
    state.keepZoom = v.zoom || null;
    state.keepFrom = v.from || null;
    state.keepTo = v.to || null;
    state.keepAtEnd = v.atEnd !== false;
  } catch (e) {}
}
function clearView() {
  state.keepZoom = null; state.keepFrom = null; state.keepTo = null; state.keepAtEnd = true;
  try { localStorage.removeItem(VIEW_KEY); } catch (e) {}
}

async function loadStock(stock) {
  state.stock = stock;
  const inp = document.getElementById('search-input');
  const isKorean = /^\d{6}$/.test(stock.code) || stock.code === 'KOSPI' || stock.code === 'KOSDAQ';

  // 검색창 표시:
  //  한국 = 기업명 / 외국 = 티커
  const isPreset = STOCKS.some(s => s.code === stock.code && (s.yahooSym || s.code==='KOSPI' || s.code==='KOSDAQ'));
  if (isKorean || isPreset) {
    inp.value = stock.name; // 한국 종목·지수/원자재: 이름 표시
  } else {
    inp.value = stock.code; // 외국 개별종목: 티커
  }
  // 검색창 아래:
  //  한국 = 번호 / 외국 = 기업명 전체 (로딩 후 채움)
  const selEl = document.getElementById('selected-stock');
  if (selEl) selEl.textContent = isKorean ? (stock.code !== stock.name ? stock.code : '') : '';
  showLoading('📡 데이터 로딩중...');

  // 실제 데이터 시도
  let result = null;
  try {
    result = await fetchReal(stock);
  } catch(e) {}

  if (result && result.ohlcv && result.ohlcv.length >= 5) {
    // 미국 티커 검증: 야후가 인식 못하면(validSymbol=false) 오류
    if (!isKorean && !result.validSymbol) {
      showLoading('❌ 없는 종목입니다: ' + stock.code);
      showMsg('❌ "' + stock.code + '" 는(은) 올바른 티커가 아닙니다', 4000);
      inp.value = '';
      return;
    }
    state.data = result.ohlcv;
    state.isReal = true;
    state.stock = { ...stock, fullName: result.name || stock.name, currency: result.currency };
    const selEl2 = document.getElementById('selected-stock');
    if (selEl2) {
      if (isKorean) {
        // 한국: 검색창 아래 = 번호 (영어명 제거)
        selEl2.textContent = stock.code !== stock.name ? stock.code : '';
      } else {
        // 외국: 검색창 아래 = 기업명 전체
        selEl2.textContent = result.name || stock.name;
      }
    }
  } else {
    // 데이터 자체를 못 받음
    if (!isKorean) {
      showLoading('❌ 종목을 찾을 수 없습니다: ' + stock.code);
      showMsg('❌ "' + stock.code + '" 종목 데이터가 없습니다', 4000);
      inp.value = '';
      return;
    }
    state.data = genDummy(200, stock.price);
    state.isReal = false;
    showMsg('⚠️ 실제 데이터 로드 실패 — 더미 데이터로 표시합니다', 3000);
  }

  // 표시는 선택 기간만큼, 데이터는 넉넉히 받아 지표 계산
  // 사용자가 보던 구간(날짜)이 있으면 같은 기간을 복원
  loadView();  // 저장된 배율·기간 불러오기 (새 탭/새로고침에도 유지)
  const showCount = calcShowCount(state.period, state.interval);
  let showLen = Math.min(showCount, state.data.length);
  let restored = false;
  if (state.keepFrom && state.keepTo && !state.keepAtEnd) {
    // 날짜로 인덱스 찾기 (없으면 가장 가까운 날짜)
    const idxOf = (target, dflt) => {
      const arr = state.data;
      let best = -1;
      for (let i = 0; i < arr.length; i++) {
        if (!arr[i] || !arr[i].date) continue;
        if (arr[i].date >= target) { best = i; break; }
      }
      return best >= 0 ? best : dflt;
    };
    const s0 = idxOf(state.keepFrom, -1);
    const e0 = idxOf(state.keepTo, -1);
    if (s0 >= 0 && e0 >= 0 && e0 > s0) {
      state.range = [s0, Math.min(state.data.length, e0 + 1)];
      restored = true;
    }
  }
  if (!restored) {
    if (state.keepZoom && state.keepZoom > 0) {
      showLen = Math.max(8, Math.min(state.keepZoom, state.data.length));
    }
    state.range = [Math.max(0, state.data.length - showLen), state.data.length + (state.overlays.ICHIMOKU ? 0 : 1)];
  }

  // 한국 종목 + 일봉이면 외국인 순매수 + 공매도 데이터도 로드
  state.frgnData = null;
  state.shortData = null;
  if (isKorean && state.interval === '1d') {
    fetchForeignDaily(stock.code);
    fetchShortDaily(stock.code);
  }

  renderAll();
}

// 외국인 일별 순매수 데이터 로드 (worker: ?frgnDaily=코드&days=N)
async function fetchForeignDaily(code) {
  const myStock = state.stock && state.stock.code;
  try {
    const url = `${WORKER}/?frgnDaily=${encodeURIComponent(code)}&days=300&_t=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    const json = await res.json();
    // 응답 도착 시 종목이 바뀌었으면 무시
    if (!state.stock || state.stock.code !== myStock) return;
    if (json.ok && json.data && json.data.length) {
      const map = {};
      json.data.forEach(d => { map[d.date] = { net: d.net, amt: d.amt != null ? d.amt : null, inst: d.inst || 0, hold: d.hold || 0, ratio: d.ratio || 0 }; });
      state.frgnData = map;
      renderAll();
    }
  } catch(e) {
    console.warn('foreign daily fetch fail:', e);
  }
}

// 공매도 일별 데이터 로드 (worker: ?short=코드&days=60)
async function fetchShortDaily(code) {
  const myStock = state.stock && state.stock.code;
  try {
    const url = `${WORKER}/?short=${encodeURIComponent(code)}&days=300&_t=${Date.now()}`;
    const res = await fetch(url, { cache: 'no-store' });
    const json = await res.json();
    if (!state.stock || state.stock.code !== myStock) return;
    if (json.ok && json.data && json.data.length) {
      const map = {};
      json.data.forEach(d => {
        const date = (d.TRD_DD || d.date || '').replace(/\//g, '-');
        const vol = parseInt(String(d.CVSRTSELL_TRDVOL || d.vol || 0).replace(/,/g, ''), 10) || 0;
        const bal = parseInt(String(d.STR_CONST_VAL1 || d.bal || '0').replace(/[^0-9]/g, ''), 10) || 0;
        if (date) map[date] = { vol, bal };
      });
      state.shortData = map;
      renderAll();
    }
  } catch(e) {
    console.warn('short selling fetch fail:', e);
  }
}

function setupSearch() {
  const input = document.getElementById('search-input');
  const dropdown = document.getElementById('stock-dropdown');
  let searchTimer = null;

  // 드롭다운 항목 클릭 처리
  function bindItems() {
    dropdown.querySelectorAll('.stock-item').forEach(item => {
      item.addEventListener('mousedown', () => {
        const code = item.dataset.code;
        const name = item.dataset.name;
        const yahoo = item.dataset.yahoo;
        if (code && name) {
          loadStock({ code, name, price: 50000, yahooSym: yahoo || null });
          dropdown.style.display = 'none';
        }
      });
    });
  }

  // 기본 종목 목록 표시
  function showDefault() {
    dropdown.innerHTML = STOCKS.map(s =>
      `<div class="stock-item" data-code="${s.code}" data-name="${s.name}"${s.yahooSym?` data-yahoo="${s.yahooSym}"`:''}>
        <span>${s.name}</span><span class="stock-code">${s.code}</span>
      </div>`
    ).join('');
    dropdown.style.display = 'block';
    bindItems();
  }

  // 네이버 실시간 검색
  async function searchNaver(q) {
    dropdown.innerHTML = '<div style="padding:8px 10px;color:#8b949e;font-size:11px">🔍 검색중...</div>';
    dropdown.style.display = 'block';

    // 지수·원자재 등 기본 목록에서 먼저 찾기 (이름·심볼 부분일치)
    const ql = q.toLowerCase().replace(/\s/g,'');
    const isIdx = s => !!s.yahooSym || s.code === 'KOSPI' || s.code === 'KOSDAQ';
    const presets = STOCKS.filter(s => isIdx(s) &&
      (s.name.toLowerCase().replace(/\s/g,'').includes(ql) || s.code.toLowerCase().includes(ql)));
    let preHtml = presets.map(s =>
      `<div class="stock-item" data-code="${s.code}" data-name="${s.name}"${s.yahooSym?` data-yahoo="${s.yahooSym}"`:''}>
        <span>${s.name}</span><span class="stock-code">${s.code}</span>
      </div>`).join('');
    if (preHtml) {
      dropdown.innerHTML = preHtml;
      bindItems();
    }

    let html = '';
    try {
      if (state.market === 'kr') {
        // 한국만 검색 (빠름)
        const r = await fetch(`${WORKER}/?find=${encodeURIComponent(q)}`).then(r=>r.json()).catch(()=>({}));
        if (r.ok && r.items && r.items.length) {
          html += r.items.map(s =>
            `<div class="stock-item" data-code="${s.code}" data-name="${s.name}">
              <span>${s.name}</span><span class="stock-code">${s.code}</span>
            </div>`
          ).join('');
        }
      } else {
        // 해외만 검색 (빠름)
        const r = await fetch(`${WORKER}/?ussearch=${encodeURIComponent(q)}`).then(r=>r.json()).catch(()=>({}));
        if (r.ok && r.items && r.items.length) {
          html += r.items.map(s =>
            `<div class="stock-item" data-code="${s.symbol}" data-name="${(s.name||'').replace(/"/g,'')}" data-yahoo="${s.symbol}">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${s.name||s.symbol}</span>
              <span class="stock-code">${s.symbol}</span>
            </div>`
          ).join('');
        }
      }
    } catch(e) {}

    if (!html) {
      if (preHtml) { dropdown.innerHTML = preHtml; bindItems(); return; }   // 지수·원자재만 있으면 그대로
      const other = state.market === 'kr' ? '🌐 해외' : '🇰🇷 한국';
      html = `<div style="padding:8px 10px;color:#8b949e;font-size:11px">검색 결과 없음<br><span style="font-size:10px">${other} 버튼도 확인해보세요</span></div>`;
    }
    dropdown.innerHTML = preHtml + html;   // 지수·원자재를 위에, 종목 검색 결과를 아래에
    bindItems();
  }

  // 한국/해외 토글 버튼
  document.querySelectorAll('.mkt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.market = btn.dataset.market;
      document.querySelectorAll('.mkt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // placeholder 변경
      input.placeholder = state.market === 'kr' ? '한국 종목명/코드' : '해외 회사명/티커 (예: apple)';
      // 검색어 있으면 다시 검색
      const q = input.value.trim();
      if (q) searchNaver(q);
      input.focus();
    });
  });

  input.addEventListener('input', () => {
    const q = input.value.trim();
    clearTimeout(searchTimer);
    if (!q) { showDefault(); return; }
    // 300ms 디바운스
    searchTimer = setTimeout(() => searchNaver(q), 300);
  });

  input.addEventListener('focus', () => {
    const q = input.value.trim();
    if (!q) showDefault(); else searchNaver(q);
  });

  input.addEventListener('blur', () => {
    setTimeout(() => { dropdown.style.display = 'none'; }, 200);
  });

  // 엔터키로 직접 입력
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const q = input.value.trim();
      if (!q) return;
      // 첫 드롭다운 항목이 있으면 그것 선택 (정확한 종목)
      const firstItem = dropdown.querySelector('.stock-item');
      if (firstItem) {
        firstItem.dispatchEvent(new Event('mousedown'));
        return;
      }
      // 없으면 직접 입력 처리
      if (/^\d{6}$/.test(q)) {
        loadStock({ code: q, name: q, price: 50000 });
      } else if (state.market === 'us') {
        loadStock({ code: q.toUpperCase(), name: q.toUpperCase(), price: 100, yahooSym: q.toUpperCase() });
      } else {
        loadStock({ code: q, name: q, price: 50000 });
      }
      dropdown.style.display = 'none';
    }
  });
}

const OVERLAY_KEYS = ['MA','BB','ICHIMOKU','DEMA','VAMA','VIDYA','VPROFILE'];

// 기본 표시 지표 불러오기 (localStorage)
// 사용자 지정 지표 파라미터 (설명 페이지에서 편집)
function loadUserParams() {
  try { return JSON.parse(localStorage.getItem('kgchart_params') || '{}'); }
  catch(e) { return {}; }
}
function P(key, idx, def) {
  const all = loadUserParams();
  if (all[key] && all[key][idx] != null && all[key][idx] > 0) return all[key][idx];
  return def;
}

// 기본 조합 (일목·DMI·ADXR·RSI·외국인순매수) — 순서 중요
const DEFAULT_COMBO = ['ICHIMOKU', 'ADX', 'ADXR', 'RSI', 'FRGN_NET'];
function loadDefaults() {
  try {
    const saved = localStorage.getItem('kgchart_defaults');
    if (saved) { const d = JSON.parse(saved); if (d && Object.keys(d).length) return d; }
  } catch(e) {}
  // 저장값 없으면 기본 조합
  const d = {};
  DEFAULT_COMBO.forEach(k => d[k] = true);
  return d;
}
function saveDefaults(defs) {
  try { localStorage.setItem('kgchart_defaults', JSON.stringify(defs)); } catch(e) {}
}

function setupSidebar() {
  const defaults = loadDefaults();

  document.querySelectorAll('.ind-label').forEach(label => {
    const key = label.dataset.key;
    const cbShow = label.querySelector('.cb-show');  // 표시 체크박스 (유일)
    const span = label.querySelector('span.nm');
    const col = getComputedStyle(label).getPropertyValue('--col').trim();
    if (!cbShow) return;

    // 명칭(span) 클릭 → 설명 페이지로 이동
    if (span) {
      span.style.cursor = 'pointer';
      span.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const nm = span.textContent.trim();
        const st = state.stock || {};
        const qp = new URLSearchParams();
        qp.set('q', nm);
        if (st.code) qp.set('code', st.code);
        if (st.name) qp.set('name', st.name);
        location.href = 'kg-guide.html?' + qp.toString();
      });
    }

    // 시작 표시 상태 = 저장된 기본값
    const isOn = !!defaults[key];
    cbShow.checked = isOn;
    if (isOn) {
      label.classList.add('active');
      span.style.color = col;
      if (OVERLAY_KEYS.includes(key)) state.overlays[key] = true;
      else { state.selected[key] = true; if (!state.selectedOrder.includes(key)) state.selectedOrder.push(key); }
    } else {
      if (OVERLAY_KEYS.includes(key)) state.overlays[key] = false;
      else state.selected[key] = false;
    }

    // 표시 체크박스 클릭 → 지금 화면에 표시/숨김
    cbShow.addEventListener('change', (e) => {
      e.stopPropagation();
      if (OVERLAY_KEYS.includes(key)) {
        state.overlays[key] = cbShow.checked;
      } else {
        state.selected[key] = cbShow.checked;
        if (cbShow.checked) {
          if (!state.selectedOrder.includes(key)) state.selectedOrder.push(key);
        } else {
          state.selectedOrder = state.selectedOrder.filter(k => k !== key);
        }
      }
      if (cbShow.checked) { label.classList.add('active'); span.style.color = col; }
      else { label.classList.remove('active'); span.style.color = ''; }
      renderAll();
    });

    // label 텍스트 클릭 시 뒤칸 토글되지 않도록 (체크박스만 반응)
    label.addEventListener('click', (e) => {
      if (e.target === cbShow) return;
      e.preventDefault();
    });
  });

  // 초기 표시된 보조차트 순서를 기본 조합 순서에 맞춤 (DOM 순서 대신)
  // 저장된 순서(kgchart_order)가 있으면 그것을, 없으면 DEFAULT_COMBO 순서를 우선
  let orderPref = DEFAULT_COMBO;
  try { const so = localStorage.getItem('kgchart_order'); if (so) { const a = JSON.parse(so); if (Array.isArray(a) && a.length) orderPref = a; } } catch(e) {}
  state.selectedOrder.sort((a, b) => {
    const ia = orderPref.indexOf(a), ib = orderPref.indexOf(b);
    const va = ia < 0 ? 999 : ia, vb = ib < 0 ? 999 : ib;
    return va - vb;
  });

  // 기본 조합 버튼: 보조차트 모두 지우고 지정 조합만 순서대로 표시 + 기본으로 저장
  const comboBtn = document.getElementById('defaultComboBtn');
  if (comboBtn) {
    comboBtn.addEventListener('click', () => {
      // 현재 표시된 모든 지표 끄기
      Object.keys(state.selected).forEach(k => state.selected[k] = false);
      state.selectedOrder = [];
      Object.keys(state.overlays).forEach(k => state.overlays[k] = false);
      // 기본 조합을 순서대로 켜기
      DEFAULT_COMBO.forEach(key => {
        if (OVERLAY_KEYS.includes(key)) state.overlays[key] = true;
        else { state.selected[key] = true; state.selectedOrder.push(key); }
      });
      // 체크박스·라벨 UI 동기화
      document.querySelectorAll('.ind-label').forEach(label => {
        const key = label.dataset.key;
        const cbShow = label.querySelector('.cb-show');
        const span = label.querySelector('span.nm');
        const col = getComputedStyle(label).getPropertyValue('--col').trim();
        const on = DEFAULT_COMBO.includes(key);
        if (cbShow) cbShow.checked = on;
        if (on) { label.classList.add('active'); if (span) span.style.color = col; }
        else { label.classList.remove('active'); if (span) span.style.color = ''; }
      });
      // 이 조합을 기본값으로 저장
      const defs = {};
      DEFAULT_COMBO.forEach(k => defs[k] = true);
      saveDefaults(defs);
      try { localStorage.setItem('kgchart_order', JSON.stringify(DEFAULT_COMBO)); } catch(e) {}
      renderAll();
    });
  }
}

// ══════════════════════════════════════
// 캔들 렌더러
// ══════════════════════════════════════
function drawCandle() {
  const canvas = document.getElementById('candle-canvas');
  const wrap = document.getElementById('candle-wrap');
  canvas.style.width = '100%'; canvas.style.height = '100%';
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const {data, range, overlays} = state;
  if (!data.length) return;
  // range 끝이 데이터 길이를 넘을 수 있음(미래 여백). 캔들은 실제 데이터 구간만 그림
  const dataEnd = Math.min(range[1], data.length);
  const slice = data.slice(range[0], dataEnd);
  const ICHI_SHIFT = 26;
  // 화면 전체 슬롯 = range 폭 (미래 여백이 range에 포함됨)
  const slotCount = range[1] - range[0];
  const PAD = {l:8, r:62, t:10, b:24};  // 세로축 우측
  const cw = W - PAD.l - PAD.r, ch = H - PAD.t - PAD.b;

  let maxP = Math.max(...slice.map(d => d.high));
  let minP = Math.min(...slice.map(d => d.low));

  if (overlays.BB) {
    const bb = CALC.BB(data);
    const u = bb.upper.slice(...range).filter(Boolean), l = bb.lower.slice(...range).filter(Boolean);
    if (u.length) maxP = Math.max(maxP, ...u);
    if (l.length) minP = Math.min(minP, ...l);
  }
  if (overlays.ICHIMOKU) {
    const ich = CALC.ICHIMOKU(data);
    ['senkouA','senkouB'].forEach(k => {
      const v = ich[k].slice(...range).filter(Boolean);
      if (v.length) { maxP = Math.max(maxP, ...v); minP = Math.min(minP, ...v); }
    });
  }

  const pad = (maxP - minP) * 0.04;
  maxP += pad; minP -= pad;
  const xOf = i => PAD.l + (i + 0.5) * (cw / slotCount);
  const yOf = v => PAD.t + ch - ((v - minP) / (maxP - minP)) * ch;
  const bw = Math.max(1, cw / slotCount * 0.55);

  ctx.fillStyle = C.panel; ctx.fillRect(0, 0, W, H);

  // 격자 (세로축 우측)
  for (let i = 0; i <= 5; i++) {
    const y = PAD.t + (ch / 5) * i;
    ctx.strokeStyle = C.border; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
    const v = maxP - ((maxP - minP) / 5) * i;
    ctx.fillStyle = C.muted; ctx.font = '11px monospace'; ctx.textAlign = 'left';
    ctx.fillText(v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(1), W - PAD.r + 3, y + 3);
  }

  // 차트 끝 표시: 마지막 실제 캔들 다음(내일 자리)에 세로 기준선
  {
    const lastIdx = dataEnd - 1 - range[0];   // range 기준 마지막 캔들 슬롯
    const tomoX = xOf(lastIdx + 1);            // 내일 자리 x
    if (tomoX >= PAD.l && tomoX <= W - PAD.r) {
      ctx.save();
      ctx.strokeStyle = C.muted; ctx.lineWidth = 1; ctx.setLineDash([4, 3]); ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.moveTo(tomoX, PAD.t); ctx.lineTo(tomoX, PAD.t + ch); ctx.stroke();
      ctx.restore();
    }
  }

  // 일목균형표 구름
  if (overlays.ICHIMOKU) {
    const ich = CALC.ICHIMOKU(data);
    // 화면 표시 범위: range 시작 ~ range끝+미래여백 (senkouA/B는 N+26 길이 확장 배열)
    const eStart = range[0], eEnd = range[1];
    const sa = ich.senkouA.slice(eStart, eEnd), sb = ich.senkouB.slice(eStart, eEnd);
    for (let i = 0; i < sa.length - 1; i++) {
      if (!sa[i] || !sb[i]) continue;
      ctx.beginPath();
      ctx.moveTo(xOf(i), yOf(sa[i])); ctx.lineTo(xOf(i+1), yOf(sa[i+1]||sa[i]));
      ctx.lineTo(xOf(i+1), yOf(sb[i+1]||sb[i])); ctx.lineTo(xOf(i), yOf(sb[i]));
      ctx.closePath();
      ctx.fillStyle = sa[i] > sb[i] ? '#3fb95022' : '#ef535022'; ctx.fill();
    }
    const drawL = (arr, col, w) => {
      const sl = arr.slice(eStart, eEnd);
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); let s = false;
      sl.forEach((v, i) => { if (!v) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); }); ctx.stroke();
    };
    drawL(ich.tenkan, '#ffd54f', 1); drawL(ich.kijun, '#ef5350', 1.5);
    drawL(ich.senkouA, '#3fb950', 0.8); drawL(ich.senkouB, '#bc8cff', 0.8);
    drawL(ich.chikou, '#00bcd4', 1); // 후행스팬 (청록)
  }

  // BB
  if (overlays.BB) {
    const bb = CALC.BB(data);
    ['upper','mid','lower'].forEach((k, ki) => {
      const sl = bb[k].slice(...range);
      ctx.strokeStyle = ki===1 ? '#8d939fdd' : '#8d939fcc';
      ctx.lineWidth = ki===1 ? 2.25 : 2.25; ctx.setLineDash(ki===1 ? [4,4] : []);
      ctx.beginPath(); let s = false;
      sl.forEach((v,i) => { if (!v) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); });
      ctx.stroke(); ctx.setLineDash([]);
    });
  }

  // MA
  if (overlays.MA) {
    const ma = CALC.MA(data);
    const cols = {ma5:'#ef5350cc', ma20:'#f59e0bcc', ma60:'#3fb950cc', ma120:'#58a6ffcc'};
    const labels = {ma5:'5', ma20:'20', ma60:'60', ma120:'120'};
    Object.entries(cols).forEach(([k, col]) => {
      const sl = ma[k].slice(...range);
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); let s = false;
      sl.forEach((v,i) => { if (!v) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); });
      ctx.stroke();
    });
  }

  // DEMA + 시그널선
  if (overlays.DEMA) {
    const r = CALC.DEMA(data);
    // DEMA 본선 (노랑 실선)
    const sl = r.dema.slice(...range);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1.5; ctx.setLineDash([]); ctx.beginPath(); let s = false;
    sl.forEach((v,i) => { if (!v) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); }); ctx.stroke();
    // 시그널선 (빨강 점선)
    const sig = r.signal.slice(...range);
    ctx.strokeStyle = '#ef5350cc'; ctx.lineWidth = 1; ctx.setLineDash([4,3]); ctx.beginPath(); let s2 = false;
    sig.forEach((v,i) => { if (!v) return; s2 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s2=true); }); ctx.stroke();
    ctx.setLineDash([]);
  }

  // VAMA 거래량조정 이동평균 (5일 노랑 / 20일 빨강) + 골든·데드크로스
  if (overlays.VAMA) {
    const r = CALC.VAMA(data);
    const s5 = r.short.slice(...range), s20 = r.long.slice(...range);
    ctx.setLineDash([]);
    // 20일선 (빨강)
    ctx.strokeStyle = '#ef5350'; ctx.lineWidth = 1.4; ctx.beginPath(); let a = false;
    s20.forEach((v,i) => { if (!v) return; a ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), a=true); }); ctx.stroke();
    // 5일선 (노랑)
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1.4; ctx.beginPath(); let b = false;
    s5.forEach((v,i) => { if (!v) return; b ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), b=true); }); ctx.stroke();
    // 골든크로스=매입 / 데드크로스=매도
    ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
    for (let i = 1; i < s5.length; i++) {
      const a0 = s5[i-1], a1 = s5[i], b0 = s20[i-1], b1 = s20[i];
      if (a0 == null || a1 == null || b0 == null || b1 == null) continue;
      if (a0 <= b0 && a1 > b1) {          // 골든크로스 → 매입
        const x = xOf(i), y = yOf(a1);
        ctx.fillStyle = '#2979ff';
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.fillText('매입', x, y + 22);
      }
      if (a0 >= b0 && a1 < b1) {          // 데드크로스 → 매도
        const x = xOf(i), y = yOf(a1);
        ctx.fillStyle = '#ef5350';
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.fillText('매도', x, y - 14);
      }
    }
  }

  // VIDYA + 시그널선
  if (overlays.VIDYA) {
    const r = CALC.VIDYA(data);
    // VIDYA 본선 (청록 실선)
    const sl = r.vidya.slice(...range);
    ctx.strokeStyle = C.teal; ctx.lineWidth = 1.5; ctx.setLineDash([]); ctx.beginPath(); let s = false;
    sl.forEach((v,i) => { if (!v) return; s ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s=true); }); ctx.stroke();
    // 시그널선 (청록 점선)
    const sig = r.signal.slice(...range);
    ctx.strokeStyle = '#4ecdc499'; ctx.lineWidth = 1; ctx.setLineDash([4,3]); ctx.beginPath(); let s2 = false;
    sig.forEach((v,i) => { if (!v) return; s2 ? ctx.lineTo(xOf(i), yOf(v)) : (ctx.moveTo(xOf(i), yOf(v)), s2=true); }); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── 매물대 (Volume Profile) ──
  if (overlays.VPROFILE) {
    const BINS = 24; // 가격 구간 수
    const binVol = new Array(BINS).fill(0);
    const binBuyVol = new Array(BINS).fill(0); // 상승 거래량
    // 각 캔들의 거래량을 가격구간에 배분
    slice.forEach(d => {
      const midP = (d.high + d.low + d.close) / 3;
      let bin = Math.floor(((midP - minP) / (maxP - minP)) * BINS);
      bin = Math.max(0, Math.min(BINS - 1, bin));
      binVol[bin] += d.volume;
      if (d.close >= d.open) binBuyVol[bin] += d.volume;
    });
    const maxBinVol = Math.max(...binVol);
    if (maxBinVol > 0) {
      const binH = ch / BINS;
      const maxBarW = cw * 0.32; // 최대 막대 폭 (차트폭의 32%)
      // POC(최대 매물대) 찾기
      let pocBin = binVol.indexOf(maxBinVol);
      for (let b = 0; b < BINS; b++) {
        if (binVol[b] <= 0) continue;
        const barW = (binVol[b] / maxBinVol) * maxBarW;
        const y = PAD.t + ch - (b + 1) * binH;
        // 매수/매도 비율에 따라 색
        const buyRatio = binBuyVol[b] / binVol[b];
        const isPoc = (b === pocBin);
        ctx.fillStyle = isPoc ? '#d2a8ff55'
          : buyRatio >= 0.5 ? '#ef535033' : '#1976d233';
        ctx.fillRect(PAD.l, y + 1, barW, binH - 1);
        // POC 강조 테두리
        if (isPoc) {
          ctx.strokeStyle = '#d2a8ffaa'; ctx.lineWidth = 1;
          ctx.strokeRect(PAD.l, y + 1, barW, binH - 1);
        }
      }
      // POC 라벨
      const pocY = PAD.t + ch - (pocBin + 0.5) * binH;
      const pocPrice = minP + ((pocBin + 0.5) / BINS) * (maxP - minP);
      ctx.fillStyle = '#d2a8ff'; ctx.font = '8px monospace'; ctx.textAlign = 'left';
      ctx.fillText('POC ' + Math.round(pocPrice).toLocaleString(), PAD.l + 2, pocY - 2);
    }
  }

  // 캔들
  slice.forEach((d, i) => {
    const x = xOf(i), isUp = d.close >= d.open, col = isUp ? C.up : C.down;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, yOf(d.high)); ctx.lineTo(x, yOf(d.low)); ctx.stroke();
    const y1 = yOf(Math.max(d.open, d.close)), bodyH = Math.max(1, yOf(Math.min(d.open, d.close)) - y1);
    ctx.fillRect(x - bw/2, y1, bw, bodyH);
  });

  // ── 최고가 / 최저가 마커 (현재가 대비 비율 표시) ──
  let hiIdx = 0, loIdx = -1;
  slice.forEach((d, i) => {
    if (d.high > slice[hiIdx].high) hiIdx = i;
    if (d.low > 0 && (loIdx < 0 || d.low < slice[loIdx].low)) loIdx = i;
  });
  if (loIdx < 0) loIdx = 0;
  const hiVal = slice[hiIdx].high, loVal = slice[loIdx].low;
  const curPrice = slice[slice.length - 1].close;
  const hiDate = (slice[hiIdx].date || '').slice(2).replace(/-/g, '.');
  const loDate = (slice[loIdx].date || '').slice(2).replace(/-/g, '.');
  const hiPct = hiVal > 0 ? ((curPrice - hiVal) / hiVal * 100).toFixed(2) : '0';
  const loPct = loVal > 0 ? ((curPrice - loVal) / loVal * 100).toFixed(2) : '0';
  // 최고가 (빨간색, 좌측 표시 + 화살표로 캔들 위치 가리킴)
  {
    const hx = xOf(hiIdx), hy = yOf(hiVal);
    const hiTxt = Math.round(hiVal).toLocaleString() + ' ' + hiPct + '%';
    ctx.font = 'bold 11.5px monospace';
    const tw = ctx.measureText(hiTxt).width;
    // 좌측에 충분한 공간이 있으면 좌측, 없으면 우측에 표시
    if (hx - tw - 20 > PAD.l) {
      ctx.fillStyle = '#ef5350'; ctx.textAlign = 'right';
      ctx.fillText(hiTxt, hx - 8, hy - 2);
      ctx.fillText('←', hx - 2, hy - 2);
    } else {
      ctx.fillStyle = '#ef5350'; ctx.textAlign = 'left';
      ctx.fillText('→ ' + hiTxt, hx + 6, hy - 2);
    }
    // 가는 점선으로 캔들 가리킴
    ctx.strokeStyle = '#ef535055'; ctx.lineWidth = 0.5; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 10); ctx.stroke();
    ctx.setLineDash([]);
  }
  // 최저가 (녹색, 좌측 표시 + 화살표)
  {
    const lx = xOf(loIdx), ly = yOf(loVal);
    const loTxt = Math.round(loVal).toLocaleString() + ' ' + (loPct >= 0 ? '+' : '') + loPct + '%';
    ctx.font = 'bold 11.5px monospace';
    const tw = ctx.measureText(loTxt).width;
    if (lx - tw - 20 > PAD.l) {
      ctx.fillStyle = '#3fb950'; ctx.textAlign = 'right';
      ctx.fillText(loTxt, lx - 8, ly + 14);
      ctx.fillText('←', lx - 2, ly + 14);
    } else {
      ctx.fillStyle = '#3fb950'; ctx.textAlign = 'left';
      ctx.fillText('→ ' + loTxt, lx + 6, ly + 14);
    }
    ctx.strokeStyle = '#3fb95055'; ctx.lineWidth = 0.5; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 6); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── 현재가 우측 라인 + 라벨 ──
  const lastPrice = slice[slice.length - 1].close;
  const lastUp = slice[slice.length - 1].close >= slice[slice.length - 1].open;
  const priceY = yOf(lastPrice);
  const priceColor = lastUp ? C.up : C.down;
  // 점선 가로선
  ctx.strokeStyle = priceColor + 'aa'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(PAD.l, priceY); ctx.lineTo(W - PAD.r, priceY); ctx.stroke();
  ctx.setLineDash([]);
  // 현재가 라벨을 우측 세로축 위치에 표시
  const pTxt = Math.round(lastPrice).toLocaleString();
  ctx.font = 'bold 11px monospace';
  const ptw = ctx.measureText(pTxt).width;
  const pbx = W - PAD.r + 1;
  ctx.fillStyle = priceColor;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(pbx, priceY - 8, Math.max(ptw + 6, PAD.r - 2), 16, 3) : ctx.rect(pbx, priceY - 8, ptw + 6, 16);
  ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.fillText(pTxt, pbx + 3, priceY + 3);

  // 클릭 가격 수평선 + y축 라벨 (노랑)
  if (state.clickPrice != null && state.clickPrice >= minP && state.clickPrice <= maxP) {
    const cpY = yOf(state.clickPrice);
    ctx.strokeStyle = '#ffd54f88'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l, cpY); ctx.lineTo(W - PAD.r, cpY); ctx.stroke();
    ctx.setLineDash([]);
    // y축 라벨
    const cpTxt = state.clickPrice >= 1000 ? Math.round(state.clickPrice).toLocaleString() : state.clickPrice.toFixed(2);
    ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 10px monospace';
    const cpbx = W - PAD.r + 1;
    ctx.fillStyle = '#332800'; ctx.fillRect(cpbx, cpY - 8, PAD.r - 2, 16);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 1;
    ctx.strokeRect(cpbx, cpY - 8, PAD.r - 2, 16);
    ctx.fillStyle = '#ffd54f'; ctx.textAlign = 'left';
    ctx.fillText(cpTxt, cpbx + 3, cpY + 3);
  }

  // 호버 수직선 + 날짜 라벨 (26-06-03 형식)
  if (state.hoverIdx >= 0 && state.hoverIdx < slice.length) {
    const hx = xOf(state.hoverIdx);
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hx, PAD.t); ctx.lineTo(hx, PAD.t + ch); ctx.stroke();
    // 날짜 라벨 (하단)
    const hd = slice[state.hoverIdx];
    if (hd && hd.date) {
      // 2026-07-20 → 26.7.20 (분봉이면 시각 포함)
      const md = s => {
        const m = String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        return m ? m[1].slice(2) + '.' + String(parseInt(m[2],10)) + '.' + String(parseInt(m[3],10)) : String(s);
      };
      let lbl;
      if (state.interval==='5m'||state.interval==='60m') {
        const t = String(hd.date).length > 10 ? String(hd.date).slice(11,16) : '';
        lbl = md(hd.date) + (t ? ' ' + t : '');
      } else {
        lbl = md(hd.date);
      }
      ctx.font = '11px monospace'; ctx.textAlign = 'center';
      const tw = ctx.measureText(lbl).width;
      // 배경 박스
      ctx.fillStyle = '#1f6feb';
      ctx.fillRect(hx - tw/2 - 5, H - 19, tw + 10, 16);
      ctx.fillStyle = '#fff';
      ctx.fillText(lbl, hx, H - 7);
    }
  }

  // X축
  const step = Math.ceil(slice.length / 8);
  ctx.fillStyle = C.muted; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  slice.forEach((d, i) => { if (i % step === 0) {
    // 5분/1시간봉이면 시각 표시, 그 외 날짜
    const lbl = (state.interval==='5m'||state.interval==='60m') ? (d.date.length>10?d.date.slice(5,16):d.date.slice(5)) : d.date.slice(5);
    ctx.fillText(lbl, xOf(i), H - 7);
  }});

  // ── 좌상단: 오버레이 범례만 (종목명은 검색창 아래에 표시) ──
  let ly = PAD.t + 12;
  const lx = PAD.l + 5;

  // 오버레이 범례 (세로로) — 이동평균(MA) 정보는 제외
  const legends = [];
  if (overlays.BB)       legends.push({t:'BB 볼린저밴드(20,2)', c:'#8d939f'});
  if (overlays.ICHIMOKU) legends.push({t:'Ichimoku 일목균형표', c:'#ff7eb6',
    sub:[{t:'기준선', c:'#ef5350'}, {t:'전환선', c:'#ffd54f'}, {t:'선행A', c:'#3fb950'}, {t:'선행B', c:'#bc8cff'}, {t:'후행', c:'#00bcd4'}]});
  if (overlays.VAMA)     legends.push({t:'VAMA 거래량조정이동평균', c:'#ffd54f',
    sub:[{t:'5일', c:'#ffd54f'}, {t:'20일', c:'#ef5350'}]});
  if (overlays.DEMA)     legends.push({t:'DEMA 이중지수이동평균(20)', c:'#ffd54f',
    sub:[{t:'DEMA', c:'#ffd54f'}, {t:'시그널', c:'#ef5350'}]});
  if (overlays.VIDYA)    legends.push({t:'VIDYA 가변동적이동평균(14)', c:'#4ecdc4'});
  if (overlays.VPROFILE) legends.push({t:'VP 매물대(POC)', c:'#d2a8ff'});

  if (legends.length) {
    ctx.textAlign = 'left';
    ctx.font = 'bold 9px monospace';
    // MA는 한 줄에 몰아서, 나머지는 세로
    let curX = lx;
    const maFour = legends.filter(l => l.t.startsWith('MA'));
    const others = legends.filter(l => !l.t.startsWith('MA'));
    // MA 4개 한 줄
    if (maFour.length) {
      maFour.forEach(lg => {
        ctx.fillStyle = lg.c;
        ctx.fillRect(curX, ly - 6, 7, 3);
        ctx.fillText(lg.t, curX + 9, ly);
        curX += ctx.measureText(lg.t).width + 18;
      });
      ly += 13;
    }
    // 나머지 세로 한 줄씩
    others.forEach(lg => {
      ctx.fillStyle = lg.c;
      ctx.fillRect(lx, ly - 6, 7, 3);
      ctx.fillText(lg.t, lx + 9, ly);
      // 서브 항목(예: 일목균형표의 기준선·전환선) 이름 옆에 색상 견본 + 라벨
      if (lg.sub && lg.sub.length) {
        let sx = lx + 9 + ctx.measureText(lg.t).width + 10;
        lg.sub.forEach(sb => {
          ctx.fillStyle = sb.c;
          ctx.fillText(sb.t, sx, ly);
          const tw = ctx.measureText(sb.t).width;
          // 라벨 뒤에 선 견본(ㅡ)
          ctx.fillRect(sx + tw + 3, ly - 4, 10, 2);
          sx += tw + 3 + 10 + 8;
        });
      }
      ly += 13;
    });
  }
}

// ══════════════════════════════════════
// 보조지표 렌더러
// ══════════════════════════════════════
// ══════════════════════════════════════
// 보조지표 매매 신호 화살표
// ══════════════════════════════════════
function drawSubSignals(ctx, key, vals, n, xOf, yOf, minV, maxV, PAD, ch) {
  const main = vals[0];   // 주 지표선
  const sig = vals[1];    // 시그널선(있으면)
  if (!main) return;

  const signals = []; // {i, type:'b'|'s'}

  // 지표별 매수/매도 조건
  const crossUp = (a, b, i) => a[i-1]!=null && b[i-1]!=null && a[i]!=null && b[i]!=null && a[i-1]<=b[i-1] && a[i]>b[i];
  const crossDn = (a, b, i) => a[i-1]!=null && b[i-1]!=null && a[i]!=null && b[i]!=null && a[i-1]>=b[i-1] && a[i]<b[i];
  const upThru = (a, lv, i) => a[i-1]!=null && a[i]!=null && a[i-1]<lv && a[i]>=lv;
  const dnThru = (a, lv, i) => a[i-1]!=null && a[i]!=null && a[i-1]>lv && a[i]<=lv;

  for (let i = 1; i < n; i++) {
    switch(key) {
      case 'MACD':
        if (crossUp(main, sig, i)) signals.push({i, type:'b'});
        if (crossDn(main, sig, i)) signals.push({i, type:'s'});
        break;
      case 'RSI': case 'MFI': case 'STOCHRSI':
        if (upThru(main, 30, i)) signals.push({i, type:'b'});
        if (dnThru(main, 70, i)) signals.push({i, type:'s'});
        break;
      case 'STOCH': case 'SLOWSTOCH':
        if (main[i]<20 && crossUp(main, sig, i)) signals.push({i, type:'b'});
        if (main[i]>80 && crossDn(main, sig, i)) signals.push({i, type:'s'});
        break;
      case 'SMI':
        if (main[i]<-40 && crossUp(main, sig, i)) signals.push({i, type:'b'});
        if (main[i]>40 && crossDn(main, sig, i)) signals.push({i, type:'s'});
        break;
      case 'CCI':
        if (upThru(main, -100, i)) signals.push({i, type:'b'});
        if (dnThru(main, 100, i)) signals.push({i, type:'s'});
        break;
      case 'CMO':
        if (upThru(main, -50, i)) signals.push({i, type:'b'});
        if (dnThru(main, 50, i)) signals.push({i, type:'s'});
        break;
      case 'WILLR':
        if (upThru(main, -80, i)) signals.push({i, type:'b'});
        if (dnThru(main, -20, i)) signals.push({i, type:'s'});
        break;
      case 'DISPARITY':
        if (upThru(main, 95, i)) signals.push({i, type:'b'});
        if (dnThru(main, 105, i)) signals.push({i, type:'s'});
        break;
      case 'MOM': case 'FORCE': case 'CHAIKIN_OSC': case 'CMF':
        if (upThru(main, 0, i)) signals.push({i, type:'b'});
        if (dnThru(main, 0, i)) signals.push({i, type:'s'});
        break;
      case 'DMI_DYN':
        if (upThru(main, 30, i)) signals.push({i, type:'b'});
        if (dnThru(main, 70, i)) signals.push({i, type:'s'});
        break;
      case 'AROON':
        // up>70 && down<30
        if (sig && main[i]>=70 && main[i-1]<70) signals.push({i, type:'b'});
        if (sig && main[i]<=30 && main[i-1]>30) signals.push({i, type:'s'});
        break;
      case 'OBV': {
        // 최근 20봉 이전 고점/저점을 OBV가 돌파하는 시점을 매수/매도로 표기
        const LB = 20;
        if (i >= LB) {
          const win = main.slice(Math.max(0, i-LB), i).filter(v => v != null);
          if (win.length) {
            const prevHigh = Math.max(...win);
            const prevLow = Math.min(...win);
            if (main[i-1] != null && main[i] != null) {
              if (main[i-1] <= prevHigh && main[i] > prevHigh) signals.push({i, type:'b'});
              if (main[i-1] >= prevLow && main[i] < prevLow) signals.push({i, type:'s'});
            }
          }
        }
        break;
      }
    }
  }

  // 화살표 그리기 (최대 개수 제한)
  ctx.textAlign = 'center';
  ctx.font = 'bold 9px monospace';
  signals.forEach(s => {
    const x = xOf(s.i);
    const v = main[s.i];
    if (v == null) return;
    const y = yOf(v);
    if (s.type === 'b') {
      // 매수 ▲ (아래쪽, 빨강)
      ctx.fillStyle = '#ef5350';
      ctx.beginPath();
      ctx.moveTo(x, y+14); ctx.lineTo(x-4, y+21); ctx.lineTo(x+4, y+21); ctx.closePath(); ctx.fill();
    } else {
      // 매도 ▼ (위쪽, 파랑)
      ctx.fillStyle = '#1976d2';
      ctx.beginPath();
      ctx.moveTo(x, y-14); ctx.lineTo(x-4, y-21); ctx.lineTo(x+4, y-21); ctx.closePath(); ctx.fill();
    }
  });
}

function drawSub(canvas, key) {
  if (!canvas || !state.data.length) return;
  const cfg = IND_CFG[key];
  const result = CALC[key](state.data);
  const vals = Object.values(result).map(arr => arr.slice(...state.range));
  const n = state.range[1] - state.range[0];
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth, H = canvas.parentElement.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = C.panel2; ctx.fillRect(0, 0, W, H);

  const PAD = {l:8, r:62, t:6, b:4};  // 세로축 우측
  const cw = W - PAD.l - PAD.r, ch = H - PAD.t - PAD.b;
  // FRGN_NET은 수량(vals[0])과 금액(vals[1])의 단위가 완전히 달라서
  // 막대(수량) 스케일 계산 시 금액을 섞으면 막대가 안 보이게 됨 → 수량만으로 스케일 계산
  const scaleVals = (key === 'FRGN_NET') ? (vals[0] || []).filter(v => v != null) : (key === 'INST_NET') ? (vals[0] || []).filter(v => v != null) : (key === 'SHORT_SELL') ? (vals[0] || []).filter(v => v != null && v > 0) : vals.flat().filter(v => v != null);
  const allVals = scaleVals;
  if (!allVals.length) return;

  let minV = cfg.range ? cfg.range[0] : Math.min(...allVals);
  let maxV = cfg.range ? cfg.range[1] : Math.max(...allVals);
  if (!cfg.range) { const p = (maxV - minV) * 0.1; minV -= p; maxV += p; }
  if (minV === maxV) { minV -= 1; maxV += 1; }

  const xOf = i => PAD.l + (i + 0.5) * (cw / n);
  const yOf = v => PAD.t + ch - ((v - minV) / (maxV - minV)) * ch;

  // 기준선 (라벨 우측)
  (cfg.lines || []).forEach(lv => {
    if (lv < minV || lv > maxV) return;
    ctx.strokeStyle = lv === 0 ? '#37415199' : C.border;
    ctx.lineWidth = lv === 0 ? 1 : 0.5; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(PAD.l, yOf(lv)); ctx.lineTo(W - PAD.r, yOf(lv)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.muted; ctx.font = '10px monospace'; ctx.textAlign = 'left';
    ctx.fillText(lv, W - PAD.r + 3, yOf(lv) + 3);
  });

  // 차트 끝 표시: 마지막 실제 데이터 다음(내일 자리)에 세로 기준선 (메인 차트와 동일)
  {
    const dataEnd = Math.min(state.range[1], state.data.length);
    const lastIdx = dataEnd - 1 - state.range[0];
    const tomoX = xOf(lastIdx + 1);
    if (tomoX >= PAD.l && tomoX <= W - PAD.r) {
      ctx.save();
