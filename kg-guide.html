<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG 보조차트 설명</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117; color: #e6edf3;
  font-family: 'Noto Sans KR', sans-serif;
  line-height: 1.6; padding-bottom: 40px;
}
#header {
  position: sticky; top: 0; z-index: 100;
  background: #161b22; border-bottom: 1px solid #21262d;
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
}
#header .title { color: #58a6ff; font-weight: 700; font-size: 16px; }
#header .back { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
#header .back:hover { background: #30363d; }

/* 검색 */
#search-box {
  padding: 12px 16px; background: #0d1117;
  position: sticky; top: 53px; z-index: 99;
  border-bottom: 1px solid #21262d;
}
#search-input {
  width: 100%; background: #161b22; border: 1px solid #30363d;
  color: #e6edf3; padding: 10px 14px; border-radius: 8px; font-size: 14px;
}
#search-input::placeholder { color: #6e7681; }

/* 카테고리 필터 */
#cat-filter { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; overflow-x: auto; }
.cat-btn {
  background: #161b22; border: 1px solid #30363d; color: #8b949e;
  padding: 5px 12px; border-radius: 16px; cursor: pointer; font-size: 12px; white-space: nowrap;
}
.cat-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

/* 카드 */
#cards { padding: 8px 16px; display: flex; flex-direction: column; gap: 12px; }
.card {
  background: #161b22; border: 1px solid #21262d; border-radius: 12px;
  overflow: hidden;
}
.card-head {
  padding: 12px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  border-left: 4px solid var(--c, #58a6ff);
}
.card-head:hover { background: #1c2128; }
.card-head .name { font-weight: 700; font-size: 15px; flex: 1; }
.card-head .cat-tag { font-size: 10px; color: #8b949e; background: #21262d; padding: 2px 8px; border-radius: 10px; }
.card-head .arrow { color: #8b949e; font-size: 12px; transition: transform 0.2s; }
.card.open .arrow { transform: rotate(90deg); }

.card-body { display: none; padding: 0 16px 16px; }
.card.open .card-body { display: block; }

.section { margin-top: 14px; }
.section-title {
  font-size: 12px; font-weight: 700; color: var(--c, #58a6ff);
  margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
}
.section-title .ico { font-size: 14px; }
.section-content { font-size: 13.5px; color: #c9d1d9; }

.param-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 8px; }
.param-item { display: flex; flex-direction: column; gap: 2px; background: #0d1117; padding: 8px 10px; border-radius: 6px; }
.param-item label { font-size: 11px; color: #8b949e; }
.param-input { background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 5px 8px; border-radius: 4px; font-size: 13px; width: 100%; }
.param-input:focus { border-color: #58a6ff; outline: none; }
.param-def { font-size: 9px; color: #6e7681; }
.param-reset { background: #21262d; border: 1px solid #30363d; color: #f0a836; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.param-reset:hover { background: #30363d; }
.opt-box {
  background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
  padding: 10px 12px; font-family: monospace; font-size: 12.5px; color: #a8ff78;
}
.buy { color: #ef5350; font-weight: 700; }
.sell { color: #58a6ff; font-weight: 700; }
.signal-row {
  display: flex; gap: 8px; margin: 5px 0; padding: 8px 10px;
  background: #0d1117; border-radius: 6px; align-items: flex-start;
}
.signal-row .tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.signal-row .tag.b { background: #ef535033; color: #ef5350; }
.signal-row .tag.s { background: #1976d233; color: #58a6ff; }
.signal-row .tag.n { background: #37415133; color: #8b949e; }
.signal-row .desc { font-size: 12.5px; color: #c9d1d9; }

.detail-box { background: #0d1117; padding: 10px 12px; border-radius: 8px; line-height: 1.6; }
.detail-box b { color: #58a6ff; }
.tip-box { background: #1a2f1a; border-left: 3px solid #3fb950; padding: 10px 12px; border-radius: 6px; line-height: 1.6; }
/* 설명 편집 */
.edit-bar { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
.ebtn { padding: 7px 14px; border-radius: 7px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.ebtn.edit { background: #1f6feb; border-color: #1f6feb; color: #fff; }
.ebtn.save { background: #238636; border-color: #238636; color: #fff; }
.ebtn.reset { color: #f0a836; }
.ebtn.cancel { color: #8b949e; }
.ebtn:active { opacity: .75; }
.ed-input, .ed-area { width: 100%; box-sizing: border-box; background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
  padding: 8px 10px; border-radius: 7px; font-size: 13px; line-height: 1.55; font-family: inherit; }
.ed-area { resize: vertical; }
.ed-input:focus, .ed-area:focus { outline: none; border-color: #1f6feb; }
.ed-hint { font-size: 11px; color: #8b949e; margin-bottom: 5px; line-height: 1.5; }
.ed-hint b { color: #58a6ff; }
.no-result { text-align: center; color: #6e7681; padding: 40px; }
</style>
</head>
<body>

<div id="header">
  <a class="back" href="kg-chart.html">‹ 차트로</a>
  <span class="title">📊 보조차트 설명</span>
</div>

<div id="search-box">
  <input id="search-input" placeholder="🔍 지표 이름 검색 (예: RSI, 이격도, 볼린저)" autocomplete="off">
</div>

<div id="cards"></div>

<script>
// ══════════════════════════════════════
// 지표 설명 데이터
// ══════════════════════════════════════
const CAT = {
  guide: { label: '활용법', color: '#ffd54f' },
  overlay: { label: '오버레이', color: '#f0a836' },
  trend: { label: '추세', color: '#58a6ff' },
  momentum: { label: '모멘텀', color: '#bc8cff' },
  volatility: { label: '변동성', color: '#f78166' },
  volume: { label: '거래량', color: '#3fb950' },
};


// 편집 가능한 파라미터 (key: [{name, default}])
const IND_PARAMS = {
  MA:[{n:'단기',d:5},{n:'중기',d:20},{n:'장기1',d:60},{n:'장기2',d:120}],
  BB:[{n:'기간',d:20},{n:'표준편차',d:2}],
  ICHIMOKU:[{n:'전환',d:9},{n:'기준',d:26},{n:'선행',d:52}],
  VAMA:[{n:'단기',d:5},{n:'장기',d:20}],
  DEMA:[{n:'기간',d:20},{n:'시그널',d:9}],
  VPROFILE:[{n:'구간수',d:24}],
  MACD:[{n:'단기',d:12},{n:'장기',d:26},{n:'시그널',d:9}],
  ADX:[{n:'기간',d:14}],
  ADXR:[{n:'기간',d:14}],
  FORCE:[{n:'기간',d:13}],
  ELDER:[{n:'기간',d:13}],
  RSI:[{n:'기간',d:14}],
  SMI:[{n:'기간',d:13},{n:'평활',d:25},{n:'시그널',d:2}],
  STOCHRSI:[{n:'기간',d:14}],
  STOCH:[{n:'기간',d:14},{n:'평활',d:3}],
  SLOWSTOCH:[{n:'기간',d:14},{n:'평활',d:3}],
  CMO:[{n:'기간',d:14}],
  DMI_DYN:[{n:'기간',d:10}],
  MASS:[{n:'기간',d:25}],
  DISPARITY:[{n:'기간',d:20}],
  CHAIKIN_OSC:[{n:'단기',d:3},{n:'장기',d:10}],
  MOM:[{n:'기간',d:12}],
  WILLR:[{n:'기간',d:14}],
  ATR:[{n:'기간',d:14}],
  RVI:[{n:'기간',d:14}],
  INERTIA:[{n:'기간',d:20}],
  CHAIKIN_VOL:[{n:'기간',d:10}],
  CMF:[{n:'기간',d:20}],
  MFI:[{n:'기간',d:14}],
};

// ══════════════════════════════════════
// 지표 설명 사용자 편집본 (지표별 개별 저장)
// ══════════════════════════════════════
const DESC_KEY = 'kg_guide_desc';
function loadDescEdits() {
  try { return JSON.parse(localStorage.getItem(DESC_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveDescEdit(key, obj) {
  const all = loadDescEdits();
  all[key] = obj;
  try { localStorage.setItem(DESC_KEY, JSON.stringify(all)); return true; }
  catch (e) { return false; }
}
function clearDescEdit(key) {
  const all = loadDescEdits();
  delete all[key];
  try { localStorage.setItem(DESC_KEY, JSON.stringify(all)); } catch (e) {}
}
// 원본 + 사용자 편집본을 합친 최종 표시 데이터
function mergedInd(ind) {
  const e = loadDescEdits()[ind.key];
  if (!e) {
    // 편집본이 없으면 기존 detail + tip을 '상세설명'으로 통합
    const m = [];
    if (ind.detail) m.push(ind.detail);
    if (ind.tip) m.push('<b>⭐ 활용 팁</b><br>' + ind.tip);
    return { opt: ind.opt || '', desc: ind.desc || '', signals: ind.signals || [], detail: m.join('<br><br>'), edited: false };
  }
  return {
    opt: e.opt != null ? e.opt : (ind.opt || ''),
    desc: e.desc != null ? e.desc : (ind.desc || ''),
    signals: e.signals != null ? e.signals : (ind.signals || []),
    detail: e.detail != null ? e.detail : (ind.detail || ''),
    edited: true
  };
}

// 저장된 사용자 옵션값 로드/저장 (차트와 공유)
// 지표별 표시 옵션 (체크박스). 차트의 OPT() 가 같은 값을 읽는다
const IND_TOGGLES = {
  ICHIMOKU: [{ k:'chikou', n:'후행스팬 표시', d:true, tip:'종가를 26칸 뒤로 옮겨 그린 청록색 선' }],
};
function loadUserOpts() {
  try { return JSON.parse(localStorage.getItem('kgchart_opts') || '{}'); }
  catch(e) { return {}; }
}
function saveUserOpts(o) {
  try { localStorage.setItem('kgchart_opts', JSON.stringify(o)); } catch(e) {}
}
function getOpt(key, name, def) {
  const all = loadUserOpts();
  if (all[key] && all[key][name] != null) return !!all[key][name];
  return def;
}
function setOpt(key, name, val) {
  const all = loadUserOpts();
  if (!all[key]) all[key] = {};
  all[key][name] = !!val;
  saveUserOpts(all);
}
function resetOpt(key) {
  const all = loadUserOpts();
  delete all[key];
  saveUserOpts(all);
}

function loadUserParams() {
  try { return JSON.parse(localStorage.getItem('kgchart_params') || '{}'); }
  catch(e) { return {}; }
}
function saveUserParams(p) {
  try { localStorage.setItem('kgchart_params', JSON.stringify(p)); } catch(e) {}
}
function getParam(key, idx, def) {
  const all = loadUserParams();
  if (all[key] && all[key][idx] != null) return all[key][idx];
  return def;
}
function setParam(key, idx, val) {
  const all = loadUserParams();
  if (!all[key]) all[key] = [];
  all[key][idx] = val;
  saveUserParams(all);
}
function resetParam(key) {
  const all = loadUserParams();
  delete all[key];
  saveUserParams(all);
}

const INDICATORS = [
  // ── 기본조합 활용법 (맨 위) ──
  { key:'COMBO', name:'기본조합 활용법', alias:'조합 활용 국면 판단 매수 매도 시점 시장 성격', cat:'guide', opt:'일목 · DMI · ADXR · RSI · OBV · 외국인순매수',
    desc:'기본조합 6개 지표를 어떤 순서로 읽어 국면을 가르고 매매 시점을 정하는지 정리. 핵심은 ADXR 20선으로 추세장인지 횡보장인지 먼저 가르고, 그에 따라 쓰는 지표를 바꾸는 것.',
    signals:[
      ['n','① ADXR 20선으로 추세 유무를 먼저 가른다'],
      ['b','횡보장(20 아래) → RSI 30/70 으로 매매'],
      ['s','추세장(20 위) → RSI 과매수 무시, DMI 교차로 매매'],
      ['n','OBV·외국인이 주가와 어긋나면 신호를 낮춰 본다'],
    ],
    detail:'<b>■ 1. 상승·하락·횡보 판단</b><br>두 단계로 봅니다. <b>ADXR 20선으로 추세 유무</b>를 먼저 가르고, <b>방향은 일목과 DMI</b>로 봅니다.<br><br><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:4px 6px;border-bottom:1px solid #30363d;color:#8b949e">ADXR</th><th style="text-align:left;padding:4px 6px;border-bottom:1px solid #30363d;color:#8b949e">국면</th></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>20 아래</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">횡보 — 방향 판단이 무의미</td></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>20 위 + 상승 중</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">추세 진행</td></tr><tr><td style="padding:4px 6px"><b>20 위 + 하락 전환</b></td><td style="padding:4px 6px">추세 소멸 중</td></tr></table><br>추세가 있다고 나오면 방향을 봅니다. <b>+DI &gt; −DI</b> 이고 <b>주가가 구름 위</b>면 상승, 반대면 하락입니다. 둘이 엇갈리면 아직 전환 중이니 기다리는 편이 낫습니다.<br><br><b>■ 2. 매수·매도 시점</b><br>국면에 따라 <b>쓰는 지표가 완전히 달라집니다.</b> 이것이 핵심입니다.<br><br><b>· 횡보장 (ADXR 20 아래)</b><br>매수 — RSI 30 아래에서 돌아설 때<br>매도 — RSI 70 위에서 꺾일 때<br>구름 상·하단이 박스 경계 역할을 합니다.<br><br><b>· 추세장 (ADXR 20 위)</b><br><b>RSI 과매수를 무시합니다.</b> 70에 붙어 있어도 팔지 않습니다.<br>매수 — +DI가 −DI를 상향 돌파 + 주가가 구름 위<br>매도 — +DI/−DI 재역전, 또는 ADX가 고점에서 꺾일 때<br>눌림 매수는 전환선·기준선 부근에서.<br><br><b>· 공통 확인</b><br>OBV가 주가와 같은 방향인지, 외국인이 같은 편인지. 셋이 어긋나면 신호를 낮춰 봅니다.<br><br><b>■ 3. 변화를 미리 아는 법</b><br>정직하게 말하면 <b>어떤 지표도 예측하지 않습니다.</b> 다만 가격보다 먼저 움직이는 것들이 있습니다. 빠른 순서대로입니다.<br><br>1. <b>OBV 다이버전스</b> — 주가는 신고가인데 OBV가 전 고점 미달. 오르는 데 거래가 안 붙는다는 뜻으로 가장 먼저 나옵니다<br>2. <b>외국인 순매수 방향 전환</b> — 연속 매수가 끊기거나 매도로 돌아섬<br>3. <b>RSI 다이버전스</b><br>4. <b>ADX 고점 꺾임</b> — 추세 강도가 정점을 지남<br>5. <b>전환선이 기준선을 하향 돌파</b> — 여기면 이미 늦은 편<br>6. <b>구름 이탈</b> — 확인 신호이지 예측이 아님<br><br><b>1·2번이 동시에 나오면 경계 단계</b>로 봅니다. 다만 다이버전스는 몇 주씩 이어지다 무효가 되는 일도 흔합니다. <b>포지션을 줄이는 근거는 되어도 반대로 뒤집는 근거로는 약합니다.</b><br><br><b>■ 4. 현재 시장 성격 판단</b><br>네 가지를 순서대로 확인합니다.<br><br>· <b>ADXR 값</b> — 추세장인가 횡보장인가<br>· <b>ADX와 ADXR의 간격</b> — ADX가 위면 강해지는 중, 아래면 식는 중<br>· <b>구름 두께</b> — 두꺼우면 잘 안 뚫리고, 얇으면 쉽게 뚫림<br>· <b>수급 일치도</b> — OBV·외국인이 주가와 같은 방향인가<br><br><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:4px 6px;border-bottom:1px solid #30363d;color:#8b949e">성격</th><th style="text-align:left;padding:4px 6px;border-bottom:1px solid #30363d;color:#8b949e">신호</th></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>건강한 상승</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">ADXR 20↑, +DI 우위, OBV 동반 상승, 외국인 순매수</td></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>힘 빠진 상승</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">주가는 오르나 OBV·외국인 정체 → 다이버전스 경계</td></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>에너지 응축</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">ADXR 20↓ 오래 지속, 구름 얇아짐 → 곧 방향 결정</td></tr><tr><td style="padding:4px 6px"><b>하락 마무리</b></td><td style="padding:4px 6px">ADXR 높은 채로 꺾임, RSI 30↓ 다이버전스, 외국인 매도 감소</td></tr></table>',
    tip:'<b>■ 가장 흔한 실수</b><br>ADXR 확인 없이 RSI만 보는 것입니다. <b>추세장 초입에 RSI 70에서 팔면 상승분 전체를 놓칩니다.</b> ADXR을 먼저 보는 습관이 이 조합의 핵심입니다.<br><br><b>■ 지표별 역할 분담</b><br>· 일목균형표 — 추세 방향, 지지·저항<br>· DMI — +DI/−DI 교차로 방향<br>· ADXR — 20선으로 국면 구분 (추세장/횡보장)<br>· RSI — 70/30 절대 기준으로 시점<br>· OBV — 거래량 수급, 다이버전스<br>· 외국인 순매수 — 실제 수급 확인<br><br><b>■ 연습 방법</b><br>차트 왼쪽 아래 <b>‹ ›</b> 버튼으로 과거 구간을 하루씩 넘겨보세요. 화살표가 뜨기 <b>직전 봉</b>에서 방향을 예측하고 한 칸 넘겨 결과를 확인하는 식으로 연습하면, 설명을 읽는 것보다 훨씬 빨리 감이 잡힙니다.<br><br><b>■ 한계</b><br>이 조합은 <b>변동성 계열이 비어 있습니다.</b> 시점 판단에는 지장이 없지만, 손절폭을 종목 성격에 맞춰 정하려면 ATR 같은 지표가 필요합니다.',
    noParam:true },

      ['n','전환선이 기준선 상향돌파 → 매수 신호'],
    ], detail:'<b>구성:</b> 전환선(9일), 기준선(26일), 선행스팬A·B(구름대), 후행스팬(26일 전 표시).<br><b>해석:</b> 구름대(선행스팬 사이)가 두꺼울수록 지지·저항이 강합니다. 주가가 구름 위면 강세, 아래면 약세, 구름 안이면 방향성 없음(관망)입니다.', tip:'주가가 구름을 상향 돌파하는 순간이 강력한 매수 신호입니다. 구름대의 색이 바뀌는 지점(선행스팬A·B 교차)은 추세 전환 예고입니다.<br><br><b>■ 상승·하락 판단하는 법</b><br><br><b>1. 구름으로 큰 방향 (가장 중요)</b><br>· 주가가 구름 <b>위</b> → 상승 추세 (구름이 지지선)<br>· 주가가 구름 <b>아래</b> → 하락 추세 (구름이 저항선)<br>· 주가가 구름 <b>속</b> → 방향 없는 횡보<br>구름 색: 초록(선행A>선행B)=상승 우위, 빨강(선행A&lt;선행B)=하락 우위<br><br><b>2. 전환선·기준선으로 단기 방향</b><br>· 전환선이 기준선 위 → 단기 상승 / 아래 → 단기 하락<br>· 상향 돌파(골든크로스) → 매수 / 하향 돌파(데드크로스) → 매도<br>구름 위에서 나오는 골든크로스가 특히 신뢰도 높습니다.<br><br><b>3. 후행스팬으로 확인</b><br>· 후행스팬이 26일 전 캔들 위 → 강세 / 아래 → 약세<br><br><b>■ 종합 — 삼역호전 / 삼역역전</b><br>세 가지가 동시에 같은 방향일 때 가장 강합니다.<br><u>강한 상승(삼역호전·매수)</u>: ① 주가가 구름 위 돌파 ② 전환선이 기준선 위(골든크로스) ③ 후행스팬이 26일 전 캔들 위<br><u>강한 하락(삼역역전·매도)</u>: ① 주가가 구름 아래 이탈 ② 데드크로스 ③ 후행스팬이 26일 전 캔들 아래<br><br><b>■ 실전 판단 순서</b><br>1) 구름 위치 → 큰 방향 (구름 위/아래)<br>2) 전환·기준선 → 단기 방향과 타이밍<br>3) 후행스팬 → 강약 확인<br>4) 미래 구름 → 두꺼우면 추세 강함, 얇거나 꼬이면(선행A·B 교차) 전환 임박<br><br><b>강도 읽기:</b> 미래 구름이 두꺼울수록·주가가 구름에서 멀수록 추세가 강합니다.<br><br><b>핵심 한 줄:</b> 주가가 구름 위 + 골든크로스 + 후행스팬도 위 = 상승, 반대면 하락. 셋이 겹칠수록 강합니다.<br><br><b>■ 신호 확인법 — 교차 시점과 구름 이탈 시점이 다를 때</b><br>보통 <b>데드크로스(전환선&lt;기준선)가 먼저, 구름 이탈이 나중</b>에 옵니다.<br><br><b>1) 전환선·기준선 교차 = 빠른 경고 (분할 대응)</b><br>짧은 기간(9일 vs 26일) 비교라 빠릅니다. 추세 변화 초기에 먼저 뜹니다.<br>· "추세가 약해질 수 있다"는 1차 경고<br>· 전량 매도보다 일부 비중 축소·경계 태세<br>· 빠른 대신 속임수(가짜 신호)가 많음. 특히 <b>구름 안에서 나온 교차는 신뢰도 낮음</b><br><br><b>2) 구름 이탈 = 확실한 신호 (본격 대응)</b><br>26일 앞으로 밀린 두꺼운 구름을 뚫어야 하므로 느립니다. 확실해진 뒤에야 나옵니다.<br>· 주가가 구름을 완전히 뚫고 내려가면 → 추세 전환 확정 → 본격 매도·손절<br><br><b>■ 핵심 원칙 (구름 두께로 판단)</b><br>· <b>구름이 두꺼우면</b> → 강한 지지선이라 데드크로스가 나도 구름이 받쳐줘 반등하는 경우가 많음 → <b>구름 이탈까지 기다리는 게 안전</b><br>· <b>구름이 얇으면</b> → 지지가 약해 데드크로스가 곧 이탈로 이어질 가능성 큼 → <b>데드크로스에서 빠르게 대응</b><br><br><b>■ 추가 확인 도구</b><br>· 후행스팬도 26일 전 캔들 아래로 내려가면 → 하락 확정 신뢰도 상승<br>· ADXR이 20 위면 → 신호대로 움직일 가능성 높음<br>· 거래량이 늘면서 이탈하면 → 진짜 이탈<br><br>하나만 고르라면 <b>안정적 매매엔 구름 이탈이 기준</b>이고, 데드크로스는 그 전에 대비하는 조기 경보로 씁니다. 특히 <b>구름 두께를 보고 "기다릴지, 먼저 움직일지"를 정하는 게 실전 요령</b>입니다.'},

    detail:'<b>ERayBull = 당일 고가 − EMA(종가, 13)</b><br><b>ERayBear = 당일 저가 − EMA(종가, 13)</b><br><br>엘더는 <b>이동평균의 위치</b>에 주목했습니다. 이동평균은 태생적으로 주가를 뒤따를 수밖에 없으므로, 상승세라면 이동평균이 주가 아래쪽에 놓이고 하락세라면 위쪽에 놓입니다.<br><br><b>당일 고가</b>는 장중에 매입세가 최대로 힘을 낸 끝에 만들어진 결과입니다. 매입세가 강할수록 고가는 더 높은 수준에서 결정되므로, 고가와 이동평균의 차인 <b>Bull Power는 상승추세가 얼마나 강한지</b>를 나타냅니다.<br><br>반대로 <b>당일 저가</b>는 매도세가 최대로 힘을 낸 결과입니다. 매도세가 강할수록 저가는 더 낮아지므로, 저가와 이동평균의 차인 <b>Bear Power는 하락추세가 얼마나 강한지</b>를 나타냅니다.<br><br>상승추세는 언젠가 끝나고 주가는 정점을 만들며, 하락추세도 언젠가 끝나고 바닥을 만듭니다. 그래서 <b>Bull Power로 매도시기를, Bear Power로 매입시기를</b> 포착합니다.<br><br><b>■ 두 선은 왜 나란히 움직이나</b><br>Bull과 Bear가 매입세·매도세라면 서로 반대로 움직일 것 같지만, 구조상 그럴 수 없습니다. 두 식을 빼보면 이렇게 됩니다.<br><br><b>Bull − Bear = (고가 − EMA) − (저가 − EMA) = 고가 − 저가</b><br><br>EMA가 소거되어 <b>두 선의 간격은 항상 그날의 변동폭</b>이 됩니다. 그 폭만큼 벌어진 채로 함께 오르내립니다.<br><br>Bull과 Bear는 서로 겨루는 두 세력이 아니라, <b>같은 기준선(EMA)에서 위아래로 얼마나 뻗었는가</b>를 재는 한 쌍입니다. 신호는 두 선의 엇갈림이 아니라 <b>각 선이 0선을 넘느냐</b>와 <b>각자의 증감 방향</b>에서 나옵니다.<br><br><b>■ 읽는 표</b><br><table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:13px"><tr><th style="text-align:left;padding:4px 6px;border-bottom:1px solid #30363d;color:#8b949e">움직임</th><th style="text-align:left;padding:4px 6px;border-bottom:1px solid #30363d;color:#8b949e">의미</th></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>두 선이 나란히 위로</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">주가가 이평 위로 멀어짐 — 상승 추세</td></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>두 선이 나란히 아래로</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">주가가 이평 아래로 멀어짐 — 하락 추세</td></tr><tr><td style="padding:4px 6px;border-bottom:1px solid #21262d"><b>간격이 벌어짐</b></td><td style="padding:4px 6px;border-bottom:1px solid #21262d">변동폭 확대 — 변동성 커짐</td></tr><tr><td style="padding:4px 6px"><b>간격이 좁아짐</b></td><td style="padding:4px 6px">변동폭 축소 — 눌림·수렴</td></tr></table><br>정상적인 장에서는 Bull이 0 위, Bear가 0 아래에 놓여 0선을 사이에 두고 걸쳐 있습니다. <b>Bull이 (−)로 내려가면</b> 고가조차 평균에 못 미친다는 뜻이라 매입세가 완전히 죽은 상태이고, <b>Bear가 (+)로 올라가면</b> 저가마저 평균 위라 강한 상승 국면입니다. 두 선이 <b>함께 0선 위나 아래로 넘어가는 순간</b>이 그래서 의미가 큽니다.<br><br><b>■ 이 앱의 화면 구성</b><br>책은 강세·약세를 두 칸에 선으로 나눠 그리지만, 이 앱은 <b>한 칸에 0선을 기준으로 겹쳐</b> 그립니다.<br>· <b>빨강(좁은 막대)</b> = Bull Power, 매입세의 힘<br>· <b>파랑(넓은 막대)</b> = Bear Power, 매도세의 힘<br>· <b>▲ 빨강</b> = 매입 신호 (다이버전스까지 맞으면 더 크고 진하게)<br>· <b>▼ 파랑</b> = 매도 신호<br>0선을 사이에 두고 마주 보는 형태라 어느 쪽 힘이 우세한지 한눈에 보입니다.',
    tip:'엘더는 러시아 태생 정신과 전문의로, 주식투자에 심리학을 접목한 선구자입니다. 인체 내부를 탐색하는 엑스레이(X-Ray)에 착안해 지표 이름을 \'엘더레이\'라 붙였습니다.<br><br><b>■ 읽는 요령</b><br>상승장에서는 빨강이 길고 파랑이 짧습니다. 전환이 가까워지면 <b>빨강이 짧아지면서</b> ▼가 뜹니다. 하락장에서는 그 반대로 <b>파랑이 짧아지면서</b> ▲가 뜹니다.<br><br><b>■ 주의점</b><br>1. 약간의 시차가 있습니다. 지수이동평균의 방향 전환을 확인하고 판단하므로 신호가 조금 늦습니다. 다만 장점이 단점을 충분히 극복한다는 평가입니다.<br>2. 두 지표는 짝입니다. 약세지수 하나만으로는 제대로 쓸 수 없습니다.<br>3. 두 조건(이평 방향 전환 + Power의 증감)이 <b>동시에</b> 만족되어야 합니다. 하나만 맞으면 신호가 아닙니다.<br>4. 기간 13일은 기본값이며 지표 설정에서 바꿀 수 있습니다.'},

let curCat = 'all';
let curSearch = '';

function render() {
  const cards = document.getElementById('cards');
  const filtered = INDICATORS.filter(ind => {
    const q = curSearch.toLowerCase().replace(/[()\/]/g, ' ').trim();
    if (!q) return true;
    const hay = (ind.name + ' ' + ind.key + ' ' + (ind.alias||'')).toLowerCase();
    // 검색어를 토큰으로 나눠 하나라도 매칭되면 표시
    const tokens = q.split(/\s+/).filter(t => t.length > 0);
    const searchOk = tokens.some(t => hay.includes(t));
    return searchOk;
  });

  if (!filtered.length) {
    cards.innerHTML = '<div class="no-result">검색 결과가 없습니다</div>';
    return;
  }

  cards.innerHTML = filtered.map(ind => {
    const c = CAT[ind.cat].color;
    const catLabel = CAT[ind.cat].label;
    const M = mergedInd(ind);
    const sigRows = M.signals.map(s => {
      const [type, text] = s;
      const cls = type === 'b' ? 'b' : type === 's' ? 's' : 'n';
      const tag = type === 'b' ? '매수' : type === 's' ? '매도' : '참고';
      return `<div class="signal-row"><span class="tag ${cls}">${tag}</span><span class="desc">${text}</span></div>`;
    }).join('') || '<div class="section-content" style="color:#6e7681">등록된 매매 타이밍이 없습니다</div>';
    // 편집용 텍스트: 매매타이밍은 "b|텍스트" 한 줄씩
    const sigText = M.signals.map(s => `${s[0]}|${s[1]}`).join('\n');

    return `
      <div class="card" style="--c:${c}" data-ikey="${ind.key}">
        <div class="card-head" onclick="toggleCard(this)">
          <span class="name" style="color:${c}">${ind.name}</span>
          <span class="cat-tag">${catLabel}</span>
          ${M.edited ? '<span class="cat-tag" style="background:#1a2f1a;color:#3fb950">수정됨</span>' : ''}
          <span class="arrow">▶</span>
        </div>
        <div class="card-body">

          <!-- 보기 모드 -->
          <div class="view-mode">
            <div class="section">
              <div class="section-title"><span class="ico">⚙️</span>옵션값 설정</div>
              ${renderParamInputs(ind.key, M.opt)}
            </div>
            <div class="section">
              <div class="section-title"><span class="ico">📖</span>설명</div>
              <div class="section-content">${nl2br(M.desc)}</div>
            </div>
            <div class="section">
              <div class="section-title"><span class="ico">💡</span>매매 타이밍</div>
              ${sigRows}
            </div>
            ${M.detail ? `
            <div class="section">
              <div class="section-title"><span class="ico">🔍</span>상세 설명</div>
              <div class="section-content detail-box">${nl2br(M.detail)}</div>
            </div>` : ''}
            <div class="edit-bar">
              <button class="ebtn edit" data-act="edit">✏️ 설명 수정</button>
              ${M.edited ? `<button class="ebtn reset" data-act="reset">↩ 원본 복원</button>` : ''}
            </div>
          </div>

          <!-- 편집 모드 -->
          <div class="edit-mode" style="display:none">
            <div class="section">
              <div class="section-title"><span class="ico">⚙️</span>1. 옵션</div>
              <input type="text" class="ed-input" data-f="opt" value="${escAttr(M.opt)}" placeholder="예: 기간 14일">
            </div>
            <div class="section">
              <div class="section-title"><span class="ico">📖</span>2. 설명 (구성 기본자료·계산법)</div>
              <textarea class="ed-area" data-f="desc" rows="4" placeholder="지표의 구성과 계산 방법">${escHtmlT(htmlToEdit(M.desc))}</textarea>
            </div>
            <div class="section">
              <div class="section-title"><span class="ico">💡</span>3. 매매 타이밍</div>
              <div class="ed-hint">한 줄에 하나씩 · 맨 앞에 <b>b</b>(매수) / <b>s</b>(매도) / <b>n</b>(참고) 와 <b>|</b> 기호<br>예) b|골든크로스 발생 시 매수</div>
              <textarea class="ed-area" data-f="signals" rows="4" placeholder="b|매수 조건&#10;s|매도 조건&#10;n|참고 사항">${escHtmlT(sigText)}</textarea>
            </div>
            <div class="section">
              <div class="section-title"><span class="ico">🔍</span>4. 상세 설명</div>
              <div class="ed-hint">줄바꿈은 그냥 Enter · <b>*굵게*</b>는 별표로 감싸기 (예: *중요*) · <b>_밑줄_</b>은 밑줄표로 감싸기</div>
              <textarea class="ed-area" data-f="detail" rows="8" placeholder="자세한 해설·활용 팁">${escHtmlT(htmlToEdit(M.detail))}</textarea>
            </div>
            <div class="edit-bar">
              <button class="ebtn save" data-act="save">💾 저장</button>
              <button class="ebtn cancel" data-act="cancel">취소</button>
            </div>
          </div>

        </div>
      </div>`;
  }).join('');
  bindParamInputs();
  bindDescEdit();
}

// 텍스트를 속성/텍스트영역에 안전하게 넣기
// 입력한 줄바꿈을 화면에 그대로 반영 (HTML 태그는 유지)
function nl2br(s) { return String(s == null ? '' : s).replace(/\r\n|\r|\n/g, '<br>'); }

// 편집창 표시용: HTML 태그를 편하게 편집할 수 있는 형태로 변환
//   <br> → 줄바꿈,  <b>...</b> → *...*,  <u>...</u> → _..._
function htmlToEdit(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?b>/gi, '*')
    .replace(/<\/?strong>/gi, '*')
    .replace(/<\/?u>/gi, '_')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
}
// 저장용: 편집 텍스트를 다시 HTML로 변환
//   줄바꿈 → <br>,  *...* → <b>...</b>,  _..._ → <u>...</u>
function editToHtml(s) {
  let t = String(s == null ? '' : s);
  // 짝이 맞는 *...* 를 <b>...</b> 로 (줄바꿈 걸치지 않게)
  t = t.replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
  t = t.replace(/_([^_\n]+)_/g, '<u>$1</u>');
  t = t.replace(/\r\n|\r|\n/g, '<br>');
  return t;
}
function escAttr(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escHtmlT(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 편집 버튼 이벤트
function bindDescEdit() {
  document.querySelectorAll('.card[data-ikey]').forEach(card => {
    const key = card.dataset.ikey;
    const viewEl = card.querySelector('.view-mode');
    const editEl = card.querySelector('.edit-mode');
    card.querySelectorAll('.ebtn').forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'edit') { viewEl.style.display = 'none'; editEl.style.display = 'block'; return; }
        if (act === 'cancel') { editEl.style.display = 'none'; viewEl.style.display = 'block'; return; }
        if (act === 'reset') {
          if (!confirm('이 지표의 설명을 원래대로 되돌릴까요?')) return;
          clearDescEdit(key); render();
          return;
        }
        if (act === 'save') {
          const val = (f) => {
            const el = editEl.querySelector(`[data-f="${f}"]`);
            return el ? el.value : '';
          };
          // 매매타이밍 파싱: "b|텍스트" 한 줄씩
          const signals = val('signals').split('\n').map(line => {
            const t = line.trim();
            if (!t) return null;
            const i = t.indexOf('|');
            if (i < 0) return ['n', t];
            const type = t.slice(0, i).trim().toLowerCase();
            const text = t.slice(i + 1).trim();
            if (!text) return null;
            return [(type === 'b' || type === 's') ? type : 'n', text];
          }).filter(Boolean);
          const ok = saveDescEdit(key, {
            opt: val('opt').trim(),
            desc: editToHtml(val('desc').trim()),
            signals,
            detail: editToHtml(val('detail').trim())
          });
          if (ok) { render(); toastMsg('저장되었습니다'); }
          else alert('저장에 실패했습니다. 저장 공간을 확인해 주세요.');
        }
      };
    });
  });
}

function toastMsg(m) {
  let t = document.getElementById('gtoast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'gtoast';
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f6feb;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.4)';
    document.body.appendChild(t);
  }
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.style.display = 'none'; }, 1600);
}

function renderToggles(key) {
  const tg = IND_TOGGLES[key];
  if (!tg || !tg.length) return '';
  let h = '<div class="toggle-grid" style="display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 4px">';
  tg.forEach(t => {
    const on = getOpt(key, t.k, t.d);
    h += `<label class="toggle-item" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#e6edf3;cursor:pointer">
        <input type="checkbox" class="opt-input" data-key="${key}" data-opt="${t.k}"${on ? ' checked' : ''}>
        <span>${t.n}</span>
        ${t.tip ? `<span style="font-size:11px;color:#8b949e">${t.tip}</span>` : ''}
      </label>`;
  });
  h += '</div>';
  return h;
}

function renderParamInputs(key, optText) {
  const params = IND_PARAMS[key];
  const toggles = renderToggles(key);
  if (!params || !params.length) {
    return `<div class="opt-box">${optText}</div>` + toggles;
  }
  let html = '<div class="param-grid">';
  params.forEach((p, i) => {
    const cur = getParam(key, i, p.d);
    html += `
      <div class="param-item">
        <label>${p.n}</label>
        <input type="number" class="param-input" data-key="${key}" data-idx="${i}" value="${cur}" min="1" max="999">
        <span class="param-def">기본 ${p.d}</span>
      </div>`;
  });
  html += '</div>';
  html += toggles;
  html += `<button class="param-reset" onclick="resetParams('${key}')">↺ 기본값으로</button>`;
  return html;
}

function resetParams(key) {
  resetParam(key);
  resetOpt(key);
  render();
}

function toggleCard(head) {
  head.parentElement.classList.toggle('open');
}

// 파라미터 입력 이벤트 바인딩
function bindParamInputs() {
  document.querySelectorAll('.opt-input').forEach(cb => {
    cb.addEventListener('change', () => {
      setOpt(cb.dataset.key, cb.dataset.opt, cb.checked);
      toastMsg(cb.checked ? '후행스팬을 표시합니다' : '후행스팬을 숨깁니다');
    });
    cb.addEventListener('click', e => e.stopPropagation());
  });
  document.querySelectorAll('.toggle-item').forEach(l => l.addEventListener('click', e => e.stopPropagation()));
  document.querySelectorAll('.param-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.key;
      const idx = parseInt(inp.dataset.idx);
      const val = parseInt(inp.value);
      if (val > 0) {
        setParam(key, idx, val);
        // 저장 확인 표시
        inp.style.borderColor = '#3fb950';
        setTimeout(() => { inp.style.borderColor = '#30363d'; }, 800);
      }
    });
    // 클릭 시 카드 안 닫히게
    inp.addEventListener('click', e => e.stopPropagation());
  });
  document.querySelectorAll('.param-reset').forEach(btn => {
    btn.addEventListener('click', e => e.stopPropagation());
  });
}

// 검색
document.getElementById('search-input').addEventListener('input', (e) => {
  curSearch = e.target.value.trim();
  render();
});

// URL 파라미터로 검색어 자동 입력 (차트에서 명칭 클릭 시)
const urlParams = new URLSearchParams(location.search);
const autoQ = urlParams.get('q');
if (autoQ) {
  // 괄호 앞 부분만 추출하고 슬래시 정리 (예: "ADX/DMI(14)" → "ADX DMI")
  const cleanQ = autoQ.replace(/\(.*/, '').replace(/\//g, ' ').trim();
  document.getElementById('search-input').value = cleanQ;
  curSearch = cleanQ;
  // 해당 카드 자동 펼침
  setTimeout(() => {
    const firstCard = document.querySelector('.card');
    if (firstCard) firstCard.classList.add('open');
  }, 100);
}

// "차트로" 링크: 차트에서 넘어온 종목(code/name)이 있으면 유지해서 되돌아감
(function fixBackLink(){
  const backLink = document.querySelector('#header .back');
  if (!backLink) return;
  const code = urlParams.get('code');
  const name = urlParams.get('name');
  if (code) {
    const qp = new URLSearchParams();
    qp.set('code', code);
    if (name) qp.set('name', name);
    backLink.href = 'kg-chart.html?' + qp.toString();
  }
})();

render();
</script>
