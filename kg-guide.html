<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG 보조차트 설명</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117; color: #e6edf3;
  font-family: 'Noto Sans KR', sans-serif;
  line-height: 1.6; padding-bottom: 40px;
}
#header {
  position: sticky; top: 0; z-index: 100;
  background: #161b22; border-bottom: 1px solid #21262d;
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
}
#header .title { color: #58a6ff; font-weight: 700; font-size: 16px; }
#header .back { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; }
#header .back:hover { background: #30363d; }

/* 검색 */
#search-box {
  padding: 12px 16px; background: #0d1117;
  position: sticky; top: 53px; z-index: 99;
  border-bottom: 1px solid #21262d;
}
#search-input {
  width: 100%; background: #161b22; border: 1px solid #30363d;
  color: #e6edf3; padding: 10px 14px; border-radius: 8px; font-size: 14px;
}
#search-input::placeholder { color: #6e7681; }

/* 카테고리 필터 */
#cat-filter { display: flex; gap: 6px; padding: 10px 16px; flex-wrap: wrap; overflow-x: auto; }
.cat-btn {
  background: #161b22; border: 1px solid #30363d; color: #8b949e;
  padding: 5px 12px; border-radius: 16px; cursor: pointer; font-size: 12px; white-space: nowrap;
}
.cat-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

/* 카드 */
#cards { padding: 8px 16px; display: flex; flex-direction: column; gap: 12px; }
.card {
  background: #161b22; border: 1px solid #21262d; border-radius: 12px;
  overflow: hidden;
}
.card-head {
  padding: 12px 16px; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  border-left: 4px solid var(--c, #58a6ff);
}
.card-head:hover { background: #1c2128; }
.card-head .name { font-weight: 700; font-size: 15px; flex: 1; }
.card-head .cat-tag { font-size: 10px; color: #8b949e; background: #21262d; padding: 2px 8px; border-radius: 10px; }
.card-head .arrow { color: #8b949e; font-size: 12px; transition: transform 0.2s; }
.card.open .arrow { transform: rotate(90deg); }

.card-body { display: none; padding: 0 16px 16px; }
.card.open .card-body { display: block; }

.section { margin-top: 14px; }
.section-title {
  font-size: 12px; font-weight: 700; color: var(--c, #58a6ff);
  margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
}
.section-title .ico { font-size: 14px; }
.section-content { font-size: 13.5px; color: #c9d1d9; }

.param-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 8px; }
.param-item { display: flex; flex-direction: column; gap: 2px; background: #0d1117; padding: 8px 10px; border-radius: 6px; }
.param-item label { font-size: 11px; color: #8b949e; }
.param-input { background: #161b22; border: 1px solid #30363d; color: #e6edf3; padding: 5px 8px; border-radius: 4px; font-size: 13px; width: 100%; }
.param-input:focus { border-color: #58a6ff; outline: none; }
.param-def { font-size: 9px; color: #6e7681; }
.param-reset { background: #21262d; border: 1px solid #30363d; color: #f0a836; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.param-reset:hover { background: #30363d; }
.opt-box {
  background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
  padding: 10px 12px; font-family: monospace; font-size: 12.5px; color: #a8ff78;
}
.buy { color: #ef5350; font-weight: 700; }
.sell { color: #58a6ff; font-weight: 700; }
.signal-row {
  display: flex; gap: 8px; margin: 5px 0; padding: 8px 10px;
  background: #0d1117; border-radius: 6px; align-items: flex-start;
}
.signal-row .tag { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.signal-row .tag.b { background: #ef535033; color: #ef5350; }
.signal-row .tag.s { background: #1976d233; color: #58a6ff; }
.signal-row .tag.n { background: #37415133; color: #8b949e; }
.signal-row .desc { font-size: 12.5px; color: #c9d1d9; }

.detail-box { background: #0d1117; padding: 10px 12px; border-radius: 8px; line-height: 1.6; }
.detail-box b { color: #58a6ff; }
.tip-box { background: #1a2f1a; border-left: 3px solid #3fb950; padding: 10px 12px; border-radius: 6px; line-height: 1.6; }
.no-result { text-align: center; color: #6e7681; padding: 40px; }
</style>
</head>
<body>

<div id="header">
  <a class="back" href="kg-chart.html">‹ 차트로</a>
  <span class="title">📊 보조차트 설명</span>
</div>

<div id="search-box">
  <input id="search-input" placeholder="🔍 지표 이름 검색 (예: RSI, 이격도, 볼린저)" autocomplete="off">
</div>

<div id="cards"></div>

<script>
// ══════════════════════════════════════
// 지표 설명 데이터
// ══════════════════════════════════════
const CAT = {
  overlay: { label: '오버레이', color: '#f0a836' },
  trend: { label: '추세', color: '#58a6ff' },
  momentum: { label: '모멘텀', color: '#bc8cff' },
  volatility: { label: '변동성', color: '#f78166' },
  volume: { label: '거래량', color: '#3fb950' },
};


// 편집 가능한 파라미터 (key: [{name, default}])
const IND_PARAMS = {
  MA:[{n:'단기',d:5},{n:'중기',d:20},{n:'장기1',d:60},{n:'장기2',d:120}],
  BB:[{n:'기간',d:20},{n:'표준편차',d:2}],
  ICHIMOKU:[{n:'전환',d:9},{n:'기준',d:26},{n:'선행',d:52}],
  DEMA:[{n:'기간',d:20},{n:'시그널',d:9}],
  VPROFILE:[{n:'구간수',d:24}],
  MACD:[{n:'단기',d:12},{n:'장기',d:26},{n:'시그널',d:9}],
  ADX:[{n:'기간',d:14}],
  ADXR:[{n:'기간',d:14}],
  FORCE:[{n:'기간',d:13}],
  RSI:[{n:'기간',d:14}],
  SMI:[{n:'기간',d:13},{n:'평활',d:25},{n:'시그널',d:2}],
  STOCHRSI:[{n:'기간',d:14}],
  STOCH:[{n:'기간',d:14},{n:'평활',d:3}],
  SLOWSTOCH:[{n:'기간',d:14},{n:'평활',d:3}],
  CMO:[{n:'기간',d:14}],
  DMI_DYN:[{n:'기간',d:10}],
  MASS:[{n:'기간',d:25}],
  DISPARITY:[{n:'기간',d:20}],
  CHAIKIN_OSC:[{n:'단기',d:3},{n:'장기',d:10}],
  MOM:[{n:'기간',d:12}],
  WILLR:[{n:'기간',d:14}],
  ATR:[{n:'기간',d:14}],
  RVI:[{n:'기간',d:14}],
  INERTIA:[{n:'기간',d:20}],
  CHAIKIN_VOL:[{n:'기간',d:10}],
  CMF:[{n:'기간',d:20}],
  MFI:[{n:'기간',d:14}],
};

// 저장된 사용자 옵션값 로드/저장 (차트와 공유)
function loadUserParams() {
  try { return JSON.parse(localStorage.getItem('kgchart_params') || '{}'); }
  catch(e) { return {}; }
}
function saveUserParams(p) {
  try { localStorage.setItem('kgchart_params', JSON.stringify(p)); } catch(e) {}
}
function getParam(key, idx, def) {
  const all = loadUserParams();
  if (all[key] && all[key][idx] != null) return all[key][idx];
  return def;
}
function setParam(key, idx, val) {
  const all = loadUserParams();
  if (!all[key]) all[key] = [];
  all[key][idx] = val;
  saveUserParams(all);
}
function resetParam(key) {
  const all = loadUserParams();
  delete all[key];
  saveUserParams(all);
}

const INDICATORS = [
  // ── 오버레이 ──
  { key:'MA', name:'이동평균선 (MA)', cat:'overlay', opt:'MA5 / MA20 / MA60 / MA120 (일)',
    desc:'일정 기간 종가의 평균을 선으로 연결. 추세의 방향과 지지·저항을 파악하는 가장 기본 지표.',
    signals:[
      ['b','골든크로스: 단기선(MA5)이 장기선(MA20)을 아래→위 돌파'],
      ['s','데드크로스: 단기선이 장기선을 위→아래 돌파'],
      ['n','주가가 이평선 위=상승추세, 아래=하락추세'],
    ], detail:'<b>계산법:</b> 최근 N일 종가를 모두 더해 N으로 나눔.<br><b>해석:</b> 단기선(5·20일)은 최근 흐름, 장기선(60·120일)은 큰 추세를 나타냅니다. 여러 선이 위에서부터 단기>중기>장기 순으로 배열되면(정배열) 강한 상승, 반대면(역배열) 강한 하락입니다.', tip:'정배열 상태에서 주가가 20일선까지 눌릴 때가 매수 자리입니다. 이동평균선이 우상향하며 간격이 벌어지면 추세가 강한 것이고, 좁아지면 추세가 약해지는 신호입니다.'},
  { key:'BB', name:'볼린저밴드', cat:'overlay', opt:'기간 20일, 표준편차 2σ',
    desc:'현재의 주가와 이동평균의 간격으로 시장 상태 판단. 통계학의 정규분포처럼 밴드를 넘어설 확률이 2.25%에 불과하다는 점 이용.',
    signals:[
      ['b','주가가 하단밴드 터치 후 반등 → 매수'],
      ['s','주가가 상단밴드 터치 후 하락 → 매도'],
      ['n','밴드 폭 좁아짐(스퀴즈) → 큰 변동 임박 신호'],
    ], detail:'<b>핵심 원리:</b><br>1. 밴드의 위·아래 선이 <b>저항선과 지지선</b>이 된다. 주가가 상단밴드에 닿으면 저항을 받아 하락할 가능성이 높고, 하단밴드에 닿으면 지지를 받아 반등할 가능성이 높다.<br>2. 밴드의 폭이 좁혀들 때, 즉 <b>변동성이 줄어드는 시점이 추세 전환 타이밍</b>이 된다. 스퀴즈(밴드 수축) 이후 방향이 정해지면 큰 움직임이 나온다.<br><br><b>계산법:</b> 20일 이동평균(중심선) ± (표준편차 × 2). 정규분포 기준 주가의 95.45%가 밴드 안에 위치.', tip:'밴드가 극도로 좁아진 뒤 상단/하단을 강하게 돌파하는 방향으로 매매하면 큰 수익을 노릴 수 있습니다. 상단밴드를 타고 오르는 강세장에서는 섣부른 매도를 자제하세요.'},
  { key:'ICHIMOKU', name:'일목균형표', cat:'overlay', opt:'전환9 / 기준26 / 선행52',
    desc:'전환선·기준선·선행스팬·후행스팬·구름대로 구성. 지지저항·추세·매매시점을 종합 판단.',
    signals:[
      ['b','주가가 구름대 위로 돌파 → 강세 전환'],
      ['s','주가가 구름대 아래로 이탈 → 약세 전환'],
      ['n','전환선이 기준선 상향돌파 → 매수 신호'],
    ], detail:'<b>구성:</b> 전환선(9일), 기준선(26일), 선행스팬A·B(구름대), 후행스팬(26일 전 표시).<br><b>해석:</b> 구름대(선행스팬 사이)가 두꺼울수록 지지·저항이 강합니다. 주가가 구름 위면 강세, 아래면 약세, 구름 안이면 방향성 없음(관망)입니다.', tip:'주가가 구름을 상향 돌파하는 순간이 강력한 매수 신호입니다. 구름대의 색이 바뀌는 지점(선행스팬A·B 교차)은 추세 전환 예고입니다.'},
  { key:'DEMA', name:'이중지수이동평균 (DEMA)', cat:'overlay', opt:'기간 20일 + 시그널 9일',
    desc:'가중이동평균 방식으로 최근 종가일수록 더 높은 가중치를 부여해 계산. 일반 이평보다 골든크로스·데드크로스를 앞당겨 신호가 빠름. 5일 DEMA와 20일 DEMA 등 두 선의 크로스 발생 시점이 매매 시점.',
    signals:[
      ['b','단기 DEMA가 장기 DEMA를 상향돌파(골든크로스) → 매수'],
      ['s','단기 DEMA가 장기 DEMA를 하향돌파(데드크로스) → 매도'],
    ]},

  { key:'VPROFILE', name:'매물대 (거래량 프로파일)', cat:'overlay', opt:'가격구간 24단계',
    desc:'가격대별 거래량을 수평막대로 표시. 매물이 많이 쌓인 가격대(지지·저항) 파악.',
    signals:[
      ['n','POC(최대매물대) = 가장 강한 지지·저항선'],
      ['b','매물대 두꺼운 구간 하단에서 지지 → 매수'],
      ['s','매물대 두꺼운 구간 상단에서 저항 → 매도'],
    ]},

  // ── 추세 ──
  { key:'MACD', name:'MACD', cat:'trend', opt:'단기12 / 장기26 / 시그널9',
    desc:'지수이동평균(EMA) 두 선이 수렴·확산하는 현상으로 모멘텀을 파악. 바닥·꼭지는 두 이동평균 간격이 가장 멀어질 때. 플러스(+) 구간은 단기EMA > 장기EMA(정배열), 마이너스(−) 구간은 역배열.',
    signals:[
      ['b','MACD선이 시그널선을 상향돌파 → 매수'],
      ['s','MACD선이 시그널선을 하향돌파 → 매도'],
      ['n','히스토그램 0선 상향돌파 → 상승 모멘텀'],
    ], detail:'<b>계산법:</b> 12일 EMA − 26일 EMA = MACD선, 이것의 9일 EMA = 시그널선.<br><b>해석:</b> 단순이동평균이 아닌 지수이동평균을 사용해 최근 가격에 더 민감하게 반응합니다. 두 EMA의 간격이 가장 벌어지는 시점이 추세의 바닥 또는 꼭지이며, 이후 수렴하면 추세 전환 신호입니다.', tip:'MACD가 0선 아래 깊은 곳에서 골든크로스가 나면 바닥 반등 신호로 신뢰도가 높습니다. 주가는 신고가인데 MACD는 낮아지는 다이버전스는 강력한 하락 경고입니다.'},
  { key:'ADX', name:'방향성지수 (DMI)', alias:'ADX DMI 방향성', cat:'trend', opt:'기간 14일',
    desc:'주가의 방향성을 측정하는 지표. 종가·고점 등을 이용해 상승강도(+DI)와 하락강도(-DI)를 각각 계산해 비교. +DI(빨강)는 상승추세 강도, -DI(파랑)는 하락추세 강도이며 두 선의 교차로 매매.',
    signals:[
      ['b','+DI(빨강)가 -DI(파랑)를 상향돌파 → 매수'],
      ['s','+DI(빨강)가 -DI(파랑)를 하향돌파 → 매도'],
      ['n','두 선 간격이 벌어질수록 추세 강함'],
    ],
    detail:'<b>+DI = 상승추세의 강도</b>, <b>-DI = 하락추세의 강도</b>를 나타냅니다.<br><br>종가·고점·저점 데이터로 상승 움직임과 하락 움직임을 각각 산출해 비교합니다. <b>+DI가 상승</b>하면 시장의 상승 압력이 커지는 것, <b>-DI가 상승</b>하면 하락 압력이 커지는 것을 의미합니다.<br><br>두 선의 간격이 넓을수록 그 방향의 추세가 강하고, 간격이 좁아지면 추세가 약해지는 신호입니다.',
    tip:'+DI(빨강)와 -DI(파랑)의 교차점이 핵심 매매 시점입니다. 빨강이 파랑 위로 올라가면 상승세가 하락세를 압도한 것으로 매수, 반대면 매도로 봅니다. 두 선의 간격이 넓게 벌어질수록 그 방향의 추세가 강력합니다.'},

  { key:'ADXR', name:'평균방향성지표 순위 (ADXR)', alias:'ADXR 평균방향성지표순위 방향성', cat:'trend', opt:'기간 14일',
    desc:'추세장과 횡보장을 판단하는 차트. 지수가 20을 넘어서면 강력한 추세시장으로 판단하고, 20 이하면 횡보장으로 판단한다. ADX를 한 번 더 평균한 값이라 변동이 완만해 안정적이다.',
    signals:[
      ['n','ADXR 20 초과 → 추세장 (방향성 있는 시장)'],
      ['n','ADXR 20 이하 → 횡보장 (방향성 없는 시장)'],

    ], detail:'<b>계산법:</b> 상승한 날은 거래량을 더하고, 하락한 날은 빼서 누적.<br><b>해석:</b> 가격보다 거래량(자금 흐름)이 먼저 움직인다는 원리로, 주가는 거래량을 후행합니다. OBV가 오르면 매집(돈이 들어옴), 내리면 분산(돈이 빠짐)입니다. 특히 OBV가 이전 고점을 돌파하며 상승을 이어가면, 아직 주가가 전고점에 못 미치더라도 뒤따라 돌파할 가능성이 커집니다.', tip:'주가는 횡보하는데 OBV가 계속 오르면 세력이 조용히 매집 중일 수 있어 상승 전조입니다. 반대로 주가 신고가인데 OBV가 못 따라오면 상승 동력이 약해진 것으로, 이런 가격-OBV 다이버전스가 발생하는 지점이 실전 매매 타이밍입니다.'},
  { key:'CMF', name:'차이킨 자금흐름 (CMF)', cat:'volume', opt:'기간 20일, 기준 0',
    desc:'거래량 가중으로 자금 유입/유출 측정. 매집·분산 판단.',
    signals:[
      ['b','0 위 → 자금 유입(매수세)'],
      ['s','0 아래 → 자금 유출(매도세)'],
    ]},
  { key:'MFI', name:'MFI (자금흐름지수)', cat:'volume', opt:'기간 14일, 기준 80/20',
    desc:'거래량을 반영한 개선된 RSI로 신뢰도 높음. 주가와 다이버전스 발견이 중요. 주가는 하락하는데 MFI가 상승한다면 곧 매수세 증가로 상승세 전환을 예견할 수 있음.',
    signals:[
      ['b','20 아래(과매도)에서 반등 → 매수'],
      ['s','80 위(과매수)에서 하락 → 매도'],
    ], detail:'<b>계산법:</b> 거래량을 반영한 RSI. 대표가격(고저종 평균) × 거래량으로 자금 유입·유출 비율 계산.<br><b>해석:</b> RSI가 가격만 본다면, MFI는 \'돈의 양\'까지 봅니다. 80 이상 과매수, 20 이하 과매도입니다.', tip:'MFI는 거래량이 실려 있어 RSI보다 속임수가 적습니다. MFI 다이버전스(주가 신고가 + MFI 하락, 또는 주가 하락 + MFI 상승)는 자금 흐름이 가격보다 먼저 바뀌는 신호로 특히 신뢰도가 높습니다.'},
  { key:'PVT', name:'PVT (거래량추세지수)', cat:'volume', opt:'-',
    desc:'가격변화율 × 거래량 누적. OBV보다 정교한 자금흐름 추적.',
    signals:[
      ['b','PVT 상승 → 매수세 우위'],
      ['s','PVT 하락 → 매도세 우위'],
      ['n','가격과 다이버전스 확인'],
    ]},
  { key:'WILLIAMS_AD', name:'윌리엄스 누적확산 (A/D)', cat:'volume', opt:'-',
    desc:'진정 고저 기반 누적확산. 매집·분산의 강도를 측정.',
    signals:[
      ['b','A/D 상승 → 매집(축적)'],
      ['s','A/D 하락 → 분산(배포)'],
    ]},
];

// ══════════════════════════════════════
// 렌더링
// ══════════════════════════════════════
let curCat = 'all';
let curSearch = '';

function render() {
  const cards = document.getElementById('cards');
  const filtered = INDICATORS.filter(ind => {
    const q = curSearch.toLowerCase().replace(/[()\/]/g, ' ').trim();
    if (!q) return true;
    const hay = (ind.name + ' ' + ind.key + ' ' + (ind.alias||'')).toLowerCase();
    // 검색어를 토큰으로 나눠 하나라도 매칭되면 표시
    const tokens = q.split(/\s+/).filter(t => t.length > 0);
    const searchOk = tokens.some(t => hay.includes(t));
    return searchOk;
  });

  if (!filtered.length) {
    cards.innerHTML = '<div class="no-result">검색 결과가 없습니다</div>';
    return;
  }

  cards.innerHTML = filtered.map(ind => {
    const c = CAT[ind.cat].color;
    const catLabel = CAT[ind.cat].label;
    const sigRows = ind.signals.map(s => {
      const [type, text] = s;
      const cls = type === 'b' ? 'b' : type === 's' ? 's' : 'n';
      const tag = type === 'b' ? '매수' : type === 's' ? '매도' : '참고';
      return `<div class="signal-row"><span class="tag ${cls}">${tag}</span><span class="desc">${text}</span></div>`;
    }).join('');

    return `
      <div class="card" style="--c:${c}">
        <div class="card-head" onclick="toggleCard(this)">
          <span class="name" style="color:${c}">${ind.name}</span>
          <span class="cat-tag">${catLabel}</span>
          <span class="arrow">▶</span>
        </div>
        <div class="card-body">
          <div class="section">
            <div class="section-title"><span class="ico">⚙️</span>옵션값 설정</div>
            ${renderParamInputs(ind.key, ind.opt)}
          </div>
          <div class="section">
            <div class="section-title"><span class="ico">📖</span>설명</div>
            <div class="section-content">${ind.desc}</div>
          </div>
          <div class="section">
            <div class="section-title"><span class="ico">💡</span>매매 타이밍</div>
            ${sigRows}
          </div>
          ${ind.detail ? `
          <div class="section">
            <div class="section-title"><span class="ico">🔍</span>상세 설명</div>
            <div class="section-content detail-box">${ind.detail}</div>
          </div>` : ''}
          ${ind.tip ? `
          <div class="section">
            <div class="section-title"><span class="ico">⭐</span>활용 팁</div>
            <div class="section-content tip-box">${ind.tip}</div>
          </div>` : ''}
        </div>
      </div>`;
  }).join('');
  bindParamInputs();
}

function renderParamInputs(key, optText) {
  const params = IND_PARAMS[key];
  if (!params || !params.length) {
    return `<div class="opt-box">${optText}</div>`;
  }
  let html = '<div class="param-grid">';
  params.forEach((p, i) => {
    const cur = getParam(key, i, p.d);
    html += `
      <div class="param-item">
        <label>${p.n}</label>
        <input type="number" class="param-input" data-key="${key}" data-idx="${i}" value="${cur}" min="1" max="999">
        <span class="param-def">기본 ${p.d}</span>
      </div>`;
  });
  html += '</div>';
  html += `<button class="param-reset" onclick="resetParams('${key}')">↺ 기본값으로</button>`;
  return html;
}

function resetParams(key) {
  resetParam(key);
  render();
}

function toggleCard(head) {
  head.parentElement.classList.toggle('open');
}

// 파라미터 입력 이벤트 바인딩
function bindParamInputs() {
  document.querySelectorAll('.param-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const key = inp.dataset.key;
      const idx = parseInt(inp.dataset.idx);
      const val = parseInt(inp.value);
      if (val > 0) {
        setParam(key, idx, val);
        // 저장 확인 표시
        inp.style.borderColor = '#3fb950';
        setTimeout(() => { inp.style.borderColor = '#30363d'; }, 800);
      }
    });
    // 클릭 시 카드 안 닫히게
    inp.addEventListener('click', e => e.stopPropagation());
  });
  document.querySelectorAll('.param-reset').forEach(btn => {
    btn.addEventListener('click', e => e.stopPropagation());
  });
}

// 검색
document.getElementById('search-input').addEventListener('input', (e) => {
  curSearch = e.target.value.trim();
  render();
});

// URL 파라미터로 검색어 자동 입력 (차트에서 명칭 클릭 시)
const urlParams = new URLSearchParams(location.search);
const autoQ = urlParams.get('q');
if (autoQ) {
  // 괄호 앞 부분만 추출하고 슬래시 정리 (예: "ADX/DMI(14)" → "ADX DMI")
  const cleanQ = autoQ.replace(/\(.*/, '').replace(/\//g, ' ').trim();
  document.getElementById('search-input').value = cleanQ;
  curSearch = cleanQ;
  // 해당 카드 자동 펼침
  setTimeout(() => {
    const firstCard = document.querySelector('.card');
    if (firstCard) firstCard.classList.add('open');
  }, 100);
}

// "차트로" 링크: 차트에서 넘어온 종목(code/name)이 있으면 유지해서 되돌아감
(function fixBackLink(){
  const backLink = document.querySelector('#header .back');
  if (!backLink) return;
  const code = urlParams.get('code');
  const name = urlParams.get('name');
  if (code) {
    const qp = new URLSearchParams();
    qp.set('code', code);
    if (name) qp.set('name', name);
    backLink.href = 'kg-chart.html?' + qp.toString();
  }
})();

render();
</script>
</body>
</html>
